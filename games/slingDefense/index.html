      + this.rng() * Math.max(0, rightBound - leftBound - maxWidth);
    const slots = new Array(ev.members.length);
    const frontMaxR = front.length ? Math.max(...front.map(i => ENEMY_DEFS[ev.members[i]].radius)) : 0;
    const rearMaxR = rear.length ? Math.max(...rear.map(i => ENEMY_DEFS[ev.members[i]].radius)) : 0;
    const frontY = rear.length ? BATTLE.top + frontMaxR + rearMaxR + gap + 8 : null;
    for (const [row, isFront] of [[front, true], [rear, false]]) {
      let x = centerX - rowWidth(row) / 2;
      for (const i of row) {
        const d = ENEMY_DEFS[ev.members[i]];
        slots[i] = { x: x + d.radius,
          y: isFront && frontY !== null ? frontY : BATTLE.top - d.radius };
        x += 2 * d.radius + gap;
      }
    }
    ev.spawnedAt = [];
    ev.members.forEach((t, i) => {
      const spot = slots[i];
      const e = new Enemy(t, spot.x, spot.y);
      game.enemies.push(e);
      ev.spawnedAt.push(e);
      this.spawned++;
    });
  }
}

/* =====================================================================
 * 9.5 LaunchModel — ドラッグ距離 → 射出速度
 *     射出速度 = sensitivity × 基準カーブ(min(距離, 最大引き距離))
 *                × powerScale
 *     倍率は speed() の1か所でのみ掛ける（二重適用を防ぐ）
 * ===================================================================== */
const LaunchModel = {
  get maxDrag() {
    const L = CONFIG.launcher;
    return L.baseMaxDrag * L.maxDragScale;
  },
  baseSpeed(d) {
    const L = CONFIG.launcher;
    const t = Util.clamp((d - L.minDrag) / (L.baseMaxDrag - L.minDrag), 0, 1);
    return L.baseMinSpeed + t * (L.baseMaxSpeed - L.baseMinSpeed);
  },
  speed(d) {
    const L = CONFIG.launcher;
    return L.sensitivity * L.powerScale * this.baseSpeed(Math.min(d, this.maxDrag));
  },
  // 0〜1：ゲージ表示とドラッグ音に使う引き具合（最大引き距離で1に到達）
  tension(d) {
    const L = CONFIG.launcher;
    return Util.clamp((d - L.minDrag) / (this.maxDrag - L.minDrag), 0, 1);
  },
  get maxSpeed() { return this.speed(this.maxDrag); },
};

/* =====================================================================
 * 9.55 Preferences — 描画・音量設定（ブラウザごとに保存）
 * 5段階: 0, 25, 50, 75, 100%。未設定時はすべて100%。
 * ===================================================================== */
const Preferences = {
  storageKey: 'sling-preferences-v1',
  allyOutline: true,
  master: 4, bgm: 4, sfx: 4,
  init() {
    try {
      const saved = JSON.parse(localStorage.getItem(this.storageKey) || '{}');
      if (typeof saved.allyOutline === 'boolean') this.allyOutline = saved.allyOutline;
      for (const key of ['master', 'bgm', 'sfx']) {
        if (Number.isInteger(saved[key]) && saved[key] >= 0 && saved[key] <= 4)
          this[key] = saved[key];
      }
    } catch (_) { /* 保存機能が利用できない場合でもプレイ可能 */ }
  },
  save() {
    try {
      localStorage.setItem(this.storageKey, JSON.stringify({
        allyOutline: this.allyOutline, master: this.master, bgm: this.bgm, sfx: this.sfx,
      }));
    } catch (_) { /* プライベートブラウジング等 */ }
  },
  setOutline(enabled) { this.allyOutline = !!enabled; this.save(); },
  setVolume(which, level) {
    if (!['master', 'bgm', 'sfx'].includes(which) || !Number.isInteger(level) || level < 0 || level > 4)
      return false;
    this[which] = level;
    this.save();
    Sound.applyVolumes();
    return true;
  },
  volume(which) { return this[which] / 4; },
};

/* =====================================================================
 * 9.6 Sound — Web Audio API による効果音
 *     ドラッグ音は柔らかい三角波＋微かな正弦波で生成し、周波数・音量を滑らかに変える
 * ===================================================================== */
const Sound = {
  ctx: null,
  master: null,
  muted: false,
  drag: null,          // 現在のドラッグ音（常に最大1本）
  activeVoices: 0,     // 鳴っているドラッグ音の数（重複検証用）
  _primed: false,

  init() {
    try { this.muted = localStorage.getItem('sling-muted') === '1'; } catch (_) { /* 保存不可環境 */ }
  },
  ensure() {
    if (this.ctx) return this.ctx;
    const AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return null;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : CONFIG.audio.masterVolume * Preferences.volume('master');
    // 出力の手前にリミッター（コンプレッサー）を置き、音が重なっても割れないようにする
    this.limiter = this.ctx.createDynamicsCompressor();
    const lm = this.limiter;
    lm.threshold.value = -14; lm.knee.value = 6; lm.ratio.value = 12;
    lm.attack.value = 0.003; lm.release.value = 0.15;
    this.master.connect(lm);
    lm.connect(this.ctx.destination);
    // 戦闘・クリアの効果音はこのバスを通す
    this.sfxBus = this.ctx.createGain();
    this.sfxBus.gain.value = CONFIG.audio.sfxVolume * Preferences.volume('sfx');
    this.sfxBus.connect(this.master);
    this.musicBus = this.ctx.createGain();
    this.musicBus.gain.value = CONFIG.audio.musicVolume * Preferences.volume('bgm');
    this.musicBus.connect(this.master);
    return this.ctx;
  },
  // iOS Safari 等：ユーザー操作の中で再開しないと音が出ない
  unlock() {
    const c = this.ensure();
    if (!c) return;
    if (c.state !== 'running' && c.resume) c.resume().catch(() => {});
    if (!this._primed) {
      const src = c.createBufferSource();
      src.buffer = c.createBuffer(1, 1, 22050);
      src.connect(c.destination);
      src.start(0);
      this._primed = true;
    }
  },
  // 設定画面の操作は再生中の音にも即座に反映（音量の急変を抑える）
  applyVolumes() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const values = [
      [this.master, this.muted ? 0 : CONFIG.audio.masterVolume * Preferences.volume('master')],
      [this.musicBus, CONFIG.audio.musicVolume * Preferences.volume('bgm')],
      [this.sfxBus, CONFIG.audio.sfxVolume * Preferences.volume('sfx')],
    ];
    for (const [node, value] of values) {
      if (!node) continue;
      const gain = node.gain;
      gain.cancelScheduledValues(now);
      gain.setValueAtTime(gain.value, now);
      gain.linearRampToValueAtTime(value, now + 0.035);
    }
  },
  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem('sling-muted', m ? '1' : '0'); } catch (_) { /* 保存不可環境 */ }
    if (m) { this.dragEnd('cancel'); this.stopSfx(true); this.stopBgm(); }
    if (this.master) {
      const now = this.ctx.currentTime;
      const gp = this.master.gain;
      gp.cancelScheduledValues(now);
      gp.setValueAtTime(gp.value, now);
      gp.linearRampToValueAtTime(m ? 0 : CONFIG.audio.masterVolume * Preferences.volume('master'), now + 0.03);
    }
  },

  dragStart(tension) {
    if (this.muted) return;
    const c = this.ensure();
    if (!c) return;
    this.dragEnd('launch');                       // 万一残っていれば即座に止める
    const now = c.currentTime;

    // 旧sawtooth＋squareの鋭い電子音を廃止。三角波を主音、正弦波を微かな倍音とし、
    // 張力に合わせて音程が緩やかに上昇する小さな「紐が張る音」にする。
    const out = c.createGain();
    out.gain.setValueAtTime(0, now);
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    const o1 = c.createOscillator(); o1.type = 'triangle';
    const o2 = c.createOscillator(); o2.type = 'sine';
    const g2 = c.createGain(); g2.gain.value = 0.11;
    const lfo = c.createOscillator(); lfo.type = 'sine';
    const lfoGain = c.createGain();

    lfo.connect(lfoGain); lfoGain.connect(o1.frequency); // 微かな揺れは主音のみ
    o1.connect(filter); o2.connect(g2); g2.connect(filter);
    filter.connect(out); out.connect(this.sfxBus);  // 引っ張り音も効果音の設定に従う

    const v = { out, filter, o1, o2, g2, lfo, lfoGain, t: -1 };
    this.applyTension(v, tension, now, true);
    out.gain.linearRampToValueAtTime(this.dragGain(tension), now + 0.085);
    o1.start(now); o2.start(now); lfo.start(now);
    this.activeVoices++;
    o1.onended = () => {
      this.activeVoices--;
      [o1, o2, g2, lfo, lfoGain, filter, out].forEach(n => { try { n.disconnect(); } catch (_) {} });
    };
    this.drag = v;
  },

  dragGain(t) {
    t = Util.clamp(t, 0, 1);
    return CONFIG.audio.dragVolume * (0.35 + 0.65 * Math.pow(t, 0.85));
  },
  dragFreq(t) { return CONFIG.audio.dragBaseFreq * Math.pow(2, Util.clamp(t, 0, 1) * CONFIG.audio.dragOctaves); },

  applyTension(v, t, now, immediate) {
    t = Util.clamp(t, 0, 1);
    if (!immediate && Math.abs(t - v.t) < 0.003) return;
    v.t = t;
    const f = this.dragFreq(t);
    const set = (param, value) => {
      if (immediate) param.setValueAtTime(value, now);
      else param.setTargetAtTime(value, now, CONFIG.audio.smoothing);
    };
    set(v.o1.frequency, f);
    set(v.o2.frequency, f * 2);                   // 控えめな倍音。周波数を揃えて不快なうなりを回避
    set(v.filter.frequency, 390 + 650 * t);
    set(v.filter.Q, 0.65);                      // 旧実装の強い共振音を除去
    set(v.lfo.frequency, 2.2 + 1.8 * t);
    set(v.lfoGain.gain, 0.5 + 1.5 * t);         // ピッチの揺れは最大2Hz程度
    if (!immediate) set(v.out.gain, this.dragGain(t));
  },

  dragUpdate(tension) {
    if (!this.drag || !this.ctx) return;
    this.applyTension(this.drag, tension, this.ctx.currentTime, false);
  },

  // reason: 'launch' は素早く減衰、'cancel' は自然にフェードアウト
  dragEnd(reason) {
    const v = this.drag;
    if (!v) return;
    this.drag = null;
    const now = this.ctx.currentTime;
    const tau = reason === 'launch' ? CONFIG.audio.releaseLaunch : CONFIG.audio.releaseCancel;
    const g = v.out.gain;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.setTargetAtTime(0, now, tau);
    const stopAt = now + tau * 5 + 0.01;          // 約-43dBまで減衰した時点で停止
    v.o1.stop(stopAt); v.o2.stop(stopAt); v.lfo.stop(stopAt);
  },

  launch(power) {
    if (this.muted) return;
    const c = this.ensure();
    if (!c) return;
    const now = c.currentTime, vol = CONFIG.audio.launchVolume;
    const o = c.createOscillator(); o.type = 'square';
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2400;
    const g = c.createGain();
    const f0 = 260 + 420 * power;
    o.frequency.setValueAtTime(f0, now);
    o.frequency.exponentialRampToValueAtTime(f0 * 2.6, now + 0.1);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.17);
    o.connect(f); f.connect(g); g.connect(this.sfxBus);  // 射出音も効果音の設定に従う
    o.start(now); o.stop(now + 0.2);
    o.onended = () => { [o, f, g].forEach(n => { try { n.disconnect(); } catch (_) {} }); };
  },

  /* ---------- 戦闘・クリアの効果音 ----------
   * 1回の効果音（event）は、短いオシレーターやノイズ（voice）を数本組み合わせて作る。
   * 種類ごとに同時発音数と最短間隔で間引き、出力手前のリミッターで最大音量を抑える。 */

  // 射撃音のプリセット（ユニット定義の shooter.sound で選ぶ）
  SHOT_SOUNDS: {
    blip: [ { type: 'square', f0: 1250, f1: 380, dur: 0.07 },
            { type: 'triangle', f0: 2500, f1: 900, dur: 0.035, gain: 0.4 } ],
  },
  // 敵の攻撃音のプリセット（敵定義の attackSound で選ぶ）。ranged は将来の射撃する敵用
  ENEMY_ATTACK_SOUNDS: {
    melee:  [ { noise: true, filter: 'lowpass', fq0: 1400, fq1: 300, dur: 0.06 },
              { type: 'square', f0: 170, f1: 55, dur: 0.09, gain: 0.8 } ],
    ranged: [ { type: 'sawtooth', f0: 520, f1: 140, dur: 0.12 } ],
    artillery: [ { type: 'triangle', f0: 170, f1: 45, dur: 0.24, gain: 1.0 },
                 { noise: true, filter: 'lowpass', fq0: 1250, fq1: 250, dur: 0.2, gain: 0.6 } ],
  },

  active: { shot: 0, enemyAttack: 0, destroy: 0, fanfare: 0, heal: 0,
            impact: 0, hit: 0, explosion: 0, breach: 0, gameover: 0, ui: 0, slider: 0 },
  lastAt: {},
  sfx: new Set(),                // 鳴っている効果音（中断時にまとめて止める）
  destroyed: new WeakSet(),      // 撃破音を鳴らし済みのユニット
  stats: { shot: 0, enemyAttack: 0, destroy: 0, fanfare: 0, heal: 0,
           impact: 0, hit: 0, explosion: 0, breach: 0, gameover: 0, ui: 0, slider: 0, secret: 0, skipped: 0 },
  _noise: null,

  noiseBuffer() {
    if (!this._noise) {
      const c = this.ctx, len = Math.floor(c.sampleRate * 0.5);
      this._noise = c.createBuffer(1, len, c.sampleRate);
      const d = this._noise.getChannelData(0);
      let seed = 1;
      for (let i = 0; i < len; i++) { seed = (seed * 16807) % 2147483647; d[i] = seed / 1073741823.5 - 1; }
    }
    return this._noise;
  },

  // 鳴らしてよいか：ミュート・同時発音数・最短間隔を確認
  begin(cat) {
    if (this.muted) return null;
    const c = this.ensure();
    if (!c) return null;
    const L = CONFIG.audio.limits[cat], now = c.currentTime;
    if (this.active[cat] >= L.max || (this.lastAt[cat] !== undefined && now - this.lastAt[cat] < L.gap)) {
      this.stats.skipped++;
      return null;
    }
    this.lastAt[cat] = now;
    return c;
  },

  // voice の配列を1回の効果音として鳴らす。vol は効果音全体の音量
  play(cat, voices, vol, delayBase = 0) {
    const c = this.ctx, out = c.createGain(), t0 = c.currentTime;
    out.gain.value = 1;
    out.connect(this.sfxBus);
    const nodes = [out];
    let lastSrc = null, lastEnd = -1;
    for (const v of voices) {
      const start = t0 + delayBase + (v.delay || 0), end = start + v.dur;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol * (v.gain ?? 1)), start + (v.attack ?? 0.004));
      g.gain.exponentialRampToValueAtTime(0.0001, end);
      let src;
      if (v.noise) {
        src = c.createBufferSource();
        src.buffer = this.noiseBuffer();
        const f = c.createBiquadFilter();
        f.type = v.filter || 'lowpass';
        f.frequency.setValueAtTime(v.fq0, start);
        f.frequency.exponentialRampToValueAtTime(v.fq1 || v.fq0, end);
        src.connect(f); f.connect(g); nodes.push(f);
      } else {
        src = c.createOscillator();
        src.type = v.type;
        src.frequency.setValueAtTime(v.f0, start);
        if (v.f1) src.frequency.exponentialRampToValueAtTime(v.f1, end);
        src.connect(g);
      }
      g.connect(out);
      nodes.push(src, g);
      src.start(start);
      src.stop(end + 0.02);
      if (end > lastEnd) { lastEnd = end; lastSrc = src; }
    }
    const rec = { cat, out, nodes, srcs: nodes.filter(n => n.stop) };
    this.sfx.add(rec);
    this.active[cat]++;
    this.stats[cat]++;
    lastSrc.onended = () => {
      if (!this.sfx.has(rec)) return;
      this.sfx.delete(rec);
      this.active[cat]--;
      for (const n of nodes) { try { n.disconnect(); } catch (_) {} }
    };
    return rec;
  },

  /* ---------- 滑走音 ----------
   * 種類（basic / metal）ごとに持続音を最大1本だけ作り、滑っている全ユニットの速さから
   * 音量と音質を決める。ユニット数が増えても音源は増えない。誰も滑っていなければ止めて破棄する。 */
  slides: { basic: null, metal: null },

  slideKind(def) { return def.slideSound || 'basic'; },

  // 毎フレーム呼ぶ。プレイ中の、固定されていない・一定速度以上のユニットだけを集計
  updateSlide(game) {
    const A = CONFIG.audio;
    const agg = { basic: { sum2: 0, max: 0, n: 0 }, metal: { sum2: 0, max: 0, n: 0 } };
    if (!this.muted && this.ctx && (game.state === 'playing' || game.isResultSettling()) && game.hitstopRemaining <= 0) {
      for (const a of game.allies) {
        if (!a.alive || a.anchored) continue;
        const v = Math.hypot(a.vx, a.vy);
        if (v < A.slideMinSpeed) continue;
        const k = agg[this.slideKind(a.def)] || agg.basic;
        const r = v / A.slideRefSpeed;
        k.sum2 += r * r; k.max = Math.max(k.max, r); k.n++;
      }
    }
    for (const kind of ['basic', 'metal']) {
      const k = agg[kind];
      if (k.n === 0) { this.slideStop(kind); continue; }
      // 強さ：速さの二乗和の平方根（台数が増えても √ で緩やかに増え、1で頭打ち）
      const level = Math.min(1, Math.sqrt(k.sum2));
      this.slideSet(kind, level, Math.min(1, k.max));
    }
  },

  slideSet(kind, level, speed) {
    const c = this.ctx, A = CONFIG.audio, now = c.currentTime, tau = A.slideFade;
    let v = this.slides[kind];
    if (!v) v = this.slides[kind] = this.slideCreate(kind);
    const vol = A.slideVolume[kind] * (0.25 + 0.75 * level);
    if (Math.abs(vol - v.vol) > v.vol * 0.03 + 1e-4) { v.out.gain.setTargetAtTime(vol, now, tau); v.vol = vol; }
    if (Math.abs(speed - v.speed) > 0.02) {
      v.speed = speed;
      if (kind === 'basic') {
        v.bp.frequency.setTargetAtTime(700 + 1900 * speed, now, tau);
        v.grain.frequency.setTargetAtTime(14 + 26 * speed, now, tau);
      } else {
        v.ring.frequency.setTargetAtTime(2300 + 1600 * speed, now, tau);
        v.body.frequency.setTargetAtTime(240 + 260 * speed, now, tau);
        v.o1.frequency.setTargetAtTime(95 + 70 * speed, now, tau);
        v.o2.frequency.setTargetAtTime(97.5 + 73 * speed, now, tau);
      }
    }
  },

  slideCreate(kind) {
    const c = this.ctx, now = c.currentTime;
    const out = c.createGain();
    out.gain.setValueAtTime(0, now);
    out.connect(this.sfxBus);
    const noise = c.createBufferSource();
    noise.buffer = this.noiseBuffer(); noise.loop = true;
    const v = { kind, out, vol: 0, speed: -1, srcs: [noise], nodes: [out, noise] };
    if (kind === 'basic') {
      // 乾いた摩擦音：帯域を絞ったノイズを、矩形波で細かく刻む（レトロな「ザザザ」）
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4; bp.frequency.value = 900;
      const chop = c.createGain(); chop.gain.value = 0.6;
      const grain = c.createOscillator(); grain.type = 'square'; grain.frequency.value = 18;
      const depth = c.createGain(); depth.gain.value = 0.4;
      grain.connect(depth); depth.connect(chop.gain);
      noise.connect(bp); bp.connect(chop); chop.connect(out);
      grain.start(now);
      Object.assign(v, { bp, grain });
      v.srcs.push(grain); v.nodes.push(bp, chop, grain, depth);
    } else {
      // 金属の摩擦音：高いQで響く帯域ノイズ（キーン）＋低いうなり（ギギギ）
      const ring = c.createBiquadFilter(); ring.type = 'bandpass'; ring.Q.value = 9; ring.frequency.value = 2600;
      const rg = c.createGain(); rg.gain.value = 0.9;
      noise.connect(ring); ring.connect(rg); rg.connect(out);
      const body = c.createBiquadFilter(); body.type = 'lowpass'; body.Q.value = 4; body.frequency.value = 300;
      const o1 = c.createOscillator(); o1.type = 'square'; o1.frequency.value = 100;
      const o2 = c.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 103;
      const bg = c.createGain(); bg.gain.value = 0.35;
      o1.connect(body); o2.connect(body); body.connect(bg); bg.connect(out);
      o1.start(now); o2.start(now);
      Object.assign(v, { ring, body, o1, o2 });
      v.srcs.push(o1, o2); v.nodes.push(ring, rg, body, o1, o2, bg);
    }
    noise.start(now);
    return v;
  },

  // フェードして止め、少し後に破棄する（クリックノイズ防止）
  slideStop(kind, fast = false) {
    const v = this.slides[kind];
    if (!v) return;
    this.slides[kind] = null;
    const now = this.ctx.currentTime, tau = fast ? 0.01 : CONFIG.audio.slideFade;
    v.out.gain.cancelScheduledValues(now);
    v.out.gain.setValueAtTime(v.out.gain.value, now);
    v.out.gain.setTargetAtTime(0, now, tau);
    const end = now + tau * 6 + 0.01;
    for (const sn of v.srcs) { try { sn.stop(end); } catch (_) {} }
    v.srcs[0].onended = () => { for (const n of v.nodes) { try { n.disconnect(); } catch (_) {} } };
  },

  shot(kind = 'blip') {
    if (!this.begin('shot')) return;
    this.play('shot', this.SHOT_SOUNDS[kind] || this.SHOT_SOUNDS.blip, CONFIG.audio.shotVolume);
  },

  enemyAttack(kind = 'melee') {
    if (!this.begin('enemyAttack')) return;
    this.play('enemyAttack', this.ENEMY_ATTACK_SOUNDS[kind] || this.ENEMY_ATTACK_SOUNDS.melee, CONFIG.audio.enemyAttackVolume);
  },

  // side: 'enemy' は明るく短い、'ally' は低く長い。同じユニットでは1回だけ
  destroy(side, unit) {
    if (unit) { if (this.destroyed.has(unit)) return; this.destroyed.add(unit); }
    if (!this.begin('destroy')) return;
    const voices = side === 'ally'
      ? [ { noise: true, filter: 'lowpass', fq0: 1600, fq1: 200, dur: 0.24 },
          { type: 'triangle', f0: 340, f1: 50, dur: 0.38, gain: 0.9 },
          { type: 'square', f0: 170, f1: 40, dur: 0.30, gain: 0.35 } ]
      : [ { noise: true, filter: 'bandpass', fq0: 3200, fq1: 500, dur: 0.16 },
          { type: 'square', f0: 620, f1: 90, dur: 0.24, gain: 0.7 } ];
    this.play('destroy', voices, CONFIG.audio.destroyVolume);
  },

  // ヒットストップ時の衝突音：速度・衝突威力・破壊に応じて低音、金属音、破砕ノイズを重ねる。
  // 通常の押し合いは軽く、高威力の連鎖衝突では明確に派手になる。
  impact(speed, metal = false, power = 0, stopDuration = 0, lethal = false) {
    if (!this.begin('impact')) return;
    const speedStrength = Util.clamp((speed - 90) / 1150, 0, 1);
    const powerStrength = Util.clamp(power / 7, 0, 1);
    const strength = Util.clamp(0.54 * speedStrength + 0.46 * powerStrength + (lethal ? 0.22 : 0), 0, 1);
    const stopping = stopDuration > 0;
    const base = metal ? 540 : 320;
    const voices = [
      { type: metal ? 'triangle' : 'square', f0: base + 320 * strength,
        f1: 72 + 90 * strength, dur: 0.09 + 0.10 * strength, gain: 1.0 },
      { noise: true, filter: metal ? 'bandpass' : 'lowpass',
        fq0: metal ? 5200 : 3300, fq1: 280, dur: 0.065 + 0.11 * strength, gain: 0.60 },
    ];
    if (stopping) {
      voices.push({ type: 'sawtooth', f0: 155 + 90 * strength,
        f1: 38, dur: 0.15 + 0.09 * strength, gain: 0.95 });
      voices.push({ noise: true, filter: 'lowpass', fq0: 950 + 950 * strength,
        fq1: 110, dur: 0.13 + 0.09 * strength, gain: 0.85 });
      if (strength >= 0.62 || lethal) voices.push({
        type: 'square', f0: 680 + 550 * strength, f1: 125,
        dur: 0.11 + 0.08 * strength, gain: 0.45,
      });
    }
    this.play('impact', voices, CONFIG.audio.impactVolume
      * (0.40 + 0.75 * strength + (stopping ? 0.34 : 0) + (lethal ? 0.12 : 0)));
  },

  hit(side = 'enemy') {
    if (!this.begin('hit')) return;
    const ally = side === 'ally';
    this.play('hit', [
      { type: ally ? 'sawtooth' : 'square', f0: ally ? 310 : 920,
        f1: ally ? 95 : 250, dur: ally ? 0.13 : 0.075, gain: 0.8 },
      { noise: true, filter: 'lowpass', fq0: ally ? 1800 : 3400,
        fq1: 420, dur: 0.075, gain: 0.4 },
    ], CONFIG.audio.hitVolume);
  },

  explosion() {
    if (!this.begin('explosion')) return;
    this.play('explosion', [
      { noise: true, filter: 'lowpass', fq0: 2800, fq1: 100, dur: 0.39, gain: 1.0 },
      { type: 'triangle', f0: 135, f1: 38, dur: 0.36, gain: 0.8 },
      { type: 'square', f0: 76, f1: 35, dur: 0.20, gain: 0.25 },
    ], CONFIG.audio.explosionVolume);
  },

  breach() {
    if (!this.begin('breach')) return;
    this.play('breach', [
      { type: 'sawtooth', f0: 660, f1: 130, dur: 0.32, gain: 0.8 },
      { type: 'triangle', f0: 240, f1: 70, dur: 0.36, gain: 0.9 },
    ], CONFIG.audio.breachVolume);
  },

  defeat() {
    if (!this.begin('gameover')) return;
    this.play('gameover', [
      { type: 'square', f0: 392, f1: 260, dur: 0.32, delay: 0, gain: 0.75 },
      { type: 'square', f0: 311, f1: 205, dur: 0.40, delay: 0.23, gain: 0.7 },
      { type: 'triangle', f0: 220, f1: 80, dur: 0.65, delay: 0.48, gain: 1.0 },
      { noise: true, filter: 'lowpass', fq0: 700, fq1: 85, dur: 0.6, delay: 0.48, gain: 0.25 },
    ], CONFIG.audio.gameoverVolume);
  },

  ui(kind = 'hold') {
    if (!this.begin('ui')) return;
    const sounds = {
      hold: [ { type: 'triangle', f0: 620, f1: 880, dur: 0.09 },
              { type: 'sine', f0: 930, f1: 1120, dur: 0.095, delay: 0.055, gain: 0.7 } ],
      deny: [ { type: 'square', f0: 215, f1: 120, dur: 0.13, gain: 0.6 } ],
      confirm: [ { type: 'triangle', f0: 520, f1: 785, dur: 0.12, gain: 0.8 } ],
    };
    this.play('ui', sounds[kind] || sounds.hold, CONFIG.audio.uiVolume);
  },

  // 設定ボタン10連打による隠しモード解放：上昇する3音と明るいフィニッシュ。
  // 通常のUI音とは別系統にし、直前のタップ音で間引かれないようにする。
  unlimitedUnlock() {
    if (!this.begin('secret')) return;
    this.play('secret', [
      { type: 'square', f0: 523, f1: 523, dur: 0.13, delay: 0.00, gain: 0.65 },
      { type: 'square', f0: 659, f1: 659, dur: 0.13, delay: 0.13, gain: 0.65 },
      { type: 'square', f0: 784, f1: 784, dur: 0.15, delay: 0.26, gain: 0.70 },
      { type: 'triangle', f0: 1047, f1: 1319, dur: 0.38, delay: 0.40, gain: 1.0 },
      { type: 'sine', f0: 523, f1: 659, dur: 0.32, delay: 0.40, gain: 0.55 },
    ], CONFIG.audio.uiVolume * 1.8);
  },

  // 音量スライダーが25%の目盛りを越えたときの聞き取りやすい短い確認音。
  // 効果音バスを通すためマスター音量・効果音量・ミュート設定を尊重する。
  sliderTick() {
    if (!this.begin('slider')) return;
    this.play('slider', [
      { type: 'triangle', f0: 930, f1: 690, dur: 0.080, gain: 0.9 },
      { type: 'sine', f0: 1450, f1: 990, dur: 0.065, gain: 0.35 },
    ], CONFIG.audio.uiVolume * 1.1);
  },

  healImpact() {
    if (!this.begin('heal')) return;
    this.play('heal', [
      { type: 'sine', f0: 1100, f1: 1550, dur: 0.18, gain: 0.6 },
    ], CONFIG.audio.healVolume * 0.75);
  },

  // ヒールの回復弾：柔らかく上がる「ポロン」（三角波＋正弦波）
  healShot() {
    if (!this.begin('heal')) return;
    this.play('heal', [
      { type: 'triangle', f0: 700, f1: 1400, dur: 0.12 },
      { type: 'sine', f0: 1400, f1: 2100, dur: 0.1, delay: 0.04, gain: 0.6 },
    ], CONFIG.audio.healVolume);
  },

  // フェーズクリア：上昇するアルペジオ → 和音を伸ばす（約1.2秒）
  fanfare() {
    if (!this.begin('fanfare')) return;
    const N = { C5: 523.25, E5: 659.25, G5: 783.99, C6: 1046.5, E6: 1318.5, G4: 392.0, C4: 261.63 };
    const step = 0.09, v = [];
    ['C5', 'E5', 'G5', 'C6', 'E6'].forEach((n, i) => v.push({ type: 'square', f0: N[n], dur: step * 0.9, delay: i * step, gain: 0.8 }));
    const hold = 5 * step + 0.04;
    v.push({ type: 'square',   f0: N.C6, dur: 0.7, delay: hold, gain: 0.8, attack: 0.01 });
    v.push({ type: 'triangle', f0: N.G5, dur: 0.7, delay: hold, gain: 0.7, attack: 0.01 });
    v.push({ type: 'triangle', f0: N.C4, dur: 0.75, delay: hold, gain: 0.9, attack: 0.01 });
    ['G4', 'C5'].forEach((n, i) => v.push({ type: 'triangle', f0: N[n], dur: step * 1.8, delay: i * step * 2, gain: 0.6 }));
    this.play('fanfare', v, CONFIG.audio.fanfareVolume);
  },

  /* ---------- BGM ----------
   * オリジナル4小節の8bit風ループ (Am–F–C–G)。Web Audioで自動合成し、外部音源は不要。
   * updateBgm() は描画ごとに呼ぶが、0.17秒先まで先行予約するため音のタイミングはフレームレートに依存しない。
   * 音源の個数は固定上限のない蓄積を避け、鳴り終わったら必ずdisconnectする。
   */
  music: { playing: false, step: 0, nextAt: 0, voices: new Set() },
  musicNoteFrequency(midi) { return 440 * Math.pow(2, (midi - 69) / 12); },

  musicVoice(start, dur, gain, type, midi, sweepTo = null, noise = false) {
    const c = this.ctx, m = this.music;
    const src = noise ? c.createBufferSource() : c.createOscillator();
    const out = c.createGain();
    const nodes = [src, out];
    const end = start + dur;
    if (noise) {
      src.buffer = this.noiseBuffer();
      const filter = c.createBiquadFilter();
      filter.type = 'highpass'; filter.frequency.value = 4000;
      src.connect(filter); filter.connect(out); nodes.push(filter);
    } else {
      src.type = type;
      const hz = this.musicNoteFrequency(midi);
      src.frequency.setValueAtTime(hz, start);
      if (sweepTo !== null) src.frequency.exponentialRampToValueAtTime(Math.max(20, sweepTo), end);
      src.connect(out);
    }
    out.connect(this.musicBus);
    out.gain.setValueAtTime(0.0001, start);
    out.gain.linearRampToValueAtTime(Math.max(0.0002, gain), start + Math.min(0.008, dur * 0.15));
    out.gain.exponentialRampToValueAtTime(0.0001, end);
    const rec = { src, out, nodes };
    m.voices.add(rec);
    src.onended = () => {
      m.voices.delete(rec);
      for (const node of nodes) { try { node.disconnect(); } catch (_) {} }
    };
    src.start(start);
    src.stop(end + 0.015);
  },

  musicStep(index, at) {
    const bar = Math.floor((index % 64) / 16), beat = index % 16;
    const sixteenth = 60 / CONFIG.audio.musicBpm / 4;
    const roots = [45, 41, 48, 43]; // A2, F2, C3, G2
    const chords = [[57, 60, 64, 69], [53, 57, 60, 65],
                    [55, 60, 64, 67], [55, 59, 62, 67]];
    const melodies = [
      [69, null, 72, null, 76, 74, 72, null, 69, null, 67, null, 69, null, 72, null],
      [69, null, 72, null, 77, 76, 72, null, 69, null, 65, null, 67, null, 69, null],
      [67, null, 72, null, 76, 79, 76, null, 72, null, 71, null, 72, null, 76, null],
      [67, null, 71, null, 74, 72, 71, null, 67, null, 64, null, 67, null, 71, null],
    ];
    if (beat % 4 === 0) {
      const bass = roots[bar] + (beat === 12 ? 7 : 0);
      this.musicVoice(at, sixteenth * 3.4, 0.23, 'triangle', bass);
    }
    if (beat % 2 === 1) {
      this.musicVoice(at, sixteenth * 0.76, 0.075, 'triangle', chords[bar][(beat >> 1) % 4] + 12);
    }
    const note = melodies[bar][beat];
    if (note !== null) this.musicVoice(at, sixteenth * 1.7, 0.105, 'square', note);
    if (beat === 0 || beat === 8) this.musicVoice(at, sixteenth * 1.4, 0.18, 'sine', 48, 48);
    if (beat === 4 || beat === 12) {
      this.musicVoice(at, sixteenth * 1.2, 0.09, 'triangle', 52, 85);
      this.musicVoice(at, sixteenth * 1.1, 0.10, 'square', 61, 180);
    }
    if (beat % 2 === 0) this.musicVoice(at, sixteenth * 0.25, 0.028, 'sine', 94);
  },

  updateBgm(state) {
    const m = this.music;
    // メニュー・デッキ編集・戦闘・結果・設定のすべてでBGMを流し続ける。
    // ブラウザが起動直後の自動再生を禁止した場合、最初の操作で音声を再開する。
    if (!['title', 'deckedit', 'playing', 'settings', 'cleared', 'gameover'].includes(state)
        || this.muted || (typeof document !== 'undefined' && document.hidden)) {
      if (m.playing) this.stopBgm();
      return;
    }
    if (!this.ctx || this.ctx.state !== 'running') return;  // 操作前の自動再生禁止を守る
    const now = this.ctx.currentTime;
    if (!m.playing) {
      m.playing = true;
      m.step = 0;
      m.nextAt = now + 0.045;
    }
    // タブ復帰等で大きく遅れたときは、過去の音を大量に予約せず拍を再同期する。
    if (m.nextAt < now - 0.2) m.nextAt = now + 0.045;
    const sixteenth = 60 / CONFIG.audio.musicBpm / 4;
    let scheduled = 0;
    while (m.nextAt < now + 0.17 && scheduled++ < 4) {
      this.musicStep(m.step++, m.nextAt);
      m.nextAt += sixteenth;
    }
  },

  stopBgm() {
    const m = this.music;
    m.playing = false;
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    for (const rec of m.voices) {
      const g = rec.out.gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(Math.max(0.0001, g.value), now);
      g.linearRampToValueAtTime(0.0001, now + 0.035);
      try { rec.src.stop(now + 0.045); } catch (_) { /* 既に停止済み */ }
    }
  },

  // 鳴っている効果音を素早くフェードして止める。includeFanfare=false ならファンファーレは残す
  stopSfx(includeFanfare = false) {
    if (!this.ctx) return;
    this.slideStop('basic', true); this.slideStop('metal', true);
    const now = this.ctx.currentTime;
    for (const rec of this.sfx) {
      if (rec.cat === 'fanfare' && !includeFanfare) continue;
      const g = rec.out.gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(g.value, now);
      g.linearRampToValueAtTime(0, now + 0.03);
      for (const sn of rec.srcs) { try { sn.stop(now + 0.04); } catch (_) {} }
    }
  },
};

/* =====================================================================
 * 10. Launcher — パチンコ式の射出操作
 * ===================================================================== */
class Launcher {
  constructor(game) {
    this.game = game;
    this.x = CONFIG.layout.launcherX;
    this.y = CONFIG.layout.launcherY;
    this.cancel();
    this.denyFlash = 0;
  }
  get currentDef() { return UNIT_DEFS[this.game.deck.current]; }
  spawnPoint() {
    // 射出台の真上、戦闘エリアの内側から飛び出す（エリア外に置かれない）
    return { x: this.x, y: BATTLE.bottom - this.currentDef.radius - 1 };
  }
  canAim() {
    return this.game.state === 'playing' && this.game.cost.canAfford(this.currentDef.cost);
  }
  update(dt) { this.denyFlash = Math.max(0, this.denyFlash - dt); }

  pointerDown(id, gx, gy) {
    if (this.aiming || this.game.state !== 'playing') return false;
    if (Util.dist(gx, gy, this.x, this.y) > CONFIG.launcher.grabRadius) return false;
    if (!this.canAim()) { this.denyFlash = 0.5; Sound.ui('deny'); return false; }
    this.aiming = true;
    this.pointerId = id;
    this.dragX = gx; this.dragY = gy;
    Sound.dragStart(this.tension());
    return true;
  }
  pointerMove(id, gx, gy) {
    if (!this.aiming || id !== this.pointerId) return;
    this.dragX = gx; this.dragY = gy;
    Sound.dragUpdate(this.tension());
  }
  pointerUp(id, gx, gy) {
    if (!this.aiming || id !== this.pointerId) return;
    this.dragX = gx; this.dragY = gy;
    const shot = this.computeShot();
    const launched = shot.state === 'ok' && this.game.tryLaunch(shot.vx, shot.vy);
    this.cancel(launched ? 'launch' : 'cancel');     // キャンセル時はコスト消費なし
    if (launched) Sound.launch(shot.power);
    else if (shot.state === 'ok') { this.denyFlash = 0.5; Sound.ui('deny'); }
  }
  cancelPointer(id) {
    if (this.aiming && id === this.pointerId) this.cancel();
  }
  tension() {
    return LaunchModel.tension(Math.hypot(this.dragX - this.x, this.dragY - this.y));
  }
  // ドラッグ終了は必ずここを通る（射出・キャンセル・フェーズ移行・ゲームオーバー）
  cancel(reason = 'cancel') {
    if (this.aiming) Sound.dragEnd(reason);
    this.aiming = false;
    this.pointerId = null;
    this.dragX = this.x; this.dragY = this.y;
  }

  // ドラッグ方向の逆が射出方向、引いた距離が射出速度
  computeShot() {
    const L = CONFIG.launcher;
    const dx = this.dragX - this.x, dy = this.dragY - this.y;
    const d = Math.hypot(dx, dy);
    const pull = Math.min(d, LaunchModel.maxDrag);
    if (d < L.minDrag) return { state: 'cancel', pull, pullX: dx, pullY: dy };
    const dirX = -dx / d, dirY = -dy / d;
    const power = LaunchModel.tension(d);
    const speed = LaunchModel.speed(d);
    const pullX = (dx / d) * pull, pullY = (dy / d) * pull;
    if (dirY > -L.minUpward) return { state: 'angle', dirX, dirY, power, pull, pullX, pullY };
    return { state: 'ok', dirX, dirY, power, speed, vx: dirX * speed, vy: dirY * speed, pull, pullX, pullY };
  }

  ballPosition() {
    if (!this.aiming) return { x: this.x, y: this.y };
    const s = this.computeShot();
    const r = this.currentDef.radius;
    return {
      x: Util.clamp(this.x + s.pullX, r + 2, CONFIG.screen.width - r - 2),
      y: Util.clamp(this.y + s.pullY, BATTLE.bottom + r + 2, CONFIG.screen.height - r - 2),
    };
  }
}

/* =====================================================================
 * 11. Game — 全体の状態管理とフェーズ進行
 *     state: 'title' | 'playing' | 'cleared' | 'gameover'
 * ===================================================================== */
class Game {
  constructor() {
    this.state = 'title';
    this.phase = 1;
    this.allies = [];
    this.enemies = [];
    this.bullets = [];
    this.enemyShots = [];
    this.enemyBombs = [];
    this.scatterShards = [];
    this.allyHealShots = [];
    this.bombs = [];
    this.effects = [];
    this.trails = [];
    this.cost = new CostManager(CONFIG.cost);
    this.deckCounts = DeckRules.normalize(CONFIG.deck.composition);
    this.deck = new Deck(DeckRules.expand(this.deckCounts));
    this.deckDraft = null;
    this.deckReturn = null;
    this.deckTargetPhase = 1;
    this.hold = null;
    this.holdUsed = false;
    this.holdDeny = 0;
    this.phys = { contacts: new Set(), events: [] };
    this.spawner = new EnemySpawner();
    this.launcher = new Launcher(this);
    this.params = Difficulty.forPhase(1);
    this.healShots = [];
    this.spawner.reset(1, makeRng(1));
    this.breaches = 0;
    this.phaseStartBreaches = 0; // 再挑戦時に復元する、そのフェーズ開始時の突破数
    this.kills = 0;
    this.battleTime = 0;
    this.chainSerial = 0;
    this.chains = new Map();
    this.chainNotice = null;
    this.accumulator = 0;
    this.hitstopRemaining = 0;
    this.stateTime = 0;
    this.settingsReturn = null;
    this.settingsReturnTime = 0;
    this.settingsRestartConfirm = false;
  }

  openSettings() {
    if (this.state === 'settings') return false;
    this.settingsReturn = this.state;
    this.settingsReturnTime = this.stateTime;
    this.settingsRestartConfirm = false;
    this.launcher.cancel();
    Sound.stopSfx();
    this.setState('settings');                         // 戦闘中でも物理演算・回復を一時停止
    return true;
  }
  closeSettings() {
    if (this.state !== 'settings') return false;
    const previous = this.settingsReturn || 'title';
    const time = this.settingsReturnTime;
    this.settingsReturn = null;
    this.settingsRestartConfirm = false;
    this.setState(previous);
    this.stateTime = time;                              // 元の画面の経過時間を維持
    return true;
  }

  // 設定画面から最初からやり直す。実行前の確認を必須とし、
  // 既存のゲームオーバー画面と同じくフェーズ1のデッキ編成へ進む。
  restartFromSettings() {
    if (this.state !== 'settings' || !this.settingsRestartConfirm) return false;
    this.settingsRestartConfirm = false;
    this.settingsReturn = null;
    this.settingsReturnTime = 0;
    this.setState('title');  // 現フェーズを破棄し、編集取消時も戦闘には戻さない
    return this.openDeckEditor(1, 'new', 'title');
  }

  openDeckEditor(targetPhase, mode, fromState) {
    if (this.state === 'playing' || this.launcher.aiming) return false;
    this.deckTargetPhase = targetPhase;
    this.deckNextMode = mode;
    this.deckReturn = fromState || this.state;
    this.deckDraft = { ...this.deckCounts };
    this.deckSelected = 'normal';
    this.setState('deckedit');
    return true;
  }
  editDeck(type, delta) {
    if (this.state !== 'deckedit' || !(type in this.deckDraft)) return false;
    const amount = this.deckDraft[type] + delta;
    if (amount < 0 || amount > CONFIG.deck.size) return false;
    if (delta > 0 && this.deckDraftTotal() >= CONFIG.deck.size) return false;
    if (delta > 0 && this.deckDraft[type] === 0 && this.deckDraftTypes() >= DeckRules.typeCap(this.deckTargetPhase)) return false;
    this.deckDraft[type] = amount;
    this.deckSelected = type;                            // ＋／−で個数を変えたユニットを選択する
    return true;
  }
  deckDraftTotal() { return Object.values(this.deckDraft).reduce((s, n) => s + n, 0); }
  deckDraftTypes() { return Object.values(this.deckDraft).filter(n => n > 0).length; }
  confirmDeck() {
    if (this.state !== 'deckedit' || !DeckRules.validate(this.deckDraft, this.deckTargetPhase)) return false;
    this.deckCounts = { ...this.deckDraft };
    this.deck = new Deck(DeckRules.expand(this.deckCounts));
    this.startPhase(this.deckTargetPhase, this.deckNextMode);
    return true;
  }
  cancelDeck() {
    if (this.state !== 'deckedit') return false;
    this.setState(this.deckReturn || 'title');
    return true;
  }
  // mode：'new' = 新しいゲーム（初期コスト）、'next' = 次のフェーズ（今のコストを引き継ぐ）、
  //       'retry' = 同じフェーズの再挑戦（そのフェーズ開始時のコストに戻す）
  startPhase(n, mode = 'new') {
    this.phase = n;
    this.params = Difficulty.forPhase(n);
    this.allies = [];
    this.enemies = [];
    this.bullets = [];
    this.enemyShots = [];
    this.enemyBombs = [];
    this.scatterShards = [];
    this.allyHealShots = [];
    this.bombs = [];
    this.effects = [];
    this.trails = [];
    // 突破数はゲーム全体で累積。クリア後は維持し、再挑戦では開始時点まで戻す。
    const breaches = mode === 'next' ? this.breaches
      : mode === 'retry' ? (this.phaseStartBreaches ?? 0) : 0;
    this.breaches = breaches;
    this.phaseStartBreaches = breaches;
    this.kills = 0;
    this.battleTime = 0;
    this.chains.clear();
    this.chainNotice = null;
    this.phys = { contacts: new Set(), events: [] };
    this.hold = null;          // HOLD枠のユニット種類（空なら null）
    this.holdUsed = false;     // 射出するまでHOLDは1回だけ
    const carry = mode === 'next' ? this.cost.value
      : mode === 'retry' ? (this.phaseStartCost ?? this.params.initialCost)
      : this.params.initialCost;
    this.cost.reset(carry);
    this.phaseStartCost = carry;                        // 再挑戦用に、このフェーズ開始時のコストを覚えておく
    if (CONFIG.deck.resetOnPhaseStart) this.deck.reset();
    this.healShots = [];
    const seed = CONFIG.waves.seed ?? Math.floor(Math.random() * 2 ** 31);
    this.waveSeed = seed;                              // 確認用：同じシードなら同じ召喚予定
    this.spawner.reset(n, makeRng(seed + n * 7919));
    this.launcher.cancel();
    this.accumulator = 0;
    this.hitstopRemaining = 0;
    Sound.stopSfx();                                     // 前のフェーズの戦闘音を止める（ファンファーレは途切れさせない）
    this.setState('playing');
  }

  setState(s) {
    this.state = s;
    this.stateTime = 0;
    if (s !== 'playing') {
      this.launcher.cancel();
      // 結果表示までの0.7秒は戦場の反射・衝撃を続けるため、ヒットストップも引き継ぐ。
      if (s !== 'cleared' && s !== 'gameover') this.hitstopRemaining = 0;
    }
    // メニュー・編成・結果画面への遷移ではBGMを止めない。音声の停止はミュート／タブ非表示時のみ。
  }

  // 結果UI待機中も、入力と召喚は停止しながら戦場の物理・残像・攻撃・エフェクトは更新する。
  isResultSettling() {
    return (this.state === 'cleared' || this.state === 'gameover')
      && this.stateTime < CONFIG.result.overlayDelay;
  }

  // 実時間の経過を受け取り、固定タイムステップで進める
  update(frameDt) {
    const dt = Math.min(Math.max(frameDt, 0), 0.25);
    const previousStateTime = this.stateTime;
    this.stateTime += dt;
    this.advanceRealtimeEffects(dt); // ヒットストップ中も衝撃波が動く。物理演算とは独立。
    this.launcher.update(dt);
    this.holdDeny = Math.max(0, this.holdDeny - dt);
    const resultState = this.state === 'cleared' || this.state === 'gameover';
    if (this.state !== 'playing' && !resultState) { this.accumulator = 0; return; }
    // 表示境界をまたぐフレームでも0.7秒ちょうどまで物理を進める。
    let activeDt = resultState
      ? Math.min(dt, Math.max(0, CONFIG.result.overlayDelay - previousStateTime)) : dt;
    if (activeDt <= 0) { this.accumulator = 0; this.hitstopRemaining = 0; return; }

    // 高速衝突ごとのヒットストップ。クールダウンなしで連鎖発動を許す。
    // 残り時間を消費したフレームでは余剰時間だけ物理演算を進める。
    if (this.hitstopRemaining > 0) {
      const frozen = Math.min(activeDt, this.hitstopRemaining);
      this.hitstopRemaining = Math.max(0, this.hitstopRemaining - frozen);
      activeDt -= frozen;
      if (activeDt < 1e-9) { this.accumulator = 0; return; }
    }

    const h = CONFIG.physics.timestep;
    this.accumulator += activeDt * CONFIG.gameplay.speed;
    let steps = 0;
    while (this.accumulator >= h - 1e-9) {           // 浮動小数の誤差でステップを取りこぼさない
      this.fixedUpdate(h, resultState);
      this.accumulator -= h;
      // このステップの衝突で停止が発動したら、それ以上のステップを同じ描画フレームで進めない。
      if (++steps >= CONFIG.physics.maxStepsPerFrame || (this.state !== 'playing' && !resultState) || this.hitstopRemaining > 0) {
        this.accumulator = 0;
        break;
      }
    }
  }

  fixedUpdate(dt, settling = this.isResultSettling()) {
    // 終了時刻をまたぐ最後のフレームでも、残りの時間分の物理処理を進める。
    this.battleTime += dt;
    // 発射後に途切れた連鎖を定期的に破棄し、メモリを使い続けない。
    for (const [id, c] of this.chains) {
      if (this.battleTime > c.until || this.battleTime - c.lastAt > CONFIG.reflection.chainGap)
        this.chains.delete(id);
    }
    if (this.chainNotice && this.battleTime >= this.chainNotice.until) this.chainNotice = null;
    // フェーズ結果が確定した後は敵を新規召喚せず、報酬・コスト回復も進めない。
    if (!settling) {
      this.cost.update(dt);
      this.spawner.update(dt, this);
    }
    // 同一の固定ステップで実際に変化したHPを記録する。
    // 味方・敵、射撃・衝突・回復、撃破直前のHP変化をすべて同じ規則で表示。
    const hpBefore = new Map();
    for (const unit of [...this.allies, ...this.enemies]) {
      if (unit.alive) hpBefore.set(unit, unit.hp);
    }
    this.updateSpecialPhysics(dt);
    Combat.driveEnemies(this, dt);
    Physics.step(this.bodies(), dt, BATTLE, this.phys);   // 味方と敵をまとめて衝突・押し合い
    KnockbackTrails.update(this, dt);                     // 物理処理に影響しない残像
    this.processPhysicsEvents();
    Combat.updateAllies(this, dt);
    Combat.updateBullets(this, dt);
    Combat.updateAllyHealers(this, dt);
    for (const bomb of this.bombs) bomb.update(dt, this);
    Combat.updateEnemies(this, dt);
    Combat.updateEnemyShots(this, dt);
    for (const b of this.enemyBombs) b.update(dt, this);
    for (const b of this.scatterShards) b.update(dt, this);
    Healing.update(this, dt);
    this.recordHpChanges(hpBefore);
    this.cleanup();
    this.updateEffects(dt);
    if (!settling) this.checkPhaseEnd();
  }

  // HPの増減を共通で検知。ユニット削除より前に調べるため、致死ダメージも表示される。
  recordHpChanges(before) {
    for (const [unit, oldHp] of before) {
      const diff = unit.hp - oldHp;
      if (Math.abs(diff) < 1e-6) continue;
      const magnitude = Math.round(Math.abs(diff) * 100) / 100;
      const label = (diff > 0 ? '+' : '-') + String(magnitude);
      this.addEffect({ kind: 'text', x: unit.x, y: unit.y,
        text: label, magnitude, color: diff > 0 ? PALETTE.green : PALETTE.red, life: 0.8 });
    }
  }

  cleanup() {
    this.allies = this.allies.filter(a => a.alive);
    this.enemies = this.enemies.filter(e => e.alive);
    this.healShots = this.healShots.filter(b => b.alive);
    this.bullets = this.bullets.filter(b => b.alive);
    this.enemyShots = this.enemyShots.filter(b => b.alive);
    this.enemyBombs = this.enemyBombs.filter(b => b.alive);
    this.scatterShards = this.scatterShards.filter(b => b.alive);
    this.allyHealShots = this.allyHealShots.filter(b => b.alive);
    this.bombs = this.bombs.filter(b => b.alive);
  }

  checkPhaseEnd() {
    if (this.state !== 'playing') return;              // 判定（とクリア音・停止処理）はプレイ中に1回だけ
    // 敗北判定をクリア判定より優先
    if (this.breaches >= this.params.breachLimit) {
      // 弾丸・敵・衝突エフェクトを消さず、結果UIが出るまで戦場を動かす。
      this.setState('gameover');
      Sound.defeat();
      return;
    }
    if (this.spawner.done && this.enemies.length === 0 &&
        this.enemyBombs.length === 0 && this.scatterShards.length === 0) {
      // クリア時も場に残った弾・波紋の余韻を0.7秒間見せる。
      this.setState('cleared');
      Sound.fanfare();                                   // 1回のクリアにつき1回（状態が変わるのはここだけ）
    }
  }

  tryLaunch(vx, vy) {
    if (this.state !== 'playing') return false;
    const type = this.deck.current;
    const def = UNIT_DEFS[type];
    if (!this.cost.spend(def.cost)) return false;       // 確定した瞬間に消費
    const p = this.launcher.spawnPoint();
    if (def.projectile) {
      this.bombs.push(new BombProjectile(p.x, p.y, vx, vy, def));
    } else {
      const ally = new Ally(type, p.x, p.y, vx, vy);
      const chainId = ++this.chainSerial;
      ally.chainId = chainId;
      this.chains.set(chainId, { count: 0,
        lastAt: this.battleTime, until: this.battleTime + CONFIG.reflection.chainMaxSeconds });
      Physics.markTrail(ally);
      this.allies.push(ally);
    }
    this.deck.consume();
    this.holdUsed = false;                              // 射出したら再びHOLDできる
    return true;
  }

  // HOLD：空なら射出台のユニットを保留してNEXTの先頭を補充、あれば入れ替え。コストは消費しない
  tryHold() {
    if (this.state !== 'playing' || this.launcher.aiming || this.holdUsed) {
      this.holdDeny = 0.4;
      Sound.ui('deny');
      return false;
    }
    if (this.hold === null) {
      this.hold = this.deck.current;
      this.deck.current = this.deck.draw();
    } else {
      [this.hold, this.deck.current] = [this.deck.current, this.hold];
    }
    this.holdUsed = true;
    Sound.ui('hold');
    return true;
  }

  bodies() {
    const out = [];
    for (const a of this.allies) if (a.alive) out.push(a);
    for (const e of this.enemies) if (e.alive) out.push(e);
    return out;
  }

  // 衝突速度と打撃力に応じて停止。致命的な衝突ダメージなら通常の速度閾値未満でも発動。
  // 新しい衝突は直前のヒットストップの残り時間を加算せず上書きする。
  requestHitstop(speed, impactPower = 0, lethal = false) {
    const cfg = CONFIG.hitstop;
    const threshold = lethal ? cfg.lethalMinSpeed : cfg.minSpeed;
    if ((this.state !== 'playing' && !this.isResultSettling()) || speed < threshold) return false;
    const duration = cfg.minDuration
      + Math.max(0, speed - cfg.minSpeed) * cfg.secondsPerSpeed
      + Math.max(0, impactPower) * cfg.secondsPerDamage
      + (lethal ? cfg.lethalBonus : 0);
    this.hitstopRemaining = Util.clamp(duration, cfg.minDuration, cfg.maxDuration);
    return true;
  }

  // 衝突停止を発生させた打撃だけ、停止時間と威力に連動する実時間の衝撃演出を出す。
  collisionHitstopFx(x, y, nx, ny, speed, power, metal = false, lethal = false) {
    const fired = this.requestHitstop(speed, power, lethal);
    if (fired) {
      const durationFactor = Util.clamp((this.hitstopRemaining - CONFIG.hitstop.minDuration)
        / (CONFIG.hitstop.maxDuration - CONFIG.hitstop.minDuration), 0, 1);
      const powerFactor = Util.clamp(power / 8, 0, 1);
      const intensity = Util.clamp(0.18 + durationFactor * 0.40 + powerFactor * 0.32
        + (lethal ? 0.18 : 0), 0, 1);
      this.addEffect({ kind: 'hitstopShock', x, y, nx, ny, intensity, metal, lethal,
        realtime: true, life: 0.16 + this.hitstopRemaining * 1.45 });
    }
    Sound.impact(speed, metal, power, fired ? this.hitstopRemaining : 0, lethal);
    return fired;
  }

  // 衝突イベント（反射が成立した新しい接触ごとに1回）：衝突ダメージ、スチールの味方ダメージ、バンパーの反射
  // 衝突ダメージは「衝突の向きの相対接近速度 ≥ impactDamageMinSpeed」かつ「当てた側が自分から minImpactSpeed 以上で向かっていた」ときだけ
  processPhysicsEvents() {
    const C = CONFIG.combat;
    for (const ev of this.phys.events) {
      if (ev.type === 'touch') {
        for (const [heal, other] of [[ev.a, ev.b], [ev.b, ev.a]]) {
          if (!heal.isEnemy && heal.alive && heal.def.contactHeal && other.alive) {
            const before = other.hp;
            other.hp = Math.min(other.maxHp, other.hp + heal.def.contactHeal);
            if (other.hp > before) {
              Sound.healImpact();
              this.addEffect({ kind: 'heal', x: other.x, y: other.y, r: other.r, life: 0.5 });
            }
            this.damageAlly(heal, 1);
          }
        }
      } else if (ev.type === 'impact') {
        const chainCount = this.registerChainImpact(ev);
        const chainDamageMult = chainCount >= 2 ? Math.min(CONFIG.reflection.chainDamageMax,
          CONFIG.reflection.chainDamageSecond + (chainCount - 2) * CONFIG.reflection.chainDamageStep) : 1;
        if (ev.approach >= CONFIG.reflection.effectMinSpeed) {
          this.addEffect({ kind: 'impactWave', x: ev.x, y: ev.y, nx: ev.nx, ny: ev.ny,
            power: Util.clamp((ev.approach - CONFIG.reflection.effectMinSpeed) / 950, 0, 1),
            metal: ev.a.def?.slideSound === 'metal' || ev.b.def?.slideSound === 'metal',
            life: 0.22 });
        }
        const metallic = (ev.a.def?.slideSound === 'metal') || (ev.b.def?.slideSound === 'metal')
          || ev.a.type === 'tank' || ev.b.type === 'tank' || ev.a.type === 'boss' || ev.b.type === 'boss'
          || ev.a.type === 'artillery' || ev.b.type === 'artillery';
        const fast = ev.approach >= C.impactDamageMinSpeed;
        let impactPower = 0, lethal = false;
        for (const [src, dst, own, bounced] of [[ev.a, ev.b, ev.aOwn, ev.aRicochet], [ev.b, ev.a, ev.bOwn, ev.bRicochet]]) {
          if (!fast || own < C.minImpactSpeed || !src.alive || !dst.alive) continue;
          if (src.isEnemy) {
            // 弾かれた敵から他の敵への高速衝突だけダメージ。通常歩行・押し合いは対象外。
            if (dst.isEnemy && bounced) {
              this.addEffect({ kind: 'burst', x: dst.x, y: dst.y, r: dst.r * 0.5, color: PALETTE.white, life: 0.2 });
              const damage = Impacts.damage(src, ev.approach) * chainDamageMult;
              impactPower = Math.max(impactPower, damage);
              this.damageEnemy(dst, damage);
              if (!dst.alive) lethal = true;
            }
          } else if (dst.isEnemy) {
            if (src.def.impactDamageMult > 0) {
              this.addEffect({ kind: 'burst', x: dst.x, y: dst.y, r: dst.r * 0.5, color: PALETTE.white, life: 0.2 });
              const damage = Impacts.damage(src, ev.approach) * chainDamageMult;
              impactPower = Math.max(impactPower, damage);
              this.damageEnemy(dst, damage);
              if (!dst.alive) lethal = true;
            }
          } else if (src.def.allyDamageRatio > 0) {
            const damage = Impacts.damage(src, ev.approach) * src.def.allyDamageRatio * chainDamageMult;
            impactPower = Math.max(impactPower, damage);
            this.damageAlly(dst, damage);
            if (!dst.alive) lethal = true;
          }
        }
        for (const ice of [ev.a, ev.b]) {
          if (!ice.isEnemy && ice.alive && ice.def.ice) this.explodeIce(ice);
        }
        if (ev.a.anchorsOnImpact) this.onBumperReflect(ev.a);
        if (ev.b.anchorsOnImpact) this.onBumperReflect(ev.b);
        // 全陣営で同じ衝撃表現。HPダメージが発生しない味方同士の反射も
        // 接近速度と換算質量から打撃力を求め、ヒットストップ・音・衝撃波に反映する。
        const invSum = ev.a.invMass + ev.b.invMass;
        const reducedMass = invSum > 0 ? 1 / invSum : 0;
        const physicalPower = ev.a.isEnemy === ev.b.isEnemy
          ? ev.approach * reducedMass * C.impactDamagePerMomentum
            * C.impactDamageGlobalMult * 2 : 0;
        this.collisionHitstopFx(ev.x, ev.y, ev.nx, ev.ny, ev.approach,
          Math.max(impactPower, physicalPower), metallic, lethal);
      } else if (ev.type === 'wallImpact') {
        if (ev.body.def?.ice) this.explodeIce(ev.body);
        // バンパーは壁で反射して固定されても壊れない。次にユニットを跳ね返すと壊れる。
        this.addEffect({ kind: 'ring', x: ev.body.x, y: ev.body.y, r: ev.body.r, color: ev.body.def.color, life: 0.25 });
        this.collisionHitstopFx(ev.x ?? ev.body.x, ev.y ?? ev.body.y, ev.nx, ev.ny, ev.approach,
          Impacts.damage(ev.body, ev.approach), ev.body.def?.slideSound === 'metal');
      } else if (ev.type === 'wallCollision') {
        if (ev.body.def?.ice) this.explodeIce(ev.body);
        this.collisionHitstopFx(ev.x ?? ev.body.x, ev.y ?? ev.body.y, ev.nx, ev.ny, ev.approach,
          Impacts.damage(ev.body, ev.approach), ev.body.def?.slideSound === 'metal');
      }
    }
    this.phys.events.length = 0;
  }

  // 1回の射出を起点とする連鎖。味方・敵、同一相手への再衝突も数える。
  // ただし物理側で「新たな接触」になった衝突イベントだけを受け取る。
  // 2連鎖目からダメージ強化・反射先の微加速。
  registerChainImpact(ev) {
    if (ev.approach < CONFIG.reflection.chainMinSpeed) return 0;
    const valid = b => {
      const c = this.chains.get(b.chainId);
      return c && this.battleTime <= c.until &&
        this.battleTime - c.lastAt <= CONFIG.reflection.chainGap ? c : null;
    };
    const ca = valid(ev.a), cb = valid(ev.b);
    if (!ca && !cb) return 0;
    let id, c, recipient;
    if (ca && (!cb || ca.lastAt >= cb.lastAt)) {
      id = ev.a.chainId; c = ca; recipient = ev.b;
    } else {
      id = ev.b.chainId; c = cb; recipient = ev.a;
    }
    // 弾かれた相手に同じ連鎖IDを渡し、敵→敵の玉突きを追跡する。
    recipient.chainId = id;
    c.lastAt = this.battleTime;
    const target = recipient;
    c.count++;
    if (c.count >= 2 && target.alive && !target.anchored && target.freezeTimer <= 0) {
      // 微加速は反射直後の速度にのみ一度適用。通常衝突の運動量保存は維持する。
      const factor = Math.min(CONFIG.reflection.chainSpeedMax,
        1 + (c.count - 1) * CONFIG.reflection.chainSpeedStep);
      target.vx *= factor;
      target.vy *= factor;
      Physics.capSpeed(target, CONFIG.physics);
    }
    if (c.count >= 2) {
      this.chainNotice = { count: c.count,
        until: this.battleTime + CONFIG.reflection.chainDisplay };
      this.addEffect({ kind: 'chainPulse', x: ev.x, y: ev.y, r: target.r, life: 0.32 });
    }
    return c.count;
  }

  explodeIce(ice) {
    if (!ice.alive || !ice.def.ice) return;
    const I = ice.def.ice;
    ice.alive = false;
    this.onAllyDestroyed(ice);
    Sound.explosion();
    this.addEffect({ kind: 'iceExplosion', x: ice.x, y: ice.y, r: I.burstRange, life: 0.4 });
    for (const body of this.bodies()) {
      if (body === ice || !body.alive) continue;
      if (Physics.contact({ x: ice.x, y: ice.y, r: I.burstRange, shape: 'circle' }, body).pen >= 0) {
        body.freezeTimer = Math.max(body.freezeTimer || 0, I.freezeSeconds);
        body.vx = 0; body.vy = 0; body.invMass = 0;
      }
    }
  }
  updateSpecialPhysics(dt) {
    for (const b of this.bodies()) {
      if (b.isEnemy && b.ricochetTime > 0)
        b.ricochetTime = Math.max(0, b.ricochetTime - dt);
      if (b.freezeTimer > 0) {
        b.freezeTimer = Math.max(0, b.freezeTimer - dt);
        b.vx = 0; b.vy = 0;
        if (b.freezeTimer === 0 && !b.anchored) b.invMass = 1 / b.mass;
      }
      // 破壊したバリアは10ゲーム秒かけてゆっくり回復し、満タンで初めて再展開。
      if (!b.isEnemy && b.def.shield && b.shieldRecharging) {
        const shield = b.def.shield;
        b.shieldHp = Math.min(shield.hp, b.shieldHp + shield.hp * dt / shield.rechargeSeconds);
        if (b.shieldHp >= shield.hp - 1e-8) {
          b.shieldHp = shield.hp;
          b.shieldRecharging = false;
          this.addEffect({ kind: 'ring', x: b.x, y: b.y, r: b.r, color: PALETTE.blue, life: 0.35 });
        }
      }
      // アイスのオーラ：摩擦だけは味方・敵の両方に、移動速度半減は敵のみに適用。
      // アイス自身やほかのアイスは対象外。複数のオーラは重複しない。
      const aura = !b.def?.ice && this.allies.find(a => a.alive && a !== b && a.def.ice &&
        Util.dist(a.x, a.y, b.x, b.y) <= a.def.ice.range);
      b._iceFrictionFactor = aura ? aura.def.ice.frictionFactor : 1;
      const enemyAura = !!(b.isEnemy && aura);
      b._iceSlow = enemyAura;
      const factor = enemyAura ? aura.def.ice.speedFactor : 1;
      const previous = b.iceSpeedFactor || 1;
      if (factor !== previous) {
        // 速度の変化を入退場時に一度だけ反映。毎フレーム掛け続ける減速を防ぐ。
        b.vx *= factor / previous;
        b.vy *= factor / previous;
        Physics.capSpeed(b, CONFIG.physics);
        b.iceSpeedFactor = factor;
      }
    }
  }
  onBumperReflect(b) {
    if (!b.alive) return;
    b.reflections++;
    this.addEffect({ kind: 'ring', x: b.x, y: b.y, r: b.r, color: b.def.color, life: 0.3 });
    this.damageAlly(b, b.def.reflectHpCost || 1);
  }
  hitShieldBarrier(a, damage) {
    if (!a.alive || !a.def.shield || a.shieldRecharging || a.shieldHp <= 0) return false;
    a.shieldHp = Math.max(0, a.shieldHp - damage);
    if (a.shieldHp <= 0) a.shieldRecharging = true;
    // バリアが肩代わりしても本体に20%のダメージは伝わる。
    this.damageAlly(a, damage * a.def.shield.bodyDamageRatio);
    return true;
  }
  damageAlly(a, n) {
    if (a.takeDamage(n)) this.onAllyDestroyed(a);
  }
  damageEnemy(e, n) {
    if (e.takeDamage(n)) this.onEnemyKilled(e);
  }

  onEnemyKilled(e) {
    if (e.def.scatter) {
      const S = e.def.scatter;
      // 一度の死亡につき一度だけ、全方向へ散弾を発射する。撃破方法には依存しない。
      for (let i = 0; i < S.count; i++) {
        const angle = (i + 0.5) * Math.PI * 2 / S.count;
        this.scatterShards.push(new ScatterShard(e.x, e.y, angle, S));
      }
      this.addEffect({ kind: 'ring', x: e.x, y: e.y, r: 24, color: PALETTE.yellow, life: 0.35 });
      Sound.explosion();
    }
    Sound.destroy('enemy', e);
    // ゲーム結果確定後の余韻中に倒れても報酬や記録は加えない。
    if (this.state === 'playing') {
      this.kills++;
      this.cost.add(e.reward);
    }
    this.addEffect({ kind: 'burst', x: e.x, y: e.y, r: e.r, color: e.def.color, life: 0.35 });
    // コストの撃破報酬は取得するが、数値ポップアップはHP増減だけに統一する。
  }
  onEnemyBreached(e) {
    Sound.breach();
    // 結果確定後は累計突破数を変更せず、演出だけ継続する。
    if (this.state === 'playing') this.breaches++;
    this.addEffect({ kind: 'breach', x: e.x, y: BATTLE.bottom, life: 0.6 });
  }
  onAllyDestroyed(a) {
    Sound.destroy('ally', a);
    this.addEffect({ kind: 'burst', x: a.x, y: a.y, r: a.r, color: a.def.color, life: 0.45 });
  }

  addEffect(fx) { fx.t = 0; this.effects.push(fx); }
  advanceRealtimeEffects(dt) {
    for (const fx of this.effects) if (fx.realtime) fx.t += dt;
    this.effects = this.effects.filter(fx => fx.t < fx.life);
  }
  updateEffects(dt) {
    for (const fx of this.effects) if (!fx.realtime) fx.t += dt;
    this.effects = this.effects.filter(fx => fx.t < fx.life);
  }

  // 残り敵数 = 未出現 + 出現済みで生存中（撃破・突破した敵は alive=false になり数えない）
  get remainingEnemies() {
    let alive = 0;
    for (const e of this.enemies) if (e.alive) alive++;
    return Math.max(0, this.spawner.total - this.spawner.spawned) + alive;
  }
  get totalEnemies() { return this.spawner.total; }
}

/* =====================================================================
 * 11.5 KnockbackTrails — 射出・衝突で弾かれたユニットの後方に残る灰色の小さな波紋
 *   物理判定とは独立した描画用パーティクル。通常の敵歩行では出さない。
 * ===================================================================== */
const KnockbackTrails = {
  update(game, dt) {
    const cfg = CONFIG.visuals.trail;
    for (const ring of game.trails) ring.t += dt;
    game.trails = game.trails.filter(ring => ring.t < cfg.lifetime);

    for (const b of game.bodies()) {
      const ox = b.trailX, oy = b.trailY;
      b.trailX = b.x; b.trailY = b.y;
      if (!b.alive || !b.trailTime || b.anchored) continue;
      b.trailTime = Math.max(0, b.trailTime - dt);
      const dx = b.x - ox, dy = b.y - oy;
      const length = Math.hypot(dx, dy);
      if (length < 1e-6 || Math.hypot(b.vx, b.vy) < cfg.minSpeed) continue;
      // 距離ベースで配置し、FPSの差によって波紋が密にならないようにする
      const carry = b.trailCarry;
      for (let dist = cfg.spacing - carry; dist <= length + 1e-6; dist += cfg.spacing) {
        const f = Math.min(1, dist / length);
        const x = ox + dx * f, y = oy + dy * f;
        if (x >= BATTLE.left + 4 && x <= BATTLE.right - 4 &&
            y >= BATTLE.top + 4 && y <= BATTLE.bottom - 4) {
          game.trails.push({ x, y, t: 0 });
        }
      }
      b.trailCarry = (carry + length) % cfg.spacing;
    }
    // 密集戦闘や極端な衝突が続いても描画負荷を一定に保つ
    if (game.trails.length > cfg.maxParticles)
      game.trails.splice(0, game.trails.length - cfg.maxParticles);
  },
};

/* =====================================================================
 * 12. UI — 画面上のボタン（タイトル／クリア／ゲームオーバー）
 * ===================================================================== */
const UI = {
  button: { x: 150, y: 549, w: 240, h: 60 },
  gearButton: { x: 480, y: 15, w: 48, h: 34 },
  settingsLayout: {
    outline: { x: 330, y: 287, w: 117, h: 46 },
    startY: { master: 414, bgm: 523, sfx: 632 },
    // 横長の音量バー。5段階の目盛りへ吸着し、ドラッグ操作中に音量が即時反映される。
    sliderX: 103, sliderW: 334, sliderH: 54,
    back: { x: 78, y: 762, w: 181, h: 58 },
    restart: { x: 281, y: 762, w: 181, h: 58 },
    confirmBox: { x: 48, y: 340, w: 444, h: 238 },
    confirmCancel: { x: 78, y: 495, w: 184, h: 54 },
    confirmRestart: { x: 280, y: 495, w: 184, h: 54 },
  },
  muteButton: { x: 384, y: 897, w: 54, h: 48 },
  holdButton: { x: 372, y: 777, w: 78, h: 108 },
  restartButton: { x: 150, y: 618, w: 240, h: 48 },
  buttons(game) {
    // 結果発表までの0.7秒間はボタンを表示せず、操作も受け付けない。
    if ((game.state === 'cleared' || game.state === 'gameover') &&
        game.stateTime < CONFIG.result.overlayDelay) return [];
    switch (game.state) {
      case 'title':    return [{ ...this.button, label: 'デッキ編成・スタート', action: g => g.openDeckEditor(1, 'new', 'title') }];
      case 'cleared':  return [{ ...this.button, label: game.phase % 5 === 0 ? 'デッキ編成へ' : '次のフェーズへ',
        action: g => g.phase % 5 === 0 ? g.openDeckEditor(g.phase + 1, 'next', 'cleared') : g.startPhase(g.phase + 1, 'next') }];
      case 'gameover': return [{ ...this.button, label: 'このフェーズを再挑戦', action: g => g.startPhase(g.phase, 'retry') },
                               { ...this.restartButton, label: '最初から', action: g => g.openDeckEditor(1, 'new', 'gameover') }];
      default: return [];
    }
  },
  currentButton(game) { return this.buttons(game)[0] || null; },
  hit(b, x, y) { return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; },
  // 設定画面の音量ドラッグを、射出台のドラッグとは独立して追跡する。
  volumeDrag: null,
  gearTapCount: 0,
  gearLastTapAt: 0,
  resetGearSequence() { this.gearTapCount = 0; this.gearLastTapAt = 0; },
  recordGearTap(game) {
    if (game.cost.unlimited) { this.resetGearSequence(); return false; }
    // メニューを開閉してもタップ数は維持し、他のUI操作または1.5秒以上の中断でリセット。
    const now = performance.now();
    if (now - this.gearLastTapAt > 1500) this.gearTapCount = 0;
    this.gearLastTapAt = now;
    if (++this.gearTapCount < 10) return false;
    this.resetGearSequence();
    game.cost.enableUnlimited();
    Sound.unlock();
    Sound.unlimitedUnlock();
    return true;
  },
  sliderBounds(key) {
    const L = this.settingsLayout;
    return { x: L.sliderX - 19, y: L.startY[key] - 3, w: L.sliderW + 38, h: L.sliderH + 6 };
  },
  sliderLevel(x) {
    const L = this.settingsLayout;
    return Util.clamp(Math.round(4 * (x - L.sliderX) / L.sliderW), 0, 4);
  },
  // 音量が実際に1目盛り変わったときだけ効果音を出す。
  changeSlider(key, level) {
    if (Preferences[key] === level) return false;
    Preferences.setVolume(key, level);
    Sound.sliderTick();
    return true;
  },
  pointerMove(id, x, y) {
    if (!this.volumeDrag || this.volumeDrag.id !== id) return false;
    if (game.state !== 'settings') { this.volumeDrag = null; return true; }
    const key = this.volumeDrag.key, level = this.sliderLevel(x);
    this.changeSlider(key, level);
    return true;
  },
  pointerUp(id, x, y) {
    if (!this.volumeDrag || this.volumeDrag.id !== id) return false;
    if (game.state === 'settings') {
      const key = this.volumeDrag.key, level = this.sliderLevel(x);
      this.changeSlider(key, level);
    }
    this.volumeDrag = null;
    return true;
  },
  pointerCancel(id) {
    if (this.volumeDrag && this.volumeDrag.id === id) this.volumeDrag = null;
  },
  // true を返したら入力をここで消費する
  deckLayout: { x: 64, top: 246, step: 37, minus: 344, plus: 429, btnW: 39, btnH: 30,
                confirm: { x: 111, y: 716, w: 318, h: 56 }, cancel: { x: 185, y: 788, w: 170, h: 43 } },
  pointerDown(game, x, y, pointerId = 0) {
    // 設定ボタン以外を押した場合、10連打の隠しコマンドは最初から数え直す。
    const gearPressed = this.hit(this.gearButton, x, y);
    if (!gearPressed || game.settingsRestartConfirm) this.resetGearSequence();
    if (game.state === 'settings') {
      const L = this.settingsLayout;
      // 確認中は裏側の設定や戻るボタンに触れない。
      if (game.settingsRestartConfirm) {
        this.volumeDrag = null;
        if (this.hit(L.confirmRestart, x, y)) {
          if (game.restartFromSettings()) Sound.ui('confirm');
        } else if (this.hit(L.confirmCancel, x, y)) {
          game.settingsRestartConfirm = false;
          Sound.ui('confirm');
        }
        return true;
      }
      if (this.hit(this.muteButton, x, y)) { Sound.setMuted(!Sound.muted); return true; }
      if (gearPressed || this.hit(L.back, x, y)) {
        this.volumeDrag = null;
        const unlocked = gearPressed && this.recordGearTap(game);
        game.closeSettings();
        if (!unlocked) Sound.ui('confirm');
        return true;
      }
      if (this.hit(L.restart, x, y)) {
        this.volumeDrag = null;
        game.settingsRestartConfirm = true;
        Sound.ui('hold');
        return true;
      }
      if (this.hit(L.outline, x, y)) {
        Preferences.setOutline(!Preferences.allyOutline); Sound.ui('hold'); return true;
      }
      for (const key of ['master', 'bgm', 'sfx']) {
        if (this.hit(this.sliderBounds(key), x, y)) {
          // 同時に2本の指で操作しても、先に触れたスライダーだけを操作する。
          if (!this.volumeDrag) {
            this.volumeDrag = { id: pointerId, key };
            const level = this.sliderLevel(x);
            this.changeSlider(key, level);
          }
          return true;
        }
      }
      return true;                                      // 設定画面の下にあるUIを操作させない
    }
    if (gearPressed) {
      const unlocked = this.recordGearTap(game);
      game.openSettings();
      if (!unlocked) Sound.ui('confirm');
      return true;
    }
    if (game.state === 'deckedit') {
      const L = this.deckLayout;
      for (let i = 0; i < Object.keys(UNIT_DEFS).length; i++) {
        const type = Object.keys(UNIT_DEFS)[i], y0 = L.top + L.step * i;
        if (y >= y0 && y <= y0 + L.btnH) {
          if (x >= L.minus && x <= L.minus + L.btnW) { if (game.editDeck(type, -1)) Sound.ui('hold'); else Sound.ui('deny'); return true; }
          if (x >= L.plus && x <= L.plus + L.btnW) { if (game.editDeck(type, 1)) Sound.ui('hold'); else Sound.ui('deny'); return true; }
          if (x >= 63 && x < L.minus) { game.deckSelected = type; Sound.ui('hold'); return true; }
        }
      }
      if (this.hit(L.confirm, x, y)) { if (game.confirmDeck()) Sound.ui('confirm'); else Sound.ui('deny'); return true; }
      if (this.hit(L.cancel, x, y)) { game.cancelDeck(); Sound.ui('confirm'); return true; }
      return true;
    }
    if (this.hit(this.muteButton, x, y)) { Sound.setMuted(!Sound.muted); return true; }
    if (game.state === 'playing' && this.hit(this.holdButton, x, y)) { game.tryHold(); return true; }
    const list = this.buttons(game);
    if (!list.length) return false;
    if (game.stateTime > 0.25) {
      const btn = list.find(b => this.hit(b, x, y));
      if (btn) { btn.action(game); Sound.ui('confirm'); }
    }
    return true;
  },
};

/* =====================================================================
 * 13. Renderer — レトロ風ドット描画
 *     ワールドは 180×320 の低解像度バッファ（1ドット＝3px）に描き、
 *     最近傍補間で拡大する。文字だけは等倍キャンバスにドットフォントで描く。
 * ===================================================================== */
const PX = 3;
const LW = CONFIG.screen.width / PX;    // 180
const LH = CONFIG.screen.height / PX;   // 320
const q = v => Math.round(v / PX);       // ゲーム座標 → ドット座標

/* ドット単位の描画プリミティブ（すべて整数座標の矩形なので輪郭がにじまない） */
const Pix = {
  g: null,
  _rows: new Map(),
  rect(x, y, w, h, c, a = 255) {
    if (w <= 0 || h <= 0) return;
    this.g.fill(c[0], c[1], c[2], a);
    this.g.rect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  },
  dot(x, y, c, a = 255) { this.rect(x, y, 1, 1, c, a); },
  rows(R) {
    if (!this._rows.has(R)) {
      const out = [];
      for (let i = 0; i < 2 * R; i++) {
        const yo = i + 0.5 - R;
        out.push(Math.round(Math.sqrt(Math.max(0, R * R - yo * yo))));
      }
      this._rows.set(R, out);
    }
    return this._rows.get(R);
  },
  chamfer(cx, cy, R, c, a = 255) {
    // 正八角形に近い切り落とし。世界当たり判定と同じ58%の比率。
    R=Math.round(R);
    if (R <= 0) return;
    const cut=Math.round(R*0.58);
    for(let i=0;i<R*2;i++) {
      const inset=Math.max(0, cut-i, cut-(2*R-1-i));
      this.rect(cx-R+inset, cy-R+i, 2*(R-inset), 1, c, a);
    }
  },
  disc(cx, cy, R, c, a = 255) {
    if (R <= 0) return;
    const rows = this.rows(R);
    this.g.fill(c[0], c[1], c[2], a);
    for (let i = 0; i < rows.length; i++) {
      const hw = rows[i];
      if (hw > 0) this.g.rect(cx - hw, cy - R + i, hw * 2, 1);
    }
  },
  ring(cx, cy, R, c, a = 255, every = 1, phase = 0) {
    const n = Math.max(8, Math.round(2 * Math.PI * R));
    this.g.fill(c[0], c[1], c[2], a);
    for (let k = 0; k < n; k++) {
      if ((k + phase) % every !== 0) continue;
      const ang = (k / n) * Math.PI * 2;
      this.g.rect(Math.round(cx + Math.cos(ang) * R - 0.5), Math.round(cy + Math.sin(ang) * R - 0.5), 1, 1);
    }
  },
  line(x0, y0, x1, y1, c, a = 255, every = 1, phase = 0) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy, i = 0;
    this.g.fill(c[0], c[1], c[2], a);
    for (let guard = 0; guard < 2000; guard++) {
      if ((i++ + phase) % every === 0) this.g.rect(x0, y0, 1, 1);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  },
  // 角を1ドット欠いたレトロなウィンドウ枠
  frame(x, y, w, h, border, fillC, inner) {
    this.rect(x + 1, y, w - 2, h, border);
    this.rect(x, y + 1, w, h - 2, border);
    this.rect(x + 1, y + 1, w - 2, h - 2, fillC);
    if (inner) {
      this.rect(x + 2, y + 2, w - 4, 1, inner);
      this.rect(x + 2, y + h - 3, w - 4, 1, inner);
      this.rect(x + 2, y + 2, 1, h - 4, inner);
      this.rect(x + w - 3, y + 2, 1, h - 4, inner);
    }
  },
};

let pg = null;        // 低解像度ワールドバッファ
let ditherG = null;   // ポーズ時の網掛け

function makeDither() {
  const g = createGraphics(LW, LH);
  g.pixelDensity(1);
  g.noSmooth();
  g.noStroke();
  g.fill(0, 0, 0, 230);
  for (let y = 0; y < LH; y++) for (let x = (y % 2); x < LW; x += 2) g.rect(x, y, 1, 1);
  return g;
}

const pad2 = n => String(Math.max(0, Math.floor(n))).padStart(2, '0');

// タイトル背景専用のミニ物理デモ。本編のGame/Physicsには触れない。
// 壁・ユニット間で実際に反射し、衝突地点にダメージ数字と衝撃波を発生させる。
const TitleBattle = {
  actors: [], hits: [], elapsed: 0, ready: false,
  reset() {
    // 低解像度のドット座標。前衛・後衛を散らして複数方向から衝突させる。
    const starts = [
      ['ally','normal',22,38,80,41], ['enemy','normal',67,40,-75,-30],
      ['ally','bumper',145,39,-100,52], ['enemy','speed',100,43,74,45],
      ['ally','steel',33,94,92,-59], ['enemy','shooter',115,90,-99,66],
      ['ally','ice',163,119,-98,-52], ['enemy','scatter',59,124,106,61],
      ['ally','normal',29,169,108,-69], ['enemy','normal',107,171,-93,68],
      ['ally','bumper',149,210,-115,-70], ['enemy','speed',70,207,110,67],
      ['ally','rare',35,229,94,-85], ['enemy','train',137,231,-106,-66],
    ];
    this.actors = starts.map(([side, type, x, y, vx, vy], i) => ({
      side, type, x, y, vx, vy, r: side === 'ally' ? 6 : (type === 'scatter' ? 7 : 5),
      mass: type === 'steel' ? 2 : 1, flash: 0, history: [], id: i,
    }));
    this.hits = [];
    this.elapsed = 0;
    this.ready = true;
  },
  impact(x, y, power, wall = false) {
    const strength = Util.clamp(power, 0.35, 2.5);
    this.hits.push({ x, y, power: strength, t: 0, life: 0.5,
      value: wall ? null : Math.max(1, Math.round(strength * 2.8)) });
    if (this.hits.length > 42) this.hits.splice(0, this.hits.length - 42);
  },
  update(dt) {
    if (!this.ready) this.reset();
    dt = Math.max(0, Math.min(dt, 0.05));
    this.elapsed += dt;
    for (const hit of this.hits) hit.t += dt;
    this.hits = this.hits.filter(hit => hit.t < hit.life);
    // デモ用の固定上限で移動。端ではバンパーのように強く跳ね返す。
    for (const a of this.actors) {
      a.flash = Math.max(0, a.flash - dt);
      a.history.push([a.x, a.y]);
      if (a.history.length > 7) a.history.shift();
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      let bounced = false;
      if (a.x < 9 + a.r) { a.x = 9 + a.r; a.vx = Math.abs(a.vx); bounced = true; }
      if (a.x > 171 - a.r) { a.x = 171 - a.r; a.vx = -Math.abs(a.vx); bounced = true; }
      if (a.y < 24 + a.r) { a.y = 24 + a.r; a.vy = Math.abs(a.vy); bounced = true; }
      if (a.y > 248 - a.r) { a.y = 248 - a.r; a.vy = -Math.abs(a.vy); bounced = true; }
      if (bounced) {
        a.flash = 0.10;
        this.impact(a.x, a.y, Math.hypot(a.vx, a.vy) / 115, true);
      }
    }
    // 円形衝突を質量つきインパルスで解く。接近していない接触は再カウントしない。
    for (let i = 0; i < this.actors.length; i++) for (let j = i + 1; j < this.actors.length; j++) {
      const a = this.actors[i], b = this.actors[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const minDist = a.r + b.r;
      if (dist >= minDist) continue;
      const nx = dist > 0.0001 ? dx / dist : 1, ny = dist > 0.0001 ? dy / dist : 0;
      const overlap = (minDist - dist + 0.01) / 2;
      a.x -= nx * overlap; a.y -= ny * overlap;
      b.x += nx * overlap; b.y += ny * overlap;
      const approaching = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
      if (approaching <= 12) continue;
      const impulse = 1.92 * approaching / (1 / a.mass + 1 / b.mass);
      a.vx -= impulse * nx / a.mass; a.vy -= impulse * ny / a.mass;
      b.vx += impulse * nx / b.mass; b.vy += impulse * ny / b.mass;
      const power = Util.clamp(approaching / 105, 0.4, 2.4);
      a.flash = 0.16; b.flash = 0.16;
      this.impact((a.x + b.x) / 2, (a.y + b.y) / 2, power);
    }
    // 軽い減速や停止によってデモが動かなくならないよう、最低速度を維持。
    for (const a of this.actors) {
      const sp = Math.hypot(a.vx, a.vy);
      if (sp > 145) { a.vx *= 145 / sp; a.vy *= 145 / sp; }
      else if (sp < 45 && sp > 0.01) { a.vx *= 45 / sp; a.vy *= 45 / sp; }
    }
  },
};

const Renderer = {
  clock: 0,

  blink(rate, duty = 0.5) { return (this.clock * rate) % 1 < duty; },

  shakeOffset(g) {
    // フェーズ終了後は物理更新が停止し、突破エフェクトの時刻も止まる。
    // そのままだと揺れが永続するため、終了から1秒で必ず収める。
    if (g.state !== 'playing' && g.stateTime >= 1) return { x: 0, y: 0 };
    const hit = g.effects.some(f => f.kind === 'breach' && f.t < 0.25);
    if (hit) return { x: (frameCount % 2 ? PX : -PX), y: (frameCount % 3 === 0 ? PX : 0) };
    const shocks = (g.state === 'playing' || g.isResultSettling()) ? g.effects.filter(f => f.kind === 'hitstopShock' && f.t < f.life) : [];
    if (shocks.length) {
      const strength = Math.max(...shocks.map(f => f.intensity * (1 - f.t / f.life) ** 2));
      const amplitude = PX * Math.min(2.7, strength * 2.6);
      return { x: Math.round(Math.sin(this.clock * 119) * amplitude * 2) / 2,
               y: Math.round(Math.cos(this.clock * 103) * amplitude * 2) / 2 };
    }
    // 強い衝突の直後だけ揺れる。時間が経つにつれて小さくなり、短時間で収まる。
    const hits = g.effects.filter(f => f.kind === 'impactWave' && f.power > 0.25 && f.t < 0.13);
    if (!hits.length || (g.state !== 'playing' && !g.isResultSettling())) return { x: 0, y: 0 };
    const strength = Math.max(...hits.map(f => f.power * (1 - f.t / 0.13)));
    const magnitude = PX * Math.min(1.4, strength * 1.4);
    return { x: (frameCount % 2 ? -1 : 1) * magnitude,
             y: (frameCount % 3 === 0 ? 1 : -0.4) * magnitude };
  },

  /* ---------- ドット層 ---------- */
  world(g) {
    Pix.g = pg;
    pg.noStroke();
    const top = q(BATTLE.top), bot = q(BATTLE.bottom);

    Pix.rect(0, 0, LW, LH, PALETTE.black);
    Pix.rect(0, top, LW, bot - top, PALETTE.navy);
    for (let y = top + 5; y < bot; y += 10)
      for (let x = 5; x < LW; x += 10) Pix.dot(x, y, PALETTE.lavender, 80);

    // メインメニューでは本編と独立した反射・衝突のデモを背景で再生する。
    // 戦闘状態や実際のHP／コスト／敵召喚には一切影響しない。
    if (g.state === 'title') {
      this.titleBattleBackdrop();
      this.overlay(g);
      this.muteIcon();
      this.settingsGear(g);
      return;
    }

    // 防衛ライン（突破時は赤く点滅）
    const breaching = g.effects.some(f => f.kind === 'breach');
    const lc = breaching && this.blink(12) ? PALETTE.red : PALETTE.orange;
    const scroll = Math.floor(this.clock * 8) % 6;
    for (let x = -6 + scroll; x < LW; x += 6) Pix.rect(x, bot, 4, 1, lc);

    this.panels(g);
    this.knockbackTrails(g);                              // ユニットの後ろに薄い波紋を描く
    this.allies(g);
    this.enemies(g);
    this.bullets(g);
    this.enemyShots(g);
    this.enemyBombs(g);
    this.scatterShards(g);
    this.healShots(g);
    this.allyShots(g);
    this.effects(g);
    this.aim(g);
    this.launcher(g);
    this.nextPanel(g);
    this.holdPanel(g);
    this.statusBar(g);
    this.overlay(g);
    this.muteIcon();
    this.settingsGear(g);
    this.screenPulse(g);
  },

  titleBattleBackdrop() {
    // メニューを開いている間だけ更新。本編の敵やユニットを消費・破壊しない。
    TitleBattle.update(Math.min(deltaTime / 1000 || 1 / 60, 0.05));
    const P = PALETTE;
    // 軽い囲い線と反射面：戦闘フィールドらしい背景。
    for (const x of [8, 172]) {
      Pix.rect(x, 23, 1, 226, P.slate, 105);
      for (let y = 28; y < 248; y += 13) Pix.rect(x, y, 1, 5, P.blue, 150);
    }
    for (const y of [23, 249]) {
      Pix.rect(9, y, 162, 1, P.slate, 100);
      for (let x = 13; x < 168; x += 14) Pix.rect(x, y, 6, 1, P.orange, 180);
    }
    // 反射軌跡：濃淡の違う短い残像を持たせて衝突方向を見せる。
    for (const a of TitleBattle.actors) {
      const d = a.side === 'ally' ? UNIT_DEFS[a.type] : ENEMY_DEFS[a.type];
      for (let h = 0; h < a.history.length; h++) {
        const [x, y] = a.history[h];
        const alpha = Math.round(110 * (h + 1) / a.history.length);
        Pix.disc(Math.round(x), Math.round(y), Math.max(1, Math.round(a.r * 0.26)), d.color, alpha);
      }
    }
    for (const hit of TitleBattle.hits) {
      const p = hit.t / hit.life, fade = Math.max(0, 1 - p);
      const cx = Math.round(hit.x), cy = Math.round(hit.y);
      const radius = Math.max(2, Math.round(2 + p * (9 + 9 * hit.power)));
      Pix.ring(cx, cy, radius, hit.value == null ? P.blue : P.yellow, Math.round(220 * fade), 2);
      if (p < 0.28) Pix.disc(cx, cy, Math.max(1, Math.round(3 * (1 - p / 0.28))), P.white, Math.round(180 * fade));
      for (let i = 0; i < 8; i++) {
        const th = i * Math.PI / 4 + hit.x * 0.02;
        const reach = 3 + p * (10 + hit.power * 8);
        Pix.line(cx + Math.cos(th) * (reach - 3), cy + Math.sin(th) * (reach - 3),
          cx + Math.cos(th) * reach, cy + Math.sin(th) * reach,
          i % 2 ? P.orange : P.white, Math.round(180 * fade));
      }
      if (hit.value !== null && p < 0.83) {
        // 3×5のドット数字で「-ダメージ」を飛ばす（タイトル専用）。
        const glyphs = {
          '-': ['000','000','111','000','000'],
          '0': ['111','101','101','101','111'], '1': ['010','110','010','010','111'],
          '2': ['111','001','111','100','111'], '3': ['111','001','111','001','111'],
          '4': ['101','101','111','001','001'], '5': ['111','100','111','001','111'],
          '6': ['111','100','111','101','111'], '7': ['111','001','010','010','010'],
          '8': ['111','101','111','101','111'], '9': ['111','101','111','001','111'],
        };
        const number = '-' + hit.value;
        const start = Math.round(cx - number.length * 2 + 1), top = Math.round(cy - 13 - p * 9);
        // メニュー上のドット数字も1pxの白い縁取りを付ける。
        for (const [dx, dy, color, alpha] of [
          [-1, 0, P.white, 210], [1, 0, P.white, 210],
          [0, -1, P.white, 210], [0, 1, P.white, 210],
          [0, 0, P.red, 255],
        ]) {
          for (let n = 0; n < number.length; n++) {
            const rows = glyphs[number[n]];
            if (!rows) continue;
