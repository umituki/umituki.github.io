<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>スリングディフェンス（プロトタイプ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --letterbox: #000000;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--letterbox);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --letterbox: #000000; }
  }
  :root[data-theme="dark"] { --letterbox: #000000; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    margin: 0;
    overflow: hidden;
    background: var(--letterbox);
    overscroll-behavior: none;
  }
  /* メニューを含むページ上の文字はゲームと同じドットフォントに統一する。 */
  html, body, button, input, textarea, select {
    font-family: 'DotGothic16', 'MS Gothic', monospace;
  }
  body {
    height: 100%;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { width: 100%; height: 100%; touch-action: none; overflow: hidden; }
  #game canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<div id="game"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
'use strict';

/* =====================================================================
 * 1. CONFIG — ゲームバランス・各種パラメータ（調整はここだけで完結）
 * ===================================================================== */
const CONFIG = {
  screen: { width: 540, height: 960 },             // 基準解像度（9:16）

  layout: {
    statusHeight: 66,                               // 上部ステータスの高さ（＝戦闘エリア上端）
    defenseLineY: 762,                              // 防衛ライン（＝戦闘エリア下端）
    launcherX: 270,                                 // 射出台の中心
    launcherY: 828,
    // ※レイアウト値はドット(3px)単位に揃えると描画がずれない
  },

  gameplay: { speed: 1.2 },        // 戦闘だけゲーム内時間を1.2倍で進める（物理の固定刻みは維持）

  physics: {
    timestep: 1 / 120,           // 固定タイムステップ（秒）
    maxStepsPerFrame: 15,        // 1フレームで回す最大ステップ数（処理落ち時の暴走防止）
    maxSubsteps: 8,              // 高速移動時の追加分割数の上限
    solverIterations: 4,         // 衝突解決の反復回数（密集時の安定性）
    wallRestitution: 0.85,       // 壁側の反発係数（ユニットの反発係数と掛け合わせる）
    defenseLineReboundMult: 1.5, // 防衛ラインの特殊反射（バンパーに当たったときと同倍率）
    stopSpeed: 8,                // この速度(px/s)未満で停止扱い
    maxSpeed: 1800,              // 速度上限（不自然な加速の防止）
    positionSlop: 0.3,           // 許容する重なり(px)
    correctionPercent: 0.9,      // 重なり押し戻しの強さ
    bounceThreshold: 30,         // これ未満の相対速度では跳ね返さない（微振動防止）
  },

  launcher: {
    grabRadius: 64,              // 射出台の掴み判定半径
    minDrag: 18,                 // これ未満で離すとキャンセル（倍率の対象外）
    baseMaxDrag: 130,            // 基準となる最大引き距離（倍率適用前）
    baseMinSpeed: 220,           // 基準の速度カーブ：minDragでの速度(px/s)
    baseMaxSpeed: 1500,          // 基準の速度カーブ：baseMaxDragでの速度(px/s)
    sensitivity: 0.69,           // ドラッグ感度：同じ距離での射出速度の倍率（0.6 × 1.15）
    maxDragScale: 0.84,          // 最大引き距離の倍率（0.6 × 1.4 → 130 × 0.84 = 109.2px）
    powerScale: 1.5,             // 射出パワー補正：LaunchModel.speed() の結果に1回だけ掛ける
    minUpward: 0.15,             // 射出方向に必要な上向き成分（0〜1）
    predictSeconds: 2.5,         // 予想軌道を計算する秒数
  },

  audio: {
    masterVolume: 0.5,
    dragVolume: 0.045,           // ドラッグ音の最大音量（旧0.11より控えめ）
    dragBaseFreq: 135,           // 引き始めの柔らかな低音(Hz)
    dragOctaves: 0.85,           // 最大まで引いたときの穏やかな上昇幅（オクターブ）
    smoothing: 0.055,            // 引く操作に追従しつつ音程・音量を滑らかに変化
    releaseLaunch: 0.018,        // 射出時の減衰時定数（秒）
    releaseCancel: 0.12,         // キャンセル時は柔らかくフェードアウト
    launchVolume: 0.16,
    // 戦闘・クリアの効果音
    sfxVolume: 1.0,              // 効果音バス全体の音量
    shotVolume: 0.05,
    enemyAttackVolume: 0.09,
    destroyVolume: 0.08,
    fanfareVolume: 0.12,         // 通常の効果音より少し大きい
    healVolume: 0.05,
    // BGM: 4小節のオリジナル・チップチューンをWeb Audio APIで合成（外部音声ファイル不要）
    musicVolume: 0.16,           // 効果音を聞き取りやすくするため控えめな音量
    musicBpm: 116,
    impactVolume: 0.12,           // 強い衝突は低音とノイズを重ねて迫力を出す（リミッターで保護）
    hitVolume: 0.055,
    explosionVolume: 0.12,
    breachVolume: 0.11,
    gameoverVolume: 0.15,
    uiVolume: 0.055,
    // 滑走音（種類ごとに1本の持続音を全ユニットで共有）
    slideMinSpeed: 40,           // これ未満の速さのユニットは鳴らさない(px/s)
    slideRefSpeed: 1306,         // 音の高さ・強さの基準速度（最大射出速度）
    slideVolume: { basic: 0.05, metal: 0.06 },
    slideFade: 0.03,             // 開始・停止・変化の補間時定数（秒）
    // 同時発音数（max）と、同じ種類を続けて鳴らす最短間隔（gap 秒）
    limits: {
      shot:        { max: 4, gap: 0.03 },
      enemyAttack: { max: 3, gap: 0.04 },
      destroy:     { max: 3, gap: 0.03 },
      fanfare:     { max: 1, gap: 0.5 },
      heal:        { max: 3, gap: 0.05 },
      impact:      { max: 5, gap: 0.025 },  // 連鎖衝突も聞こえるよう間引きを緩める
      hit:         { max: 4, gap: 0.045 },
      explosion:   { max: 2, gap: 0.12 },
      breach:      { max: 2, gap: 0.12 },
      gameover:    { max: 1, gap: 0.5 },
      ui:          { max: 2, gap: 0.07 },
      slider:      { max: 8, gap: 0 },       // 5段階スライダーは目盛りごとに短い確認音
      secret:      { max: 1, gap: 0 },       // 隠しコスト無制限モード解放音
    },
  },

  cost: {
    regenInterval: 2.0,          // 自動回復の間隔（秒）。戦闘中のゲーム内時間で数える
    regenAmount: 1,              // 1回の回復量
    max: 99,                     // 上限
  },

  phase: {
    breachLimit: 10,             // 全フェーズ累計での突破上限（次フェーズへ引き継ぐ）
    initialCost: 10,             // 新しいゲームの開始時だけ付与。以後のフェーズは前のフェーズの残りを引き継ぐ
    firstSpawnDelay: 1.5,        // フェーズ開始から最初の召喚まで
  },

  // 敵の召喚（コスト制）。敵の性能はフェーズで変化しない
  waves: {
    budgetBase: 8,               // 総コスト = budgetBase + budgetPerPhase × (フェーズ − 1)
    budgetPerPhase: 3,
    // 同時召喚コスト上限：1回の召喚イベント（単体またはセット）の合計コストの上限。総コストとは独立
    eventCapTable: [2, 2, 4, 4, 5, 6, 6, 7, 8, 9, 9, 10, 11, 11, 12, 12, 13, 14, 14, 15],   // フェーズ1〜20
    eventCapGrowth: 2 / 3,       // フェーズ21以降：3フェーズにつき約2ずつ増加
    intervalBase: 1.5,           // 次の召喚までの基礎秒数
    intervalPerCost: 0.5,        // フェーズ19までは 1.5 + 0.5 × イベントコスト
    intervalJitter: 0.15,        // ±15% のゆらぎ
    // フェーズ20から徐々に召喚間隔を短縮。35以降は0.58倍を下限とする。
    // 5フェーズ刻みの係数を区間内では線形補間する（イベント規模との関係は維持）。
    intervalScaleTiers: [{ phase: 20, scale: 1 }, { phase: 25, scale: 0.83 },
                         { phase: 30, scale: 0.67 }, { phase: 35, scale: 0.58 }],
    // 単体召喚の重み（解禁前の敵・予算を超える敵は除外して抽選）
    singleWeights: { normal: 6, speed: 3, tank: 1.2, heal: 0.8, shooter: 2, artillery: 1,
                     train: 2.5, rare: 6, thrower: 0.9, scatter: 1.5, boss: 1.2 },
    // フェーズ15以降はスピードの抽選重みを減らし、トレインを増やす（セット編成はそのまま）。
    fastWeightChangePhase: 15,
    speedWeightLater: 1.5,
    trainWeightLater: 4.5,
    // フェーズ23以降はスキャッターの単体召喚重みを増やす。
    scatterWeightChangePhase: 23,
    scatterWeightLater: 2.5,
    // ノーマルはフェーズ10から、タンクはフェーズ20から単体・セットともに廃止する。
    normalLastPhase: 9,
    tankLastPhase: 19,
    // 射撃型のみ、フェーズ3の重み2から1フェーズごとに+0.5、最大8（フェーズ15以降）
    // ※これは「単体召喚候補の抽選重み」の上限で、実際の出現数・出現確率の固定値ではない
    shooterWeightPerPhase: 0.5,
    shooterWeightMax: 8,
    // セット召喚：フェーズ1〜4は出現せず、5から5フェーズごとに強い編成を追加
    // 各 unlock フェーズの Difficulty.eventCap 以下で構成する。既解禁セットも抽選候補に残す。
    sets: [
      // PHASE 5: 速攻・牽制（上限5）
      { id: 'rush',           name: 'ラッシュ',         members: ['speed', 'speed'],                 unlock: 5,  weight: 1.0 },
      { id: 'fastShooter',    name: '高速射撃',         members: ['shooter', 'train'],               unlock: 5,  weight: 1.0 },
      { id: 'mixed',          name: '混成',             members: ['normal', 'speed', 'train'],       unlock: 5,  weight: 1.0 },
      // PHASE 10: 重装・遠距離の組み合わせ（上限9）
      { id: 'armorSpear',     name: '装甲突撃',         members: ['tank', 'shooter', 'speed'],      unlock: 10, weight: 1.0 },
      { id: 'artilleryCover', name: '砲撃援護',         members: ['artillery', 'shooter'],          unlock: 10, weight: 1.0 },
      { id: 'healingRush',    name: '高速回復隊',       members: ['heal', 'train', 'speed'],        unlock: 10, weight: 1.0 },
      // PHASE 15: 特殊攻撃を含む編成（上限12）
      { id: 'shrapnelRush',   name: '散弾突撃',         members: ['scatter', 'shooter', 'train', 'speed'], unlock: 15, weight: 1.0 },
      { id: 'artilleryHeal',  name: '回復砲撃',         members: ['artillery', 'heal', 'rare'],    unlock: 15, weight: 1.0 },
      { id: 'throwerRush',    name: '投擲先鋒',         members: ['thrower', 'train'],             unlock: 15, weight: 1.0 },
      // PHASE 20: 範囲攻撃と前線の複合（上限15）
      { id: 'bombScatter',    name: '爆散部隊',         members: ['thrower', 'scatter'],           unlock: 20, weight: 1.0 },
      { id: 'crossfire',      name: '交差火力',         members: ['artillery', 'shooter', 'scatter', 'rare'], unlock: 20, weight: 1.0 },
      { id: 'heavyMedic',     name: '重装回復隊',       members: ['heal', 'boss'],                unlock: 20, weight: 1.0 },
      // PHASE 25: 大型敵同士の連携（上限18）
      { id: 'heavyBarrage',   name: '重砲撃隊',         members: ['thrower', 'artillery', 'train'], unlock: 25, weight: 1.0 },
      { id: 'clusterMedic',   name: '散弾回復隊',       members: ['artillery', 'scatter', 'heal', 'train'], unlock: 25, weight: 1.0 },
      { id: 'bombGuard',      name: '投擲護衛',         members: ['thrower', 'scatter', 'shooter'], unlock: 25, weight: 1.0 },
      { id: 'expressRush',    name: '特急突撃',         members: ['train', 'train', 'train', 'train', 'train', 'speed', 'speed'], unlock: 25, weight: 1.2 },
      { id: 'fastWing',       name: '高速側面隊',       members: ['train', 'train', 'train', 'train', 'shooter', 'speed'], unlock: 25, weight: 1.1 },
      // PHASE 30: 複数の高コスト敵が連携（上限22）
      { id: 'siege',          name: '包囲砲撃',         members: ['thrower', 'artillery', 'scatter', 'rare'], unlock: 30, weight: 1.0 },
      { id: 'doubleCannon',   name: '双砲陣',           members: ['artillery', 'artillery', 'scatter', 'heal'], unlock: 30, weight: 1.0 },
      { id: 'siegeHeal',      name: '投擲支援',         members: ['thrower', 'heal', 'scatter', 'train'], unlock: 30, weight: 1.0 },
      { id: 'gunLine',        name: '集中砲列',         members: ['shooter', 'shooter', 'shooter', 'artillery', 'artillery'], unlock: 30, weight: 1.2 },
      // PHASE 35/40：より重い大型部隊（上限25/28）
      { id: 'armoredSiege',   name: '鉄壁包囲',         members: ['boss', 'artillery', 'scatter', 'train'], unlock: 35, weight: 1.0 },
      { id: 'doubleBattery',  name: '双砲支援',         members: ['artillery', 'artillery', 'scatter', 'heal', 'shooter'], unlock: 35, weight: 1.0 },
      { id: 'tripleThreat',   name: '三重脅威',         members: ['thrower', 'thrower', 'scatter'], unlock: 35, weight: 1.0 },
      { id: 'fragmentStorm',  name: '散弾嵐',           members: ['scatter', 'scatter', 'scatter', 'scatter', 'train', 'train'], unlock: 35, weight: 1.3 },
      { id: 'fragmentEscort', name: '散弾前衛',        members: ['scatter', 'scatter', 'scatter', 'shooter', 'train', 'train'], unlock: 35, weight: 1.1 },
      { id: 'heavyConvoy',    name: '重装車列',         members: ['thrower', 'thrower', 'artillery', 'train'], unlock: 40, weight: 1.0 },
      { id: 'siegeFormation', name: '攻城編隊',         members: ['thrower', 'artillery', 'scatter', 'heal', 'train'], unlock: 40, weight: 1.0 },
      { id: 'tripleCannon',   name: '三連砲隊',         members: ['artillery', 'artillery', 'artillery', 'heal', 'heal'], unlock: 40, weight: 1.0 },
      { id: 'mixedAssault',   name: '複合攻城',         members: ['boss', 'artillery', 'scatter', 'shooter', 'train'], unlock: 40, weight: 1.25 },
      { id: 'mixedPincer',    name: '挟撃部隊',         members: ['boss', 'thrower', 'heal', 'train'], unlock: 40, weight: 1.15 },
    ],
    setChanceStart: 5,           // フェーズ1〜4はセット召喚を一切行わない
    setChanceBase: 0.12,
    setChancePerPhase: 0.05,
    setChanceMax: 0.45,
    setOldTierWeight: 0.74,      // 新しい段階が出たら、以前のセットの抽選重みは段階差ごとに0.74倍
    // PHASE20以降：5フェーズごとに敵の戦術テーマを循環させる。出現禁止・解禁条件は常に優先。
    themeCycle: [
      { id: 'heavy',   name: '重装侵攻',   weights: { boss: 3.6, heal: 2.2, artillery: 1.2, train: 0.65, speed: 0.6, scatter: 0.75 } },
      { id: 'fast',    name: '高速侵攻',   weights: { train: 3.4, speed: 2.2, scatter: 1.3, rare: 1.3, boss: 0.5, thrower: 0.6, artillery: 0.7 } },
      { id: 'ranged',  name: '遠距離制圧', weights: { shooter: 2.7, artillery: 3.3, thrower: 2.4, train: 0.65, speed: 0.7, boss: 0.65 } },
      { id: 'scatter', name: '散弾連鎖',   weights: { scatter: 3.7, train: 1.6, speed: 1.35, shooter: 0.8, boss: 0.5, thrower: 0.65 } },
      { id: 'mixed',   name: '複合侵攻',   weights: { boss: 1.6, artillery: 1.7, thrower: 1.6, scatter: 1.8, heal: 1.3, train: 1.3 } },
    ],
    themeAffinity: { // セット内容を評価し、テーマに沿った強力な編成を優先
      heavy:   { boss: 3.5, heal: 2.1, artillery: 1.2, shooter: 0.9 },
      fast:    { train: 3, speed: 2.5, scatter: 1.0, rare: 1.3 },
      ranged:  { shooter: 2.5, artillery: 3.5, thrower: 3, heal: 0.8 },
      scatter: { scatter: 4, train: 1.5, speed: 1.0 },
      mixed:   { boss: 2, scatter: 2, artillery: 2, thrower: 2, heal: 1.5, train: 1.2 },
    },
    // 同フェーズ内：序盤は小出し、中盤にセット増加、終盤に主力セット。
    // たまに序盤に主力セットを置く変化球も混ぜる（再挑戦時にもシードで再現可能）。
    openingSetChance: 0.10,
    pressureSetChance: 0.72,
    finaleSetChance: 0.68,
    earlySurgeChance: 0.28,
    seed: null,                  // 数値を入れると毎回同じ召喚予定になる（テスト用）。null なら毎回ランダム
  },

  combat: {
    rangeUnitPx: 50,                 // 範囲1 = 50px（範囲3 = 150px）
    impactDamagePerMomentum: 0.0015, // 衝突ダメージの基準係数（全体倍率は impactDamageGlobalMult）
    impactDamageGlobalMult: 1.5,     // 弾かれて衝突したときのダメージを一律1.5倍（射撃・爆発などは対象外）
    minImpactSpeed: 60,              // 自分から当たりに行く速度(px/s)がこれ未満ならダメージなし
    impactDamageMinSpeed: 150,       // 衝突の向きの相対接近速度(px/s)がこれ未満なら衝突ダメージなし（物理的な押し合いのみ）
    contactMargin: 1,                // この距離(px)より離れたら「接触終了」とみなす
    enemyRicochetSeconds: 1.5,       // 弾かれた敵が敵に衝突した際のダメージ有効時間
    enemyRicochetImpulse: 90,       // 通常の歩行・低速の押し合いを弾き飛ばしと区別する速度変化
  },

  // 敵と味方の押し合い
  push: {
    driveAccel: 500,             // 敵の歩く力（加速度 px/s^2）。歩行速度に近づくほど弱まる
    knockbackDeviation: 60,      // 歩行速度からこれ以上ずれていたら「弾かれ中」として knockbackFriction で戻す
    enemyBounceSpeed: 100,       // 敵が関わる接触は、これ以上の接近速度でだけ跳ね返る（歩きながらの接触は跳ねない）
    slowSpeed: 60,               // 敵に押されている味方がこれ未満の速さのときは pushFriction で踏ん張る
  },

  reflection: {
    // 通常反射は減速を緩めて運動を少し長持ちさせる。反発でエネルギーを増やさない。
    enemyKnockbackFriction: 756,
    angleMinSpeed: 90,            // 接触の正確な位置を算出する最低相対速度
    effectMinSpeed: 155,         // 反射の視覚演出が出る最低速度
    shakeMinSpeed: 430,          // 強い接触に限って画面を短く揺らす
    chainMinSpeed: 150,          // 連鎖のカウントに必要な相対衝突速度
    chainGap: 1.7,               // 連鎖の間隔が開きすぎたら終了
    chainMaxSeconds: 6,          // 1発起点の連鎖が無限に継続しないよう制限
    chainDisplay: 1.35,          // 連鎖数を表示する秒数
    // 2連鎖目から衝突ダメージを大きく上げ、反射先の速度は少しずつ強化。
    // 再衝突や味方同士の衝突も別の接触イベントであれば連鎖として加算する。
    chainDamageSecond: 1.85,     // 2連鎖時の衝突ダメージ倍率
    chainDamageStep: 0.45,       // 3連鎖以降、1連鎖ごとの追加倍率
    chainDamageMax: 3.65,        // 無限に大きくならない上限
    chainSpeedStep: 0.012,       // 2連鎖以降、連鎖数に応じた反射速度の微増
    chainSpeedMax: 1.08,         // 1度の衝突による追加加速の上限
  },
  hitstop: {
    minSpeed: 620,            // これ以上の相対接近速度(px/s)で停止
    minDuration: 0.065,       // 発動時の基本停止時間（実時間の秒、従来より長め）
    maxDuration: 0.27,        // 高速・高威力時の停止上限（従来0.18秒）

/* =====================================================================
 * 3. Difficulty — フェーズ番号から難易度パラメータを算出
 * ===================================================================== */
const Difficulty = {
  forPhase(n) {
    const p = CONFIG.phase, w = CONFIG.waves, k = n - 1;
    return {
      phase: n,
      budget: w.budgetBase + w.budgetPerPhase * k,
      initialCost: p.initialCost,
      breachLimit: p.breachLimit,
    };
  },
  // 同時召喚コスト上限（フェーズ1〜20は表、21以降は 15 + round(2/3 ×（フェーズ − 20）)）
  eventCap(n) {
    const w = CONFIG.waves, t = w.eventCapTable;
    if (n <= t.length) return t[Math.max(1, n) - 1];
    return t[t.length - 1] + Math.round(w.eventCapGrowth * (n - t.length));
  },
  setChance(n) {
    const w = CONFIG.waves;
    if (n < w.setChanceStart) return 0;
    return Math.min(w.setChanceMax, w.setChanceBase + w.setChancePerPhase * (n - w.setChanceStart));
  },
  // イベント後の待ち時間倍率。指定の節目の間は線形補間し、フェーズ35以降は一定。
  spawnIntervalScale(phase) {
    const tiers = CONFIG.waves.intervalScaleTiers;
    if (phase <= tiers[0].phase) return tiers[0].scale;
    for (let i = 1; i < tiers.length; i++) {
      if (phase <= tiers[i].phase) {
        const prev = tiers[i - 1], next = tiers[i];
        const t = (phase - prev.phase) / (next.phase - prev.phase);
        return prev.scale + (next.scale - prev.scale) * t;
      }
    }
    return tiers[tiers.length - 1].scale;
  },
  themeForPhase(phase) {
    if (phase < 20) return null;
    const cycle = CONFIG.waves.themeCycle;
    return cycle[Math.floor((phase - 20) / 5) % cycle.length];
  },
  // 抽選重みだけを調整する。敵の個別性能や解禁時期は変化させない。
  themedSingleWeight(type, phase) {
    const theme = this.themeForPhase(phase);
    return this.singleWeight(type, phase) * (theme?.weights[type] ?? 1);
  },
  setThemeScore(members, theme) {
    if (!theme) return 1;
    const affinity = CONFIG.waves.themeAffinity[theme.id];
    const total = members.reduce((s, type) => s + ENEMY_DEFS[type].cost, 0);
    if (total === 0) return 0;
    const weighted = members.reduce((sum, type) => sum + ENEMY_DEFS[type].cost * (affinity[type] ?? 0.25), 0) / total;
    // 複合型では役割が異なる敵を組み合わせた編成を評価する。
    return theme.id === 'mixed' ? weighted * (0.6 + Math.min(5, new Set(members).size) * 0.12) : weighted;
  },
  // 各フェーズでの単体召喚重み。解禁前の敵はWavePlanner側で除外する。
  singleWeight(type, phase) {
    const w = CONFIG.waves;
    const base = w.singleWeights[type] || 0;
    if (type === 'normal' && phase > w.normalLastPhase) return 0;
    if (type === 'tank' && phase > w.tankLastPhase) return 0;
    if (type === 'speed' && phase >= w.fastWeightChangePhase) return w.speedWeightLater;
    if (type === 'train' && phase >= w.fastWeightChangePhase) return w.trainWeightLater;
    if (type === 'scatter' && phase >= w.scatterWeightChangePhase) return w.scatterWeightLater;
    if (type !== 'shooter') return base;
    return Math.min(w.shooterWeightMax,
      base + Math.max(0, phase - ENEMY_DEFS.shooter.unlock) * w.shooterWeightPerPhase);
  },
};

/* 乱数（シードを固定すると同じ召喚予定を再現できる） */
function makeRng(seed) {
  let a = (seed >>> 0) || 1;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* =====================================================================
 * 3.5 WavePlanner — フェーズ開始時に、予算内の召喚予定（イベントの列）をすべて確定する
 *   event = { members: [敵の種類…], cost, set: セットID|null, gap: 次の召喚までの秒数 }
 * ===================================================================== */
const WavePlanner = {
  weighted(list, rng) {
    const total = list.reduce((sum, o) => sum + o.weight, 0);
    let r = rng() * total;
    for (const o of list) { r -= o.weight; if (r < 0) return o; }
    return list[list.length - 1];
  },
  // フェーズ45以降も5フェーズごとに新しい大型セットを生成する。
  // 同時召喚上限を超えず、1列に収まる最大8体までの高コスト混成とする。
  futureSets(phase) {
    const out = [];
    const gap = 6, maxWidth = CONFIG.screen.width - 8;
    // 45以降も、その5フェーズのテーマに沿ったセットを2種類ずつ新解禁する。
    // 高速型は低コスト多体、重装・遠距離型は高コスト少数で個性を保つ。
    const themePools = {
      heavy: [
        ['boss', 'heal', 'boss', 'artillery', 'scatter', 'shooter', 'train', 'rare'],
        ['boss', 'boss', 'heal', 'scatter', 'artillery', 'train', 'shooter', 'rare'],
      ],
      fast: [
        ['train', 'train', 'speed', 'scatter', 'shooter', 'rare'],
        ['train', 'speed', 'train', 'scatter', 'speed', 'shooter', 'rare'],
      ],
      ranged: [
        ['thrower', 'artillery', 'shooter', 'heal', 'scatter', 'train', 'rare'],
        ['artillery', 'shooter', 'thrower', 'artillery', 'heal', 'scatter', 'rare'],
      ],
      scatter: [
        ['scatter', 'scatter', 'train', 'shooter', 'speed', 'artillery', 'rare'],
        ['scatter', 'train', 'scatter', 'heal', 'shooter', 'speed', 'rare'],
      ],
      mixed: [
        ['boss', 'artillery', 'scatter', 'thrower', 'heal', 'shooter', 'train', 'rare'],
        ['thrower', 'boss', 'heal', 'scatter', 'artillery', 'train', 'shooter', 'rare'],
      ],
    };
    for (let unlock = 45; unlock <= phase; unlock += 5) {
      const cap = Difficulty.eventCap(unlock);
      const patterns = themePools[Difficulty.themeForPhase(unlock).id];
      for (let v = 0; v < patterns.length; v++) {
        const pool = patterns[v];
        const members = [], count = {};
        let remaining = cap, width = 0;
        // 強敵を複数組み合わせ、残り予算を埋める。各段階の編成は決定的に生成する。
        while (members.length < 8 && remaining > 0) {
          const order = members.length < 3 ? pool : pool.slice().sort((a, b) => ENEMY_DEFS[b].cost - ENEMY_DEFS[a].cost);
          const chosen = order.find(t => {
            const d = ENEMY_DEFS[t];
            return d.cost <= remaining && width + d.radius * 2 + (members.length ? gap : 0) <= maxWidth
              && (count[t] || 0) < 3;
          });
          if (!chosen) break;
          members.push(chosen);
          count[chosen] = (count[chosen] || 0) + 1;
          remaining -= ENEMY_DEFS[chosen].cost;
          width += ENEMY_DEFS[chosen].radius * 2 + (members.length > 1 ? gap : 0);
        }
        if (members.length > 1) {
          out.push({ id: `tier${unlock}_${v}`, name: `第${unlock}段階・${v + 1}`, members, unlock, weight: 1.0 });
        }
      }
    }
    return out;
  },
  plan(phase, rng) {
    const w = CONFIG.waves;
    const totalBudget = Difficulty.forPhase(phase).budget;
    const setChance = Difficulty.setChance(phase);
    const cap = Difficulty.eventCap(phase);
    const theme = Difficulty.themeForPhase(phase);
    const events = [];
    const tier = Math.floor((phase - w.setChanceStart) / 5);
    // 解禁済みのセット候補。旧セットに含まれるノーマル・タンクも段階で置換する。
    const availableSets = w.sets.concat(this.futureSets(phase))
      .filter(st => st.unlock <= phase)
      .map(st => {
        const members = st.members.map(t => {
          if (phase > w.normalLastPhase && t === 'normal') return 'rare';
          if (phase > w.tankLastPhase && t === 'tank') return 'boss';
          return t;
        });
        const age = tier - Math.floor((st.unlock - w.setChanceStart) / 5);
        const cost = members.reduce((c, m) => c + ENEMY_DEFS[m].cost, 0);
        const themeScore = Difficulty.setThemeScore(members, theme);
        return { ...st, members, cost, themeScore,
          weight: st.weight * Math.pow(w.setOldTierWeight, Math.max(0, age))
            * (theme ? Math.pow(themeScore, 2) : 1) };
      });

    // PHASE20以降は、毎フェーズ必ずテーマを象徴するセットを1回組み込む。
    // 予算を事前に確保し、イベント全体のコスト合計を変えない。
    let signature = null;
    const earlySurge = !!theme && rng() < w.earlySurgeChance;
    if (theme) {
      const eligible = availableSets.filter(st => st.cost <= cap && st.cost <= totalBudget && st.members.length >= 2);
      if (eligible.length) {
        const scored = eligible.map(st => ({ st,
          score: st.themeScore * 2 + Math.min(1, st.cost / cap) * 1.2
            + Math.min(0.45, Math.max(0, st.unlock - (phase - 10)) * 0.045) }));
        scored.sort((a, b) => b.score - a.score);
        // 上位3候補から選び、毎フェーズ同じ編成だけになることを避ける。
        const pick = scored[Math.floor(rng() * Math.min(3, scored.length))].st;
        signature = { members: pick.members.slice(), cost: pick.cost, set: pick.id,
          formation: 'layered', act: earlySurge ? 'opening' : 'finale', signature: true };
      }
    }
    let budget = totalBudget - (signature?.cost ?? 0);
    const freeBudget = budget;

    const setGap = (ev, act) => {
      const actScale = !theme ? 1 : earlySurge
        ? ({ opening: 0.93, pressure: 1.03, finale: 0.87 }[act])
        : ({ opening: 1.13, pressure: 0.84, finale: 0.73 }[act]);
      ev.gap = (w.intervalBase + w.intervalPerCost * ev.cost)
        * Difficulty.spawnIntervalScale(phase) * actScale
        * (1 + w.intervalJitter * (rng() * 2 - 1));
    };
    if (signature && earlySurge) {
      setGap(signature, 'opening');
      events.push(signature);
    }
    while (budget > 0) {
      const limit = Math.min(cap, budget);
      const spentFraction = freeBudget > 0 ? (freeBudget - budget) / freeBudget : 1;
      const act = !theme ? null : spentFraction < 0.24 ? 'opening'
        : spentFraction < 0.70 ? 'pressure' : 'finale';
      const chance = !theme ? setChance
        : act === 'opening' ? w.openingSetChance
        : act === 'pressure' ? w.pressureSetChance
        : earlySurge ? 0.36 : w.finaleSetChance;
      const sets = availableSets.filter(st => st.cost <= limit && st.weight > 0);
      const singles = Object.keys(ENEMY_DEFS)
        .filter(t => ENEMY_DEFS[t].unlock <= phase && ENEMY_DEFS[t].cost <= limit && Difficulty.themedSingleWeight(t, phase) > 0)
        .map(t => ({ type: t, weight: Difficulty.themedSingleWeight(t, phase), cost: ENEMY_DEFS[t].cost }));
      let ev;
      if (sets.length && rng() < chance) {
        const st = this.weighted(sets, rng);
        ev = { members: st.members.slice(), cost: st.cost, set: st.id,
          formation: theme ? 'layered' : 'line', act };
      } else if (singles.length) {
        const sg = this.weighted(singles, rng);
        ev = { members: [sg.type], cost: sg.cost, set: null, formation: 'line', act };
      } else {
        break; // 通常は発生しない：コスト1の敵（ノーマル・レア）が常に存在する
      }
      setGap(ev, act);
      budget -= ev.cost;
      events.push(ev);
    }
    if (signature && !earlySurge) {
      setGap(signature, 'finale');
      events.push(signature);
    }
    return { events, budget: totalBudget, leftover: budget, cap,
      theme: theme?.id ?? null, themeName: theme?.name ?? null,
      pattern: theme ? (earlySurge ? 'earlySurge' : 'climax') : 'classic' };
  },
};

/* =====================================================================
 * 4. Deck — シャッフル供給とNEXT先読み（種類が増えても処理は不変）
 * ===================================================================== */
const DeckRules = {
  typeCap(phase) { return Math.min(8, 4 + Math.floor((Math.max(1, phase) - 1) / 5)); },
  validate(counts, phase) {
    if (Object.keys(counts).some(k => !UNIT_DEFS[k] || !Number.isInteger(counts[k]) || counts[k] < 0)) return false;
    const n = Object.values(counts).reduce((sum, v) => sum + v, 0);
    const types = Object.values(counts).filter(v => v > 0).length;
    return n === CONFIG.deck.size && types <= this.typeCap(phase);
  },
  normalize(cards) {
    const out = Object.fromEntries(Object.keys(UNIT_DEFS).map(type => [type, 0]));
    for (const c of cards) if (c.type in out) out[c.type] += c.count;
    return out;
  },
  expand(counts) { return Object.entries(counts).flatMap(([type, count]) => Array(count).fill(type)); },
};

class Deck {
  // [{type, count}] → カードの配列
  static expand(composition) {
    const out = [];
    for (const c of composition) for (let i = 0; i < c.count; i++) out.push(c.type);
    return out;
  }
  constructor(cards, rng = Math.random) {
    if (!cards || cards.length === 0) throw new Error('デッキが空です');
    this.cards = cards.slice();
    this.rng = rng;
    this.reset();
  }
  reset() {
    this.queue = [];
    this.current = this.draw();
  }
  refill() {
    // デッキを1周使い切るごとに、全カードを再シャッフルして補充
    this.queue.push(...Util.shuffle(this.cards.slice(), this.rng));
  }
  ensure(n) {
    while (this.queue.length < n) this.refill();
  }
  draw() {
    this.ensure(1);
    return this.queue.shift();
  }
  peekNext(n = CONFIG.deck.nextCount) {
    this.ensure(n);
    return this.queue.slice(0, n);   // [0] が次に射出台へ来るユニット
  }
  consume() {
    const used = this.current;
    this.current = this.draw();
    return used;
  }
}

/* =====================================================================
 * 5. CostManager — 初期値・自動回復・獲得・消費
 * ===================================================================== */
class CostManager {
  constructor(cfg) {
    this.cfg = cfg;
    this.unlimited = false;
    this.reset(0);
  }
  // 隠しモードはこのページを閉じるまで有効。フェーズ開始・再挑戦・最初からでも解除しない。
  enableUnlimited() {
    this.unlimited = true;
    this.value = this.cfg.max;
    this.regenTimer = 0;
  }
  reset(initial) {
    this.value = this.unlimited ? this.cfg.max : initial;
    this.regenTimer = 0;
  }
  update(dt) {
    if (this.unlimited) { this.value = this.cfg.max; this.regenTimer = 0; return; }
    // MAXでは回復タイマーも完全停止。余剰時間を持ち越さず、消費後は0から再開する。
    if (this.value >= this.cfg.max) { this.regenTimer = 0; return; }
    this.regenTimer += dt;
    // 1/120秒を足し合わせる際の浮動小数点誤差を許容する
    while (this.regenTimer >= this.cfg.regenInterval - 1e-9) {
      this.regenTimer -= this.cfg.regenInterval;
      this.add(this.cfg.regenAmount);
      if (this.value >= this.cfg.max) { this.regenTimer = 0; break; }
    }
  }
  add(n) {
    if (this.unlimited) { this.value = this.cfg.max; this.regenTimer = 0; return; }
    this.value = Math.min(this.cfg.max, this.value + n);
    if (this.value >= this.cfg.max) this.regenTimer = 0;
  }
  canAfford(n) { return this.unlimited || this.value >= n; }
  spend(n) {
    if (this.unlimited) { this.value = this.cfg.max; this.regenTimer = 0; return true; }
    if (!this.canAfford(n)) return false;
    if (this.value >= this.cfg.max) this.regenTimer = 0;
    this.value -= n;
    return true;
  }
  get regenProgress() { return this.unlimited || this.value >= this.cfg.max ? 0 : this.regenTimer / this.cfg.regenInterval; }
}

/* =====================================================================
 * 6. Entities — 味方・敵・弾丸
 * ===================================================================== */
class Ally {
  constructor(typeId, x, y, vx, vy) {
    const d = UNIT_DEFS[typeId];
    this.id = nextId();
    this.type = typeId;
    this.def = d;
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.r = d.radius;
    this.shape = d.shape || 'circle';           // 'circle' または 'square'（半辺 = radius）
    this.mass = d.mass;
    this.invMass = d.mass > 0 ? 1 / d.mass : 0;
    this.launchFriction = d.launchFriction;
    this.collisionFriction = d.collisionFriction;
    this.friction = d.launchFriction;          // 現在の減速量（衝突で弾かれると collisionFriction に切替）
    this.restitution = d.restitution;
    this.impactRestitution = d.impactRestitution;
    // knockbackMult は旧設定の互換データのみ。衝突の速度変化には掛けない。
    this.knockbackMult = d.knockbackMult;
    this.anchorsOnImpact = !!d.anchorsOnImpact;
    this.anchored = false;                     // 固定済み（質量無限大として扱う）
    this.reflections = 0;                      // 反射回数（バンパーのHP管理用）
    this.maxHp = d.hp; this.hp = d.hp;
    this.shieldHp = d.shield ? d.shield.hp : 0;
    this.shieldRecharging = false;    // 耐久値0で展開解除。満タンになるまで弾を通す
    this.iceSpeedFactor = 1;         // 範囲出入り時の倍率変更に一度だけ速度を合わせる
    this.freezeTimer = 0;
    this.healTimer = 0;
    this.shooter = d.shooter || null;
    this.attack = this.shooter ? this.shooter.attack : 0;
    this.attackInterval = this.shooter ? this.shooter.attackInterval : 0;
    this.range = this.shooter ? this.shooter.rangeUnits * CONFIG.combat.rangeUnitPx : 0;
    this.cooldown = 0;
    this.target = null;
    this.alive = true;
    this.hitFlash = 0;
    this.trailTime = 0;                      // 衝突後、残像を出す残り時間
    this.trailCarry = 0;                     // 移動距離を積算し、一定間隔で円を描く
    this.trailX = x; this.trailY = y;
    this.ricochetTime = 0;          // 弾かれた敵の連鎖衝突ダメージ判定用
  }
  takeDamage(n) {
    if (!this.alive) return false;
    this.hp -= n;
    this.hitFlash = 0.12;
    if (this.hp <= 0) { this.hp = 0; this.alive = false; return true; }
    return false;
  }
}

class Enemy {
  constructor(typeId, x, y) {
    const d = ENEMY_DEFS[typeId];
    this.id = nextId();
    this.type = typeId;
    this.def = d;
    this.x = x; this.y = y;
    this.r = d.radius;
    this.maxHp = d.hp; this.hp = d.hp;            // フェーズによる補正なし
    this.mass = d.mass;
    this.invMass = 1 / d.mass;
    this.isEnemy = true;                       // 物理演算では味方と同じ剛体として扱う
    this.shape = 'circle';
    this.restitution = d.restitution;
    this.impactRestitution = d.impactRestitution;
    this.attack = d.attack;
    this.attackInterval = d.attackInterval;
    this.range = d.range;
    this.speed = d.speed;
    this.healCooldown = 0;                     // ヒールの回復弾の間隔
    this.freezeTimer = 0;
    this.rangedTarget = null;                  // 遠距離攻撃の現在の対象
    this.rangedTimer = 0;                      // 最初の発射も捕捉後 interval 秒から
    this.muzzleFlash = 0;
    this.throwTimer = 0;                       // 投擲型：次の投擲まで（対象がいる間のみ加算）
    this.vx = 0; this.vy = this.speed;         // 速度（歩行もノックバックもこの1つの速度で表す）
    // 最初の召喚は画面上から入ってくる。一度全身が戦闘エリアへ入ったら再び上端から出ない。
    this.enteredBattle = (y - this.r >= BATTLE.top);
    this.reward = d.reward;
    this.cooldown = 0;
    this.alive = true;
    this.hitFlash = 0;
    this.trailTime = 0;                      // 衝突後、残像を出す残り時間
    this.trailCarry = 0;                     // 移動距離を積算し、一定間隔で円を描く
    this.trailX = x; this.trailY = y;
    this.ricochetTime = 0;          // 弾かれた敵の連鎖衝突ダメージ判定用
  }
  takeDamage(n) {
    if (!this.alive) return false;
    this.hp -= n;
    this.hitFlash = 0.08;
    if (this.hp <= 0) { this.hp = 0; this.alive = false; return true; }
    return false;
  }
}

class Bullet {
  constructor(src, target) {
    this.x = src.x; this.y = src.y;
    this.target = target;
    this.damage = src.attack;
    this.speed = src.shooter.bulletSpeed;
    this.r = src.shooter.bulletRadius;
    this.life = 3;
    this.alive = true;
  }
  update(dt, game) {
    if (!this.alive) return;
    this.life -= dt;
    if (this.life <= 0 || !this.target.alive) { this.alive = false; return; }
    const dx = this.target.x - this.x, dy = this.target.y - this.y;
    const d = Math.hypot(dx, dy);
    const step = this.speed * dt;
    if (d <= step + this.target.r) {
      this.alive = false;
      Sound.hit('enemy');
      if (this.target.takeDamage(this.damage)) game.onEnemyKilled(this.target);
      return;
    }
    this.x += (dx / d) * step;
    this.y += (dy / d) * step;
  }
}

/* =====================================================================
 * 6.5 EnemyProjectile — 敵弾：発射時の着弾位置へ直進し、追尾しない
 *   経路と味方当たり判定の交差を計算し、高速弾のすり抜けを防ぐ
 * ===================================================================== */
class EnemyProjectile {
  constructor(source, target) {
    const r = source.def.ranged;
    this.x = source.x; this.y = source.y;
    this.destX = target.x; this.destY = target.y;
    const dx = this.destX - this.x, dy = this.destY - this.y;
    const dist = Math.hypot(dx, dy);
    this.dx = dist > 1e-9 ? dx / dist : 0;
    this.dy = dist > 1e-9 ? dy / dist : 0;
    this.remaining = dist;
    this.speed = r.shotSpeed;
    this.r = r.shotRadius;
    this.life = r.shotLife;
    this.mode = r.mode;
    this.damage = r.damage || 0;
    this.directDamage = r.directDamage || 0;
    this.splashDamage = r.splashDamage || 0;
    this.splashRadius = r.splashRadius || 0;
    this.alive = true;
  }

  // 現在位置から次の位置への線分と、味方の衝突形状との交差位置（0〜1）
  static hitFraction(x0, y0, x1, y1, ally, radius) {
    const dx = x1 - x0, dy = y1 - y0;
    if (ally.shape === 'chamfer') {
      // 接近中の弾丸も切り欠いた角に当たらないよう、サンプリング＋二分探索。
      const v=Math.hypot(dx,dy), n=Math.max(1,Math.ceil(v / Math.max(2,radius*0.5)));
      let last=0;
      for(let i=0;i<=n;i++) {
        const t=i/n;
        const proxy={x:x0+dx*t,y:y0+dy*t,r:radius,shape:'circle'};
        if(Physics.contact(ally,proxy).pen>=0) {
          if(i===0) return 0;
          let lo=last,hi=t;
          for(let k=0;k<12;k++) { const mid=(lo+hi)/2;
            proxy.x=x0+dx*mid; proxy.y=y0+dy*mid;
            if(Physics.contact(ally,proxy).pen>=0) hi=mid; else lo=mid;
          }
          return hi;
        }
        last=t;
      }
      return null;
    }
    if (ally.shape === 'square') {
      // 正方形との交差：膨張した矩形に対する線分クリッピング
      const minX = ally.x - ally.r - radius, maxX = ally.x + ally.r + radius;
      const minY = ally.y - ally.r - radius, maxY = ally.y + ally.r + radius;
      let near = 0, far = 1;
      for (const [p, v, lo, hi] of [[x0, dx, minX, maxX], [y0, dy, minY, maxY]]) {
        if (Math.abs(v) < 1e-12) { if (p < lo || p > hi) return null; continue; }
        const t1 = (lo - p) / v, t2 = (hi - p) / v;
        near = Math.max(near, Math.min(t1, t2));
        far = Math.min(far, Math.max(t1, t2));
        if (near > far) return null;
      }
      return near;
    }
    const ox = x0 - ally.x, oy = y0 - ally.y, R = ally.r + radius;
    const c = ox * ox + oy * oy - R * R;
    if (c <= 0) return 0;
    const a = dx * dx + dy * dy;
    if (a < 1e-12) return null;
    const b = 2 * (ox * dx + oy * dy);
    const disc = b * b - 4 * a * c;
    if (disc < 0) return null;
    const t = (-b - Math.sqrt(disc)) / (2 * a);
    return t >= 0 && t <= 1 ? t : null;
  }

  update(dt, game) {
    if (!this.alive) return;
    this.life -= dt;
    if (this.life <= 0) { this.alive = false; return; }
    const distance = Math.min(this.speed * dt, this.remaining);
    const nx = this.x + this.dx * distance, ny = this.y + this.dy * distance;
    // シールドは敵本体を遮らないが、敵弾・砲弾を先に迎撃する。
    let barrier = null, barrierT = Infinity;
    for (const a of game.allies) {
      if (!a.alive || !a.def.shield || a.shieldRecharging || a.shieldHp <= 0) continue;
      const R = a.def.shield.range;
      const proxy = { x: a.x, y: a.y, r: R, shape: 'circle' };
      const t = EnemyProjectile.hitFraction(this.x, this.y, nx, ny, proxy, this.r);
      if (t !== null && t < barrierT) { barrier = a; barrierT = t; }
    }
    let first = null, firstT = Infinity;
    for (const a of game.allies) {
      if (!a.alive) continue;
      const t = EnemyProjectile.hitFraction(this.x, this.y, nx, ny, a, this.r);
      if (t !== null && t < firstT) { first = a; firstT = t; }
    }
    if (barrier && barrierT <= firstT) {
      this.x += (nx - this.x) * barrierT;
      this.y += (ny - this.y) * barrierT;
      this.alive = false;
      const force = this.mode === 'shell' ? 5 : this.damage;
      game.hitShieldBarrier(barrier, force);
      const inv = barrier.alive ? barrier.invMass : 0;
      if (inv > 0) { barrier.vx += this.dx * 220 * force * inv; barrier.vy += this.dy * 220 * force * inv;
        Physics.markKnocked(barrier); Physics.markTrail(barrier); }
      game.addEffect({ kind: 'ring', x: this.x, y: this.y, r: 15, color: PALETTE.blue, life: 0.3 });
      Sound.hit('ally');
      return;
    }
    if (first) {
      this.x += (nx - this.x) * firstT;
      this.y += (ny - this.y) * firstT;
      this.alive = false;
      if (this.mode === 'shell') this.explode(game, first);
      else { Sound.hit('ally'); game.damageAlly(first, this.damage); }
      if (this.mode === 'bullet') game.addEffect({ kind: 'enemyHit', x: this.x, y: this.y, life: 0.18 });
      return;
    }
    this.x = nx; this.y = ny;
    this.remaining -= distance;
    if (this.remaining <= 1e-7) {
      this.alive = false;
      // 外れた砲弾も発射時に記録した着弾地点で爆発
      if (this.mode === 'shell') this.explode(game, null);
    }
    if (this.x < BATTLE.left - 10 || this.x > BATTLE.right + 10 ||
        this.y < BATTLE.top - 50 || this.y > BATTLE.bottom + 10) this.alive = false;
  }

  explode(game, directlyHit) {
    Sound.explosion();
    game.addEffect({ kind: 'shellExplosion', x: this.x, y: this.y, r: this.splashRadius,
                     life: 0.38, color: PALETTE.orange });
    // 直撃5ダメージ、周囲3ダメージ。直撃と範囲を重複加算しない
    for (const a of game.allies) {
      if (!a.alive) continue;
      const inRadius = Physics.contact({ x: this.x, y: this.y, r: this.splashRadius, shape: 'circle' }, a).pen >= 0;
      if (a === directlyHit) game.damageAlly(a, this.directDamage);
      else if (inRadius) game.damageAlly(a, this.splashDamage);
    }
  }
}

/* 敵投擲型のボム。既存の味方ボムと同様、放物線状に浮きながら飛び、着弾時に無差別範囲ダメージ。
 * 弾道は発射時の味方座標を固定し、移動した相手を追尾しない。剛体計算からは除外する。
 */
class EnemyBombProjectile {
  constructor(source, target) {
    const cfg = source.def.thrower;
    this.x = source.x; this.y = source.y;
    this.startX = source.x; this.startY = source.y;
    this.destX = Util.clamp(target.x, BATTLE.left + 12, BATTLE.right - 12);
    this.destY = Util.clamp(target.y, BATTLE.top + 12, BATTLE.bottom - 12);
    this.duration = cfg.flightTime;
    this.t = 0; this.r = 11;
    this.range = cfg.radius; this.damage = cfg.damage;
    this.alive = true;
  }
  update(dt, game) {
    if (!this.alive) return;
    this.t = Math.min(this.duration, this.t + dt);
    const p = this.t / this.duration;
    this.x = this.startX + (this.destX - this.startX) * p;
    this.y = this.startY + (this.destY - this.startY) * p;
    if (p < 1 - 1e-9) return;
    this.alive = false;
    Sound.explosion();
    game.addEffect({ kind: 'shellExplosion', x: this.x, y: this.y, r: this.range,
                     life: 0.48, color: PALETTE.orange });
    const blast = { x: this.x, y: this.y, r: this.range, shape: 'circle' };
    // 爆発の対象は敵味方無差別。死亡判定は共通メソッドへ渡し、散弾なども正しく発火させる。
    for (const a of game.allies.slice())
      if (a.alive && Physics.contact(blast, a).pen >= 0) game.damageAlly(a, this.damage);
    for (const e of game.enemies.slice())
      if (e.alive && Physics.contact(blast, e).pen >= 0) game.damageEnemy(e, this.damage);
  }
}

/* スキャッター死亡時の散弾：敵味方に当たるが、1ダメージは味方にのみ。
 * ノックバックは敵味方に適用し、各弾は命中時に一度だけ消える。
 */
class ScatterShard {
  constructor(x, y, angle, config) {
    this.x = x; this.y = y;
    this.vx = Math.cos(angle) * config.speed;
    this.vy = Math.sin(angle) * config.speed;
    this.r = config.radius; this.life = config.life;
    this.damage = config.damage; this.impulse = config.knockbackImpulse;
    this.alive = true;
  }
  update(dt, game) {
    if (!this.alive) return;
    this.life -= dt;
    if (this.life <= 0) { this.alive = false; return; }
    const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;
    let target = null, targetT = Infinity, shield = null;
    // シールドは敵の散弾も防ぐ。遮蔽物に当たった弾はそこで消える。
    for (const a of game.allies) {
      if (!a.alive || !a.def.shield || a.shieldRecharging || a.shieldHp <= 0) continue;
      const t = EnemyProjectile.hitFraction(this.x, this.y, nx, ny,
        { x: a.x, y: a.y, r: a.def.shield.range, shape: 'circle' }, this.r);
      if (t !== null && t < targetT) { target = a; shield = a; targetT = t; }
    }
    for (const b of [...game.allies, ...game.enemies]) {
      if (!b.alive) continue;
      const t = EnemyProjectile.hitFraction(this.x, this.y, nx, ny, b, this.r);
      if (t !== null && t < targetT) { target = b; shield = null; targetT = t; }
    }
    if (target) {
      this.x += (nx - this.x) * targetT;
      this.y += (ny - this.y) * targetT;
      this.alive = false;
      if (shield) {
        game.hitShieldBarrier(shield, this.damage);
      } else if (!target.isEnemy) game.damageAlly(target, this.damage);
      if (target.alive && target.invMass > 0) {
        target.vx += this.vx / Math.hypot(this.vx, this.vy) * this.impulse * target.invMass;
        target.vy += this.vy / Math.hypot(this.vx, this.vy) * this.impulse * target.invMass;
        Physics.markKnocked(target);
        Physics.markTrail(target);
      }
      game.addEffect({ kind: 'enemyHit', x: this.x, y: this.y, life: 0.17 });
      Sound.hit(target.isEnemy ? 'enemy' : 'ally');
    } else {
      this.x = nx; this.y = ny;
      if (this.x < BATTLE.left - 5 || this.x > BATTLE.right + 5 ||
          this.y < BATTLE.top - 5 || this.y > BATTLE.bottom + 5) this.alive = false;
    }
  }
}

/* 味方ヒーラーの弾：負傷した味方を狙い、発射後は直進。敵に当たれば失われる */
class AllyHealProjectile {
  constructor(owner, target) {
    const h = owner.def.healer;
    this.x = owner.x; this.y = owner.y;
    const dx = target.x - owner.x, dy = target.y - owner.y, len = Math.hypot(dx, dy) || 1;
    this.vx = dx / len * h.shotSpeed; this.vy = dy / len * h.shotSpeed;
    this.r = h.radius; this.life = h.shotLife; this.amount = h.amount;
    this.ownerId = owner.id; this.alive = true;
  }
  update(dt, game) {
    if (!this.alive) return;
    this.life -= dt;
    const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;
    let victim = null, minT = Infinity, friend = false;
    for (const a of game.allies) {
      if (!a.alive || a.id === this.ownerId) continue;
      const t = EnemyProjectile.hitFraction(this.x, this.y, nx, ny, a, this.r);
      if (t !== null && t < minT) { victim = a; minT = t; friend = true; }
    }
    for (const e of game.enemies) {
      if (!e.alive) continue;
      const t = EnemyProjectile.hitFraction(this.x, this.y, nx, ny, e, this.r);
      if (t !== null && t < minT) { victim = e; minT = t; friend = false; }
    }
    this.x = nx; this.y = ny;
    if (victim) {
      this.alive = false;
      if (friend) {
        const prev = victim.hp;
        victim.hp = Math.min(victim.maxHp, victim.hp + this.amount);
        if (victim.hp > prev) { Sound.healImpact();
          game.addEffect({ kind: 'heal', x: victim.x, y: victim.y, r: victim.r, life: 0.5 }); }
      }
    }
    if (this.life <= 0 || this.x < BATTLE.left || this.x > BATTLE.right ||
        this.y < BATTLE.top || this.y > BATTLE.bottom) this.alive = false;
  }
}

/* ボムは質量0・HP0の一度きりの投擲物。剛体の衝突解決へは入れない */
class BombProjectile {
  constructor(x, y, vx, vy, def) {
    this.x = x; this.y = y;
    const flight = Util.clamp(Math.hypot(vx, vy) / 1150, 0.6, 1.1);
    this.duration = flight; this.t = 0;
    this.vx = vx * 0.37; this.vy = vy * 0.37;
    this.r = def.radius; this.damage = def.bomb.damage; this.range = def.bomb.radius;
    this.alive = true;
  }
  update(dt, game) {
    if (!this.alive) return;
    this.t = Math.min(this.duration, this.t + dt);
    this.x = Util.clamp(this.x + this.vx * dt, BATTLE.left + this.r, BATTLE.right - this.r);
    this.y = Util.clamp(this.y + this.vy * dt, BATTLE.top + this.r, BATTLE.bottom - this.r);
    if (this.t + 1e-9 < this.duration) return;
    this.alive = false;
    Sound.explosion();
    game.addEffect({ kind: 'shellExplosion', x: this.x, y: this.y, r: this.range,
                     life: 0.5, color: PALETTE.orange });
    const explosion = { x: this.x, y: this.y, r: this.range, shape: 'circle' };
    for (const a of game.allies.slice())
      if (a.alive && Physics.contact(explosion, a).pen >= 0) game.damageAlly(a, this.damage);
    for (const e of game.enemies.slice())
      if (e.alive && Physics.contact(explosion, e).pen >= 0) game.damageEnemy(e, this.damage);
  }
}

/* =====================================================================
 * 7. Physics — 独自の簡易2D物理（味方・敵・壁。敵は左右の壁のみ）
 * ===================================================================== */
const Physics = {
  // world = { contacts: Set, events: [] }。渡したときだけ接触の追跡と衝突イベントの記録を行う
  step(bodies, dt, bounds, world = null) {
    if (bodies.length === 0) return;
    const cfg = CONFIG.physics;
    const ctx = world ? { world, seen: new Set(), fired: new Set(), touchFired: new Set() } : null;
    for (const b of bodies) b.enemyContact = false;   // 敵に押されているか（摩擦の切り替え用）

    // 最速ユニットが1サブステップで半径の半分以上進まないよう分割（すり抜け防止）
    let maxV = 0, minR = Infinity;
    for (const b of bodies) {
      const v = Math.hypot(b.vx, b.vy);
      if (v > maxV) maxV = v;
      if (b.r < minR) minR = b.r;
    }
    const sub = Util.clamp(Math.ceil((maxV * dt) / (minR * 0.5)), 1, cfg.maxSubsteps);
    const h = dt / sub;

    for (let s = 0; s < sub; s++) {
      for (const b of bodies) { if (b.freezeTimer > 0) continue; b.x += b.vx * h; b.y += b.vy * h; }
      for (let it = 0; it < cfg.solverIterations; it++) {
        for (let i = 0; i < bodies.length; i++) {
          for (let j = i + 1; j < bodies.length; j++) {
            this.resolvePair(bodies[i], bodies[j], cfg, it === 0, ctx, h);
          }
        }
        for (const b of bodies) this.resolveWalls(b, bounds, cfg, ctx);
      }
      for (const b of bodies) {
        this.applyFriction(b, h, cfg);
        this.capSpeed(b, cfg);
      }
    }
    if (ctx) world.contacts = ctx.seen;          // 今回接触していた組だけを次回へ引き継ぐ
  },

  // 固定：質量無限大（invMass 0）・速度0。以後は押し戻しも撃力も受けない
  anchor(b) {
    b.anchored = true;
    b.vx = 0; b.vy = 0;
    b.invMass = 0;
  },

  resolvePair(a, b, cfg, allowBounce, ctx, stepTime = 0) {
    const c = this.contact(a, b);
    const margin = CONFIG.combat.contactMargin;
    if (c.pen <= -margin) return;

    // 接触の追跡：重なった時点で接触開始、contactMargin 以上離れるまで同じ接触とみなす
    const overlapping = c.pen > 0;
    let key = null, isNew = false;
    if (ctx) {
      key = a.id < b.id ? a.id + ':' + b.id : b.id + ':' + a.id;
      const was = ctx.world.contacts.has(key);
      if (overlapping || was) ctx.seen.add(key);
      isNew = overlapping && !was && !ctx.fired.has(key);
    }
    if (!overlapping) return;
    if (ctx && allowBounce && isNew && (a.def?.contactHeal || b.def?.contactHeal)) {
      if (!ctx.touchFired.has(key)) {
        ctx.touchFired.add(key);
        ctx.world.events.push({ type: 'touch', a, b });
      }
    }
    if (a.invMass === 0 && b.invMass === 0) return;
    if (a.isEnemy !== b.isEnemy) { a.enemyContact = true; b.enemyContact = true; }

    // 新しい衝突では、接した瞬間の向きを撃力の方向に使う（重なりの深さで向きが変わるのを防ぐ）
    let nx = c.nx, ny = c.ny;
    if (!ctx || isNew) {
      const wx = b.vx - a.vx, wy = b.vy - a.vy;
      // サブステップ直前の相対位置から最初の接触時刻を二分探索する。
      // 高速のかすめ衝突で重なった後の中心線を使うと角度がずれるため。
      const n = stepTime > 0 ? this.firstContactNormal(a, b, wx, wy, stepTime)
        : this.impactNormalFor(a, b, wx, wy);
      if (n) { nx = n.nx; ny = n.ny; }
    }

    const invSum = a.invMass + b.invMass;

    // 重なりの押し戻し（現在の重なりの向き。速度は加えない＝停止ユニットが震えない）
    const corr = (Math.max(c.pen - cfg.positionSlop, 0) * cfg.correctionPercent) / invSum;
    a.x -= c.nx * corr * a.invMass; a.y -= c.ny * corr * a.invMass;
    b.x += c.nx * corr * b.invMass; b.y += c.ny * corr * b.invMass;

    // 接近中のみ撃力を与える（質量と速度に基づく）
    const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (vn >= 0) return;
    const approach = -vn;
    // 敵が関わる接触は歩行速度では跳ねない（押し合いになる）。味方同士は従来どおり
    const bounceMin = (a.isEnemy || b.isEnemy) ? CONFIG.push.enemyBounceSpeed : cfg.bounceThreshold;
    const bounce = allowBounce && approach >= bounceMin;
    // 通常反発は 0～1 に制限。将来追加するユニットで誤って反発係数を1超にしても増速しない。
    const e = bounce
      ? Util.clamp(Math.min(a.impactRestitution ?? a.restitution, b.impactRestitution ?? b.restitution), 0, 1) : 0;
    // 実際に接した縁の座標（後の衝撃波表示に使用する）。
    const impactX = (a.x + nx * a.r + b.x - nx * b.r) / 2;
    const impactY = (a.y + ny * a.r + b.y - ny * b.r) / 2;
    const aRicochet = !!a.isEnemy && a.ricochetTime > 0;
    const bRicochet = !!b.isEnemy && b.ricochetTime > 0;
    const avx = a.vx, avy = a.vy, bvx = b.vx, bvy = b.vy;
    const aOwn = a.vx * nx + a.vy * ny;           // a が自分から b へ向かう速度
    const bOwn = -(b.vx * nx + b.vy * ny);        // b が自分から a へ向かう速度
    const sa = a.vx * a.vx + a.vy * a.vy, sb = b.vx * b.vx + b.vy * b.vy;

    // バンパー固有のアーケード反射。通常の衝突計算に倍率を掛けて増速させるのではなく、
    // 衝突面に対する相対接近速度を一定倍率で反転させる（側面方向の速度は維持）。
    // 衝突前に止まっているバンパーに当てれば、相手の跳ね返り速度が明確に増加する。
    // バンパーは従来どおり1回反射後に固定され、HP消費により消滅する。
    const bumper = bounce && a.def?.reboundSpeedMult ? a
      : bounce && b.def?.reboundSpeedMult ? b : null; // 壁で固定されたバンパーも反射可能
    const rebounded = bumper === a ? b : a;
    if (bumper && rebounded.invMass > 0) {
      const sign = bumper === a ? 1 : -1;
      const ox = nx * sign, oy = ny * sign;  // バンパーから相手へ向かう法線
      const before = rebounded.vx * ox + rebounded.vy * oy;
      const bumperNormal = bumper.vx * ox + bumper.vy * oy;
      const after = bumperNormal + approach * bumper.def.reboundSpeedMult;
      rebounded.vx += (after - before) * ox;
      rebounded.vy += (after - before) * oy;
    } else {
      // 通常の全ユニット共通の反発：運動量保存の衝突インパルス。
      // 質量・反発係数のみで計算し、knockbackMult は掛けない。
      // invMass=0（バンパーの固定状態・凍結中）も同じ式で安全に処理される。
      // e<=1 なので、通常の衝突だけでは系全体の運動エネルギーは増加しない。
      const j = ((1 + e) * approach) / invSum;
      a.vx -= j * nx * a.invMass; a.vy -= j * ny * a.invMass;
      b.vx += j * nx * b.invMass; b.vy += j * ny * b.invMass;
    }
    // 敵が衝撃で弾かれた事実を記録する。元の歩行速度だけでは有効にならない。
    // 接触イベントには「衝突直前」の状態を渡し、同じ接触を自分の弾き飛ばしでダメージ判定しない。
    if (bounce && isNew) {
      const minDelta = CONFIG.combat.enemyRicochetImpulse;
      for (const [body, vx, vy] of [[a, avx, avy], [b, bvx, bvy]]) {
        if (body.isEnemy && Math.hypot(body.vx - vx, body.vy - vy) >= minDelta)
          body.ricochetTime = CONFIG.combat.enemyRicochetSeconds;
      }
    }
    // 衝突で速度が増えた側（弾かれた側）は衝突後の摩擦に切り替える。停止後に再び当たっても毎回切り替わる
    if (!a.anchored && a.vx * a.vx + a.vy * a.vy > sa) this.markKnocked(a);
    if (!b.anchored && b.vx * b.vx + b.vy * b.vy > sb) this.markKnocked(b);

    // バンパー：最初に反射した直後にその場で固定
    if (bounce) {
      if (a.anchorsOnImpact && !a.anchored) this.anchor(a);
      if (b.anchorsOnImpact && !b.anchored) this.anchor(b);
    }
    // 衝突で弾き飛ばされた敵・味方に、短い波紋の軌跡を付ける。通常歩行・低速の押し合いは対象外。
    if (ctx && bounce && isNew) {
      this.markTrail(a);
      this.markTrail(b);
      ctx.fired.add(key);
      ctx.world.events.push({ type: 'impact', a, b, approach, aOwn, bOwn, aRicochet, bRicochet, x: impactX, y: impactY, nx, ny });
    }
  },

  // バンパーの八角形。外接矩形は従来の40×40、角を大きく切り落として正八角形に近づける。
  // 正八角形に近い輪郭にするため切り欠きを半径の58%とする。描画側も同率。
  chamferVertices(x, y, r) {
    const k = r * 0.58;
    return [[x-r+k,y-r],[x+r-k,y-r],[x+r,y-r+k],[x+r,y+r-k],
            [x+r-k,y+r],[x-r+k,y+r],[x-r,y+r-k],[x-r,y-r+k]];
  },

  // 八角形（または正方形）の多角形頂点。
  polygonVertices(body, x = body.x, y = body.y) {
    if (body.shape === 'chamfer') return this.chamferVertices(x, y, body.r);
    const r = body.r;
    return [[x-r,y-r],[x+r,y-r],[x+r,y+r],[x-r,y+r]];
  },

  // 凸多角形同士の最小分離軸。normal は必ず a→b を向く。
  polygonContact(a, b, bx, by) {
    const A = this.polygonVertices(a), B = this.polygonVertices(b, bx, by);
    let best = Infinity, nx = 0, ny = -1;
    for (const poly of [A,B]) for (let i=0;i<poly.length;i++) {
      const p=poly[i], q=poly[(i+1)%poly.length];
      const dx=q[0]-p[0], dy=q[1]-p[1], length=Math.hypot(dx,dy);
      if (!length) continue;
      let ux=-dy/length, uy=dx/length;
      let amin=Infinity, amax=-Infinity, bmin=Infinity, bmax=-Infinity;
      for (const v of A) { const d=v[0]*ux+v[1]*uy; amin=Math.min(amin,d); amax=Math.max(amax,d); }
      for (const v of B) { const d=v[0]*ux+v[1]*uy; bmin=Math.min(bmin,d); bmax=Math.max(bmax,d); }
      const pen = Math.min(amax-bmin, bmax-amin);
      if (pen < best) {
        if ((bx-a.x)*ux+(by-a.y)*uy < 0) { ux=-ux; uy=-uy; }
        best=pen; nx=ux; ny=uy;
      }
      if (pen < 0) return { nx, ny, pen };
    }
    return { nx, ny, pen: best };
  },

  // 円と凸多角形（軸平行の正方形/切り欠き八角形）。
  // closest-edge 法で角の斜面と頂点への接触を区別し、深い内包でも正しく押し戻す。
  circlePolygonContact(polyBody, cx, cy, cr) {
    const V=this.polygonVertices(polyBody);
    let closest2=Infinity, px=polyBody.x, py=polyBody.y, inside=true;
    let outX=0,outY=-1;
    for(let i=0;i<V.length;i++) {
      const a=V[i], b=V[(i+1)%V.length], dx=b[0]-a[0],dy=b[1]-a[1];
      const len2=dx*dx+dy*dy;
      const t=len2 ? Util.clamp(((cx-a[0])*dx+(cy-a[1])*dy)/len2,0,1) : 0;
      const qx=a[0]+dx*t, qy=a[1]+dy*t;
      const d2=(cx-qx)**2+(cy-qy)**2;
      if(d2<closest2) { closest2=d2; px=qx; py=qy; const L=Math.sqrt(len2)||1; outX=dy/L; outY=-dx/L; }
      if (dx*(cy-a[1])-dy*(cx-a[0]) < -1e-8) inside=false;
    }
    const d=Math.sqrt(closest2);
    if (inside) return {nx:outX,ny:outY,pen:cr+d};
    if (d<1e-9) return {nx:outX,ny:outY,pen:cr};
    return {nx:(cx-px)/d,ny:(cy-py)/d,pen:cr-d};
  },

  // 2体の接触情報：a→b の向き (nx, ny) とめり込み量 pen（離れていれば負）
  // 形状: circle / square / chamfer（角を斜めに切ったバンパー）。
  contact(a, b, ox = 0, oy = 0) {
    const bx = b.x + ox, by = b.y + oy;
    const sqA = a.shape === 'square', sqB = b.shape === 'square';
    const chamferA = a.shape === 'chamfer', chamferB = b.shape === 'chamfer';
    if (chamferA || chamferB) {
      if ((sqA || chamferA) && (sqB || chamferB)) return this.polygonContact(a, b, bx, by);
      if (chamferA) return this.circlePolygonContact(a, bx, by, b.r);
      const c = this.circlePolygonContact({ ...b, x: bx, y: by }, a.x, a.y, a.r);
      return { nx: -c.nx, ny: -c.ny, pen: c.pen };
    }
    const dx = bx - a.x, dy = by - a.y;
    if (!sqA && !sqB) {
      const d = Math.hypot(dx, dy);
      if (d < 1e-6) return { nx: 0, ny: -1, pen: a.r + b.r };
      return { nx: dx / d, ny: dy / d, pen: a.r + b.r - d };
    }
    if (sqA && sqB) {
      // 重なりの小さい軸の面で接する
      const px = a.r + b.r - Math.abs(dx), py = a.r + b.r - Math.abs(dy);
      if (px < py) return { nx: dx >= 0 ? 1 : -1, ny: 0, pen: px };
      return { nx: 0, ny: dy >= 0 ? 1 : -1, pen: py };
    }
    // 円と正方形：正方形上で円の中心に最も近い点から法線を求める（面なら面に垂直、角なら角から）
    const sq = sqA ? { x: a.x, y: a.y, h: a.r } : { x: bx, y: by, h: b.r };
    const ci = sqA ? { x: bx, y: by, r: b.r } : { x: a.x, y: a.y, r: a.r };
    const qx = Util.clamp(ci.x, sq.x - sq.h, sq.x + sq.h), qy = Util.clamp(ci.y, sq.y - sq.h, sq.y + sq.h);
    let mx = ci.x - qx, my = ci.y - qy, pen;            // m = 正方形 → 円 の向き
    const dm = Math.hypot(mx, my);
    if (dm > 1e-9) { mx /= dm; my /= dm; pen = ci.r - dm; }
    else {                                               // 円の中心が正方形の内側：一番近い面から外へ
      const faces = [[ci.x - (sq.x - sq.h), -1, 0], [(sq.x + sq.h) - ci.x, 1, 0],
                     [ci.y - (sq.y - sq.h), 0, -1], [(sq.y + sq.h) - ci.y, 0, 1]];
      faces.sort((u, v) => u[0] - v[0]);
      mx = faces[0][1]; my = faces[0][2]; pen = ci.r + faces[0][0];
    }
    return sqA ? { nx: mx, ny: my, pen } : { nx: -mx, ny: -my, pen };
  },

  // 今回のサブステップに限定して逆走し、初めて接する瞬間の法線を取る。
  // 入射速度が小さい場合や前フレームからすでに重なっていた場合は null を返し、
  // 通常の接触法線を使う。直接のPhysics.resolvePair呼び出しとも互換。
  firstContactNormal(a, b, wx, wy, h) {
    if (wx * wx + wy * wy < CONFIG.reflection.angleMinSpeed ** 2) return null;
    if (this.contact(a, b).pen <= 0) return null;
    if (this.contact(a, b, -wx * h, -wy * h).pen > 0) return null;
    let lo = 0, hi = h;
    for (let i = 0; i < 18; i++) {
      const mid = (lo + hi) / 2;
      if (this.contact(a, b, -wx * mid, -wy * mid).pen > 0) lo = mid;
      else hi = mid;
    }
    const c = this.contact(a, b, -wx * hi, -wy * hi);
    return Number.isFinite(c.nx) && Number.isFinite(c.ny) ? { nx: c.nx, ny: c.ny } : null;
  },

  // 接した瞬間の向き。(wx, wy) = b − a の相対速度。円同士は解析的に、正方形を含む組は二分探索で巻き戻す
  impactNormalFor(a, b, wx, wy) {
    if ((a.shape || 'circle') === 'circle' && (b.shape || 'circle') === 'circle') {
      return this.impactNormal(b.x - a.x, b.y - a.y, wx, wy, a.r + b.r);
    }
    const w = Math.hypot(wx, wy);
    if (w < CONFIG.physics.bounceThreshold) return null;
    const maxBack = (a.r + b.r) / w;
    if (this.contact(a, b, -wx * maxBack, -wy * maxBack).pen > 0) return null;   // 巻き戻しても離れない＝新しい衝突ではない
    let lo = 0, hi = maxBack;
    for (let i = 0; i < 14; i++) {
      const mid = (lo + hi) / 2;
      if (this.contact(a, b, -wx * mid, -wy * mid).pen > 0) lo = mid; else hi = mid;
    }
    const c = this.contact(a, b, -wx * hi, -wy * hi);
    return { nx: c.nx, ny: c.ny };
  },

  // 接した瞬間の法線：相対運動を巻き戻し、中心間の距離がちょうど rs になった位置の向きを返す
  // (px,py) = 相手 − 自分 の位置、(wx,wy) = 相手 − 自分 の速度。接近していなければ null
  impactNormal(px, py, wx, wy, rs) {
    const ww = wx * wx + wy * wy, pw = px * wx + py * wy;
    if (ww < CONFIG.physics.bounceThreshold * CONFIG.physics.bounceThreshold || pw >= 0) return null;
    const c = px * px + py * py - rs * rs;
    if (c >= 0) return null;
    const t = Math.min((pw + Math.sqrt(pw * pw - ww * c)) / ww, rs / Math.sqrt(ww));
    const cx = px - wx * t, cy = py - wy * t, L = Math.hypot(cx, cy);
    return L > 1e-6 ? { nx: cx / L, ny: cy / L } : null;
  },

  markKnocked(b) {
    if (b.collisionFriction !== undefined) b.friction = b.collisionFriction;
  },

  // 既存の速度・摩擦・反発係数は変更せず、描画用のフラグだけを設定
  markTrail(b) {
    if (b.anchored || !b.alive || Math.hypot(b.vx, b.vy) < CONFIG.visuals.trail.minSpeed) return;
    b.trailTime = CONFIG.visuals.trail.duration;
    b.trailCarry = 0;
  },

  // 通常の歩行ではなく、反射・吹き飛ばしで防衛ラインへ迫る敵だけを跳ね返す。
  // 爆発・散弾の強いノックバックも、ricochetTime が付かない場合に速度で検出する。
  shouldBounceEnemyAtDefenseLine(b) {
    const knockedSpeed = Math.max(CONFIG.push.enemyBounceSpeed,
      b.speed + CONFIG.push.knockbackDeviation);
    return b.ricochetTime > 0 || b.vy >= knockedSpeed;
  },

  resolveWalls(b, bounds, cfg, ctx) {
    if (b.anchored) return;
    if (b.isEnemy) {
      // 敵：通常の歩行で越えれば突破。衝撃で弾かれて防衛ラインに当たったときだけ強く反射。
      // 召喚時のみ上端の外から入場し、一度全身が入った敵は上端の内側で反射する。
      const e = Util.clamp(b.restitution, 0, 1); // 通常の壁反射も増速させない
      if (b.x - b.r < bounds.left)  { b.x = bounds.left + b.r;  if (b.vx < 0) { const hit = -b.vx; b.vx = -b.vx * e; if (hit >= CONFIG.combat.enemyRicochetImpulse) b.ricochetTime = CONFIG.combat.enemyRicochetSeconds; if (ctx && hit >= 110) this.markTrail(b); } }
      if (b.x + b.r > bounds.right) { b.x = bounds.right - b.r; if (b.vx > 0) { const hit = b.vx; b.vx = -b.vx * e; if (hit >= CONFIG.combat.enemyRicochetImpulse) b.ricochetTime = CONFIG.combat.enemyRicochetSeconds; if (ctx && hit >= 110) this.markTrail(b); } }
      if (!b.enteredBattle && b.y - b.r >= bounds.top) b.enteredBattle = true;
      if (b.enteredBattle) {
        if (b.y - b.r < bounds.top) {
          b.y = bounds.top + b.r;
          if (b.vy < 0) b.vy = -b.vy * e;
        }
      } else if (b.y < bounds.top - b.r) {
        b.y = bounds.top - b.r;
        if (b.vy < 0) b.vy = 0;
      }
      if (b.y + b.r >= bounds.bottom && b.vy > 0 && this.shouldBounceEnemyAtDefenseLine(b)) {
        const hit = b.vy;
        b.y = bounds.bottom - b.r;  // 画面内で反射させ、突破数は加算しない。
        b.vy = -hit * cfg.defenseLineReboundMult;
        b.ricochetTime = CONFIG.combat.enemyRicochetSeconds;
        this.capSpeed(b, cfg);
        if (ctx) {
          this.markTrail(b);
          ctx.world.events.push({ type: 'wallCollision', body: b, approach: hit,
            x: b.x, y: bounds.bottom, nx: 0, ny: -1 });
        }
      }
      return;
    }
    const e = Util.clamp(b.restitution * cfg.wallRestitution, 0, 1);
    let hit = 0, nx = 0, ny = 0, x = b.x, y = b.y;
    // 複数の壁へ同時に当たったときは、最も速度の大きい衝突地点を演出へ渡す。
    if (b.x - b.r < bounds.left) {
      b.x = bounds.left + b.r;
      if (b.vx < 0) {
        const v = -b.vx; b.vx = v * e;
        if (v > hit) { hit = v; nx = 1; ny = 0; x = bounds.left; y = b.y; }
      }
    }
    if (b.x + b.r > bounds.right) {
      b.x = bounds.right - b.r;
      if (b.vx > 0) {
        const v = b.vx; b.vx = -v * e;
        if (v > hit) { hit = v; nx = -1; ny = 0; x = bounds.right; y = b.y; }
      }
    }
    if (b.y - b.r < bounds.top) {
      b.y = bounds.top + b.r;
      if (b.vy < 0) {
        const v = -b.vy; b.vy = v * e;
        if (v > hit) { hit = v; nx = 0; ny = 1; x = b.x; y = bounds.top; }
      }
    }
    if (b.y + b.r > bounds.bottom) {
      b.y = bounds.bottom - b.r;
      if (b.vy > 0) {
        const v = b.vy;
        // 防衛ラインだけはバンパーと同じ1.5倍で反射。予想軌道も共通処理なので一致。
        b.vy = -v * cfg.defenseLineReboundMult;
        this.capSpeed(b, cfg);
        if (v > hit) { hit = v; nx = 0; ny = -1; x = b.x; y = bounds.bottom; }
      }
    }
    if (b.anchorsOnImpact && hit >= cfg.bounceThreshold) {
      this.anchor(b);                              // バンパー：壁で反射した直後に固定
      if (ctx) ctx.world.events.push({ type: 'wallImpact', body: b, approach: hit, x, y, nx, ny });
    } else if (ctx && (hit >= 110 || (b.def?.ice && hit >= cfg.bounceThreshold))) {
      this.markTrail(b);
      ctx.world.events.push({ type: 'wallCollision', body: b, approach: hit, x, y, nx, ny });
    }
  },

  applyFriction(b, h, cfg) {
    if (b.isEnemy || b.freezeTimer > 0) return;                         // 敵の歩行・凍結は別管理
    const v = Math.hypot(b.vx, b.vy);
    if (v === 0) return;
    // 敵に押されている低速の味方は pushFriction で踏ん張る（射出・滑走中の摩擦は変えない）
    const pushed = b.enemyContact && v < CONFIG.push.slowSpeed && b.def && b.def.pushFriction;
    // 氷の摩擦低減は味方にも適用。移動速度の半減は敵にのみ適用する。
    const iceFriction = b._iceFrictionFactor ?? 1;
    const nv = v - (pushed ? b.def.pushFriction : b.friction) * iceFriction * h;
    if (pushed ? nv <= 0 : nv <= cfg.stopSpeed) {
      b.vx = 0; b.vy = 0;
      // バンパー：何にも当たらず止まったらその場に設置（固定）。以後は当たった側だけが強く跳ね返る
      if (b.anchorsOnImpact && !b.anchored) this.anchor(b);
      return;
    }
    const k = nv / v;
    b.vx *= k; b.vy *= k;
  },

  capSpeed(b, cfg) {
    const v = Math.hypot(b.vx, b.vy);
    if (v > cfg.maxSpeed) { const k = cfg.maxSpeed / v; b.vx *= k; b.vy *= k; }
  },

  // 予想軌道：壁反射と摩擦のみ考慮（他ユニットとの衝突は無視）
  predict(typeId, x, y, vx, vy, bounds, seconds) {
    const d = UNIT_DEFS[typeId];
    const cfg = CONFIG.physics;
    const g = {
      x, y, vx, vy, r: d.radius, friction: d.launchFriction, restitution: d.restitution,
      invMass: 1 / d.mass, anchorsOnImpact: !!d.anchorsOnImpact, anchored: false, shape: d.shape || 'circle',
      def: d, alive: true, id: -1, freezeTimer: 0,
    };
    const h = cfg.timestep;
    // アイスは低摩擦のため、共通の2.5秒予測では移動中に終点マーカーが出てしまう。
    // 初速とアイス自身の摩擦係数から、停止まで予測できる時間を確保する。
    const duration = d.ice
      ? Math.max(seconds, Math.min(8, Math.hypot(vx, vy) / d.launchFriction + 0.2))
      : seconds;
    const steps = Math.ceil(duration / h);
    const pts = [{ x, y }];
    // アイスは壁に勢いよく衝突すると即座に爆発するため、最初の壁衝突で予測を止める。
    const world = d.ice ? { contacts: new Set(), events: [] } : null;
    for (let i = 1; i <= steps; i++) {
      // 本番と同じ step() を使う（高速時の分割処理も含めて一致させる）
      this.step([g], h, bounds, world);
      if (i % 4 === 0) pts.push({ x: g.x, y: g.y });
      const wallBurst = world && world.events.some(e => e.type === 'wallCollision' || e.type === 'wallImpact');
      if (world) world.events.length = 0;
      if (wallBurst || (g.vx === 0 && g.vy === 0)) {
        pts.push({ x: g.x, y: g.y });
        break;
      }
    }
    return pts;
  },
};

/* =====================================================================
 * 7.5 Impacts — 衝突ダメージの計算（衝突そのものは Physics が敵味方まとめて処理する）
 *   ダメージ = impactDamagePerMomentum × 質量 × 相対接近速度 × 個別倍率 × 全体倍率
 *   相対接近速度には敵の歩行を含めない（歩いてきた敵に触れただけでは発生しない）
 * ===================================================================== */
const Impacts = {
  damage(attacker, approach) {
    return CONFIG.combat.impactDamagePerMomentum * attacker.mass * approach
      * attacker.def.impactDamageMult * CONFIG.combat.impactDamageGlobalMult;
  },

};

/* =====================================================================
 * 8. Combat — 索敵・射撃・敵の攻撃・防衛ライン判定
 * ===================================================================== */
const Combat = {
  inRange(from, t) {
    return Util.dist(from.x, from.y, t.x, t.y) - t.r <= from.range;
  },
  findNearestInRange(from, list) {
    let best = null, bd = Infinity;
    for (const t of list) {
      if (!t.alive) continue;
      const d = Util.dist(from.x, from.y, t.x, t.y);
      if (d - t.r <= from.range && d < bd) { bd = d; best = t; }
    }
    return best;
  },

  updateAllies(game, dt) {
    for (const a of game.allies) {
      if (!a.alive) continue;
      a.hitFlash = Math.max(0, a.hitFlash - dt);
      if (!a.shooter || a.freezeTimer > 0) continue;                     // ノーマル・デテリオのみ射撃
      a.cooldown = Math.max(0, a.cooldown - dt);
      if (!a.target || !a.target.alive || !this.inRange(a, a.target)) {
        a.target = this.findNearestInRange(a, game.enemies);
      }
      if (a.target && a.cooldown <= 0) {
        game.bullets.push(new Bullet(a, a.target));
        Sound.shot(a.shooter.sound);
        a.cooldown = a.attackInterval;
      }
    }
  },

  // 敵の歩行：目標（真下へ歩行速度）に向けて速度を変える。位置は Physics.step が動かす
  //  - 弾かれている間（歩行速度から大きくずれている）は knockbackFriction でずれを減らす（従来のノックバックと同じ減速）
  //  - 歩いている間は driveAccel ×（1 − 速度/歩行速度）で加速。押し返されて遅くなるほど強く押す
  effectiveSpeed(e) { return e.speed * (e.iceSpeedFactor || 1); },

  driveEnemies(game, dt) {
    const K = CONFIG.push;
    for (const e of game.enemies) {
      if (!e.alive || e.freezeTimer > 0) continue;
      // 上端にいる敵は、回復・遠距離攻撃・最後列維持よりも画面内への復帰を優先。
      // 召喚直後や強い吹き飛ばしでも敵が画面外で停止し続けないようにする。
      if (e.y - e.r < BATTLE.top) {
        this.driveEnemyIntoBattle(e, dt);
        continue;
      }
      if (e.def.healer) { this.driveHealer(game, e, dt); continue; }
      if (e.def.thrower) { this.driveThrower(game, e, dt); continue; }
      if (e.def.ranged) { this.driveRanged(game, e, dt); continue; }
      const dx = e.vx, dy = e.vy - this.effectiveSpeed(e), dev = Math.hypot(dx, dy);
      if (this.isKnocked(e, 0, this.effectiveSpeed(e))) {
        const nd = Math.max(0, dev - e.def.knockbackFriction * (e._iceFrictionFactor ?? 1) * dt);
        e.vx = (dx / dev) * nd; e.vy = this.effectiveSpeed(e) + (dy / dev) * nd;
      } else {
        if (this.effectiveSpeed(e) > 0) e.vy += K.driveAccel * (1 - e.vy / this.effectiveSpeed(e)) * dt;
        else e.vy = Math.sign(e.vy) * Math.max(0, Math.abs(e.vy) - K.driveAccel * dt);   // 歩かない敵（試験用など）は止まる
        const lat = Math.max(0, Math.abs(e.vx) - K.driveAccel * dt);
        e.vx = Math.sign(e.vx) * lat;
      }
    }
  },

  // 画面外（上端）の敵の共通復帰処理。速度と摩擦の既存仕様を保持しながら内側へ誘導する。
  driveEnemyIntoBattle(e, dt) {
    const speed = Math.max(42, this.effectiveSpeed(e));
    const accel = CONFIG.push.driveAccel;
    // 上端の外では下方向へ復帰させる。水平のノックバックは徐々に減速。
    e.vx = Math.sign(e.vx) * Math.max(0, Math.abs(e.vx) - accel * dt);
    e.vy = Math.max(0, e.vy);
    // 内向きの高速ノックバックは減速させず、遅い敵だけ歩行速度まで加速する。
    if (e.vy < speed) e.vy = Math.min(speed, e.vy + accel * dt);
  },

  // 射撃型・砲撃型：射程内の味方を捕捉したら停止するが、質量を無限大にはせず押し合いは維持する
  driveRanged(game, e, dt) {
    const target = this.findNearestInRange({ x: e.x, y: e.y, range: e.def.ranged.range }, game.allies);
    const desiredY = target ? 0 : this.effectiveSpeed(e);
    const dx = e.vx, dy = e.vy - desiredY, dev = Math.hypot(dx, dy);
    if (this.isKnocked(e, 0, desiredY)) {
      const nd = Math.max(0, dev - e.def.knockbackFriction * (e._iceFrictionFactor ?? 1) * dt);
      if (dev > 0) { e.vx = dx / dev * nd; e.vy = desiredY + dy / dev * nd; }
    } else {
      const k = Math.min(1, (CONFIG.push.driveAccel / this.effectiveSpeed(e)) * dt);
      e.vx += (0 - e.vx) * k;
      e.vy += (desiredY - e.vy) * k;
    }
  },

  // 投擲型は他の生存敵の最後尾（最も上の敵）から50px後方を維持する。
  // 味方が全滅するまで最後尾を担当。他の敵がいないときは前進する（永久に画面上部で停止させない）。
  // 凍結やノックバックからの復帰も、他の敵と同じ力に基づく速度制御。
  driveThrower(game, e, dt) {
    const T = e.def.thrower;
    let rearY = Infinity;
    for (const other of game.enemies) {
      if (other !== e && other.alive) rearY = Math.min(rearY, other.y);
    }
    const desiredY = Number.isFinite(rearY)
      ? (e.y < rearY - T.rearDistance - 5 ? this.effectiveSpeed(e)
         : e.y > rearY - T.rearDistance + 5 ? -this.effectiveSpeed(e) : 0)
      : this.effectiveSpeed(e);
    const dx = e.vx, dy = e.vy - desiredY, dev = Math.hypot(dx, dy);
    if (this.isKnocked(e, 0, desiredY)) {
      const nd = Math.max(0, dev - e.def.knockbackFriction * (e._iceFrictionFactor ?? 1) * dt);
      if (dev > 1e-9) { e.vx = dx / dev * nd; e.vy = desiredY + dy / dev * nd; }
    } else {
      const k = Math.min(1, (CONFIG.push.driveAccel / this.effectiveSpeed(e)) * dt);
      e.vx += (0 - e.vx) * k;
      e.vy += (desiredY - e.vy) * k;
    }
  },

  // 弾かれ中か：目標の向きの速度が「歩行速度＋60」を超える、後ろ向きに min(歩行速度−60, 0) を下回る、
  // または横向きの速度が60を超えるとき。押し合いで遅くなっただけ（0〜歩行速度）は弾かれ中ではない
  isKnocked(e, tx, ty) {
    const D = CONFIG.push.knockbackDeviation, s = Math.hypot(tx, ty);
    if (s < 1e-6) return Math.hypot(e.vx, e.vy) > D;
    const ux = tx / s, uy = ty / s;
    const along = e.vx * ux + e.vy * uy, lat = Math.abs(e.vx * uy - e.vy * ux);
    return along > s + D || along < Math.min(s - D, 0) || lat > D;
  },

  // ヒール：負傷した仲間（自分以外）のうち最も近い相手へ向かい、射程150px以内に入ったら止まる。
  //        負傷者がいなければ通常の敵と同じく真下へ。速度の変え方は通常の敵と同じ「力に上限のある駆動」なので押し合いも有効
  driveHealer(game, e, dt) {
    const K = CONFIG.push, H = e.def.healer;
    const t = Healing.findTarget(game, e);
    e.healTarget = t;
    let tx = 0, ty = this.effectiveSpeed(e);
    if (t) {
      const dx = t.x - e.x, dy = t.y - e.y, d = Math.hypot(dx, dy);
      if (d > H.range * 0.9) { tx = (dx / d) * this.effectiveSpeed(e); ty = (dy / d) * this.effectiveSpeed(e); }   // 少し内側まで寄る
      else { tx = 0; ty = 0; }
    }
    const dx = e.vx - tx, dy = e.vy - ty, dev = Math.hypot(dx, dy);
    if (this.isKnocked(e, tx, ty)) {
      const nd = Math.max(0, dev - e.def.knockbackFriction * (e._iceFrictionFactor ?? 1) * dt);
      e.vx = tx + (dx / dev) * nd; e.vy = ty + (dy / dev) * nd;
    } else {
      const k = Math.min(1, (K.driveAccel / this.effectiveSpeed(e)) * dt);
      e.vx += (tx - e.vx) * k; e.vy += (ty - e.vy) * k;
    }
  },

  updateAllyHealers(game, dt) {
    for (const a of game.allies) {
      if (!a.alive || !a.def.healer || a.freezeTimer > 0) continue;
      let target = null, closest = Infinity;
      for (const other of game.allies) {
        if (!other.alive || other === a || other.hp >= other.maxHp) continue;
        const d = Util.dist(a.x, a.y, other.x, other.y);
        if (d - other.r <= a.def.healer.range && d < closest) { closest = d; target = other; }
      }
      if (!target) { a.healTimer = 0; continue; }
      a.healTimer += dt;
      if (a.healTimer + 1e-9 >= a.def.healer.interval) {
        a.healTimer -= a.def.healer.interval;
        game.allyHealShots.push(new AllyHealProjectile(a, target));
        Sound.healShot();
      }
    }
    for (const shot of game.allyHealShots) shot.update(dt, game);
  },
  updateBullets(game, dt) {
    for (const b of game.bullets) b.update(dt, game);
  },

  updateEnemyShots(game, dt) {
    for (const shot of game.enemyShots) shot.update(dt, game);
  },

  updateRangedEnemy(game, e, dt) {
    const cfg = e.def.ranged;
    const t = this.findNearestInRange({ x: e.x, y: e.y, range: cfg.range }, game.allies);
    if (!t) {
      e.rangedTarget = null;
      e.rangedTimer = 0;
      return;
    }
    if (e.rangedTarget !== t) {
      e.rangedTarget = t;
      e.rangedTimer = 0;                    // 捕捉・対象変更時は初回攻撃まで全時間待機
    }
    e.rangedTimer += dt;
    if (e.rangedTimer + 1e-9 >= cfg.interval) {
      e.rangedTimer -= cfg.interval;
      game.enemyShots.push(new EnemyProjectile(e, t));
      e.muzzleFlash = 0.14;
      Sound.enemyAttack(e.def.attackSound);
    }
  },

  updateEnemies(game, dt) {
    for (const e of game.enemies) {
      if (!e.alive) continue;
      if (e.freezeTimer > 0) continue;
      e.cooldown = Math.max(0, e.cooldown - dt);
      e.hitFlash = Math.max(0, e.hitFlash - dt);
      e.muzzleFlash = Math.max(0, e.muzzleFlash - dt);

      if (e.y >= BATTLE.bottom) {                // 防衛ライン突破
        e.alive = false;
        game.onEnemyBreached(e);
        continue;
      }

      if (e.def.ranged) { this.updateRangedEnemy(game, e, dt); continue; }
      if (e.def.thrower) {
        // 最後尾から最寄りの味方へ投擲。初回・次弾は指定間隔を待つ。
        const t = this.findNearestInRange({ x: e.x, y: e.y, range: Infinity }, game.allies);
        if (!t) { e.throwTimer = 0; continue; }
        e.throwTimer += dt;
        if (e.throwTimer + 1e-9 >= e.def.thrower.interval) {
          e.throwTimer -= e.def.thrower.interval;
          game.enemyBombs.push(new EnemyBombProjectile(e, t));
          e.muzzleFlash = 0.18;
          Sound.enemyAttack('artillery');
        }
        continue;
      }
      const t = e.attack > 0 ? this.findNearestInRange(e, game.allies) : null;
      if (t && e.cooldown <= 0) {                // 移動しながら即時ダメージ
        e.cooldown = e.attackInterval;
        Sound.enemyAttack(e.def.attackSound);         // 攻撃が成立したときだけ
        game.addEffect({ kind: 'strike', x: e.x, y: e.y, x2: t.x, y2: t.y, life: 0.12 });
        if (t.takeDamage(e.attack)) game.onAllyDestroyed(t);
      }
    }
  },
};

/* =====================================================================
 * 8.5 Healing — ヒールの回復弾（発射時の方向へ直進、追尾しない）
 * ===================================================================== */
const Healing = {
  findTarget(game, self) {
    let best = null, bd = Infinity;
    for (const o of game.enemies) {
      if (o === self || !o.alive || o.hp >= o.maxHp) continue;
      const d = Math.hypot(o.x - self.x, o.y - self.y);
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  },

  update(game, dt) {
    // 発射：2秒ごと、射程内に負傷した仲間がいるとき
    for (const e of game.enemies) {
      const H = e.def.healer;
      if (!H || !e.alive || e.freezeTimer > 0) continue;
      e.healCooldown = Math.max(0, e.healCooldown - dt);
      const t = e.healTarget && e.healTarget.alive && e.healTarget.hp < e.healTarget.maxHp ? e.healTarget : this.findTarget(game, e);
      if (!t || e.healCooldown > 0) continue;
      const dx = t.x - e.x, dy = t.y - e.y, d = Math.hypot(dx, dy);
      if (d > H.range || d < 1e-6) continue;
      game.healShots.push({
        x: e.x, y: e.y, vx: (dx / d) * H.shotSpeed, vy: (dy / d) * H.shotSpeed,
        r: H.shotRadius, life: H.shotLife, owner: e, amount: H.amount, alive: true, shape: 'circle',
      });
      e.healCooldown = H.interval;
      Sound.healShot();
    }
    // 移動と当たり判定：敵（発射したヒール以外）に当たれば回復、味方に当たれば回復せず消える、壁・時間切れでも消える
    for (const b of game.healShots) {
      if (!b.alive) continue;
      b.life -= dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.life <= 0 || b.x < BATTLE.left || b.x > BATTLE.right || b.y > BATTLE.bottom || b.y < BATTLE.top - 40) {
        b.alive = false; continue;
      }
      let hit = null, hitDepth = -Infinity;
      for (const o of game.enemies) {
        if (o === b.owner || !o.alive) continue;
        const depth = o.r + b.r - Math.hypot(o.x - b.x, o.y - b.y);
        if (depth > 0 && depth > hitDepth) { hit = o; hitDepth = depth; }
      }
      if (hit) {                                      // 同時に複数へ触れても回復は1回だけ
        b.alive = false;
        const before = hit.hp;
        hit.hp = Math.min(hit.maxHp, hit.hp + b.amount);
        const healed = hit.hp - before;
        if (healed > 0) {
          Sound.healImpact();
          game.addEffect({ kind: 'heal', x: hit.x, y: hit.y, r: hit.r, life: 0.5 });
        }
        continue;
      }
      for (const a of game.allies) {
        if (a.alive && Physics.contact(b, a).pen > 0) { b.alive = false; break; }
      }
    }
  },
};

/* =====================================================================
 * 9. EnemySpawner — フェーズ内の出現スケジュール
 * ===================================================================== */
class EnemySpawner {
  // フェーズ開始時に召喚予定を確定し、総数（ゲージの分母）もここで決まる
  reset(phase, rng) {
    this.rng = rng;
    this.plan = WavePlanner.plan(phase, rng);
    this.events = this.plan.events;
    this.next = 0;                                    // 次に実行するイベント
    this.spawned = 0;                                 // 出現させた敵の数
    this.totalCount = this.events.reduce((n, ev) => n + ev.members.length, 0);
    this.timer = CONFIG.phase.firstSpawnDelay;
  }
  get total() { return this.totalCount; }
  get done() { return this.next >= this.events.length; }
  update(dt, game) {
    if (this.done) return;
    this.timer -= dt;
    while (this.timer <= 0 && !this.done) {
      const ev = this.events[this.next++];
      this.spawnEvent(ev, game);
      this.timer += ev.gap;                           // 召喚した直後に次のタイマーを設定
    }
  }
  // 高フェーズのセットは前衛・後衛に分ける。各列とも6px以上の間隔を確保する。
  // 役割に応じて初期位置をずらすだけで、各敵のAI/速度/物理演算は変更しない。
  spawnEvent(ev, game) {
    const gap = 6;
    const layered = ev.formation === 'layered' && ev.members.length > 1;
    const rearTypes = new Set(['shooter', 'artillery', 'thrower', 'heal']);
    const indices = ev.members.map((_, i) => i);
    const front = layered ? indices.filter(i => !rearTypes.has(ev.members[i])) : indices;
    const rear = layered ? indices.filter(i => rearTypes.has(ev.members[i])) : [];
    const rowWidth = row => row.reduce((sum, i) => sum + 2 * ENEMY_DEFS[ev.members[i]].radius, 0)
      + Math.max(0, row.length - 1) * gap;
    const maxWidth = Math.max(rowWidth(front), rowWidth(rear));
    const leftBound = BATTLE.left + 4, rightBound = BATTLE.right - 4;
    const centerX = leftBound + maxWidth / 2
