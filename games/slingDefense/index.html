            for (let yy = 0; yy < 5; yy++) for (let xx = 0; xx < 3; xx++)
              if (rows[yy][xx] === '1') Pix.dot(start + n * 4 + xx + dx,
                top + yy + dy, color, Math.round(alpha * fade));
          }
        }
      }
    }
    for (const a of TitleBattle.actors) {
      const cx = Math.round(a.x), cy = Math.round(a.y), r = Math.round(a.r);
      if (a.side === 'ally') this.unitSprite(UNIT_DEFS[a.type], cx, cy, r, { flash: a.flash > 0 });
      else this.enemySprite({ def: ENEMY_DEFS[a.type], vx: a.vx, vy: a.vy,
        hitFlash: a.flash, muzzleFlash: 0 }, cx, cy, r);
      // メニュー内の敵HPゲージもヒット時に小さく点滅。
      if (a.side === 'enemy') this.hpBar(cx - r, cy - r - 3, r * 2, a.flash > 0 ? 0.4 : 0.82, P.orange);
    }
  },

  screenPulse(g) {
    if (g.state !== 'playing' && !g.isResultSettling()) return;
    // プレイヤーの残り突破許容数が1以下になった場合だけ、弱くゆっくり赤く脈動する。
    const remaining = g.params.breachLimit - g.breaches;
    if (remaining <= 1) {
      const wave = 0.5 + 0.5 * Math.sin(this.clock * Math.PI * 2 * 1.25);
      Pix.rect(0, 0, LW, LH, PALETTE.red, Math.round(9 + 20 * wave));
      const edgeAlpha = Math.round(18 + 18 * wave);
      Pix.rect(1, 1, LW - 2, 1, PALETTE.red, edgeAlpha);
      Pix.rect(1, LH - 2, LW - 2, 1, PALETTE.red, edgeAlpha);
      Pix.rect(1, 1, 1, LH - 2, PALETTE.red, edgeAlpha);
      Pix.rect(LW - 2, 1, 1, LH - 2, PALETTE.red, edgeAlpha);
    }
    // 強い衝突の瞬間だけごく短い明滅を重ねる（揺れと同様、停止中も実時間で消える）。
    const shock = g.effects.filter(f => f.kind === 'hitstopShock' && f.t / f.life < 0.20);
    if (shock.length) {
      const strength = Math.max(...shock.map(f => f.intensity * (1 - f.t / (f.life * 0.20))));
      Pix.rect(0, q(BATTLE.top), LW, q(BATTLE.bottom - BATTLE.top),
        PALETTE.white, Math.round(12 + 25 * strength));
    }
  },

  settingsGear(g) {
    const b = UI.gearButton, x = q(b.x), y = q(b.y);
    Pix.frame(x, y, q(b.w), q(b.h), g.state === 'settings' ? PALETTE.yellow : PALETTE.white,
              PALETTE.black, PALETTE.slate);
    const cx = x + Math.floor(q(b.w) / 2), cy = y + Math.floor(q(b.h) / 2);
    const c = g.state === 'settings' ? PALETTE.yellow : PALETTE.white;
    // 低解像度ドット絵の歯車（8方向の歯＋中心の穴）
    Pix.disc(cx, cy, 4, c);
    for (const [dx,dy] of [[-5,0],[5,0],[0,-5],[0,5],[-4,-4],[4,4],[-4,4],[4,-4]])
      Pix.rect(cx + dx, cy + dy, 1, 1, c);
    Pix.disc(cx, cy, 2, PALETTE.black);
  },

  muteIcon() {
    const b = UI.muteButton, x = q(b.x), y = q(b.y);
    Pix.frame(x, y, q(b.w), q(b.h), PALETTE.white, PALETTE.black, PALETTE.slate);
    const c = Sound.muted ? PALETTE.slate : PALETTE.white;
    Pix.rect(x + 4, y + 6, 2, 4, c);
    Pix.rect(x + 6, y + 5, 1, 6, c);
    Pix.rect(x + 7, y + 4, 1, 8, c);
    if (Sound.muted) {
      Pix.line(x + 10, y + 5, x + 14, y + 9, PALETTE.red);
      Pix.line(x + 14, y + 5, x + 10, y + 9, PALETTE.red);
    } else {
      Pix.rect(x + 9, y + 6, 1, 4, PALETTE.yellow);
      Pix.rect(x + 11, y + 5, 1, 6, PALETTE.yellow);
      Pix.rect(x + 13, y + 4, 1, 8, PALETTE.yellow);
    }
  },

  panels(g) {
    const bot = q(BATTLE.bottom);
    Pix.rect(0, bot + 1, LW, LH - bot - 1, PALETTE.black);
    // 左下は同じ幅・高さの横長パネルを上下に並べる。
    // 上段：コスト／回復ゲージ。下段：射出台にセットされたユニットの情報。
    Pix.frame(3, 259, 54, 27, PALETTE.white, PALETTE.black, PALETTE.slate);
    Pix.frame(3, 289, 54, 27, PALETTE.white, PALETTE.black, PALETTE.slate);

    // 自動回復ゲージ（10ブロック）。99/MAX中は赤く点灯し、進行しない。
    const atMax = g.cost.value >= CONFIG.cost.max;
    const filled = atMax ? 10 : Math.floor(Util.clamp(g.cost.regenProgress, 0, 1) * 10);
    for (let i = 0; i < 10; i++) {
      const color = atMax ? PALETTE.red : (i < filled ? PALETTE.green : PALETTE.slate);
      Pix.rect(7 + i * 4, 279, 3, 2, color);
    }
    // ユニット情報パネルのヘッダ・情報行・役割を区切る。
    if (g.state === 'playing') {
      const current = UNIT_DEFS[g.deck.current];
      Pix.rect(4, 290, 52, 2, current.color);
      Pix.rect(5, 297, 50, 1, PALETTE.slate);
      Pix.rect(5, 304, 50, 1, PALETTE.slate);
    }
  },

  hpBar(x, y, w, ratio, c) {
    Pix.rect(x - 1, y - 1, w + 2, 3, PALETTE.black);
    Pix.rect(x, y, w, 1, PALETTE.slate);
    Pix.rect(x, y, Math.ceil(w * Util.clamp(ratio, 0, 1)), 1, c);
  },

  // 種類ごとのドット絵。射出台・戦場・NEXTで共通（R はドット単位の半径）
  unitSprite(def, cx, cy, R, o = {}) {
    const P = PALETTE;
    // 味方専用の白い1ドット外枠。既存の黒い機体輪郭・当たり判定は変更しない。
    if (Preferences.allyOutline) {
      if (def.shape === 'chamfer') {
        Pix.chamfer(cx, cy, R + 1, P.white);
      } else if (def.shape === 'square') {
        Pix.rect(cx - R - 1, cy - R - 1, 2 * R + 2, 2 * R + 2, P.white);
      } else {
        Pix.disc(cx, cy, R + 1, P.white);
        if (def.sprite === 'normal') {
          const barrel = R >= 6 ? 3 : 2;
          Pix.rect(cx - 3, cy - R - barrel - 1, 6, barrel + 4, P.white);
        }
      }
    }
    const col = o.dim ? P.slate : def.color;
    const dark = o.dim ? [60, 55, 50] : def.colorDark;
    if (!['steel','bumper','normal'].includes(def.sprite)) {
      Pix.disc(cx, cy, R, P.black);
      Pix.disc(cx, cy, Math.max(1, R - 1), o.flash ? P.white : dark);
      Pix.disc(cx - 1, cy - 1, Math.max(1, R - 2), o.flash ? P.white : col);
      if (def.sprite === 'iron') {
        Pix.rect(cx - 3, cy - 3, 6, 6, P.black);
        Pix.rect(cx - 2, cy - 2, 4, 4, P.silver);
        for (const dx of [-R + 2, R - 3]) { Pix.dot(cx + dx, cy - 2, P.white); Pix.dot(cx + dx, cy + 2, P.white); }
      } else if (def.sprite === 'shield') {
        Pix.ring(cx, cy, Math.max(2,R-2), P.white, 230);
        Pix.rect(cx - 1, cy - 4, 2, 8, P.white); Pix.rect(cx - 4, cy - 1, 8, 2, P.white);
      } else if (def.sprite === 'healAlly' || def.sprite === 'healerAlly') {
        Pix.rect(cx - 1, cy - 3, 2, 6, P.white); Pix.rect(cx - 3, cy - 1, 6, 2, P.white);
        if (def.sprite === 'healerAlly') Pix.ring(cx, cy, Math.max(2,R-2), P.green, 150);
      } else if (def.sprite === 'rare') {
        Pix.rect(cx - 1, cy - R - 2, 2, 4, P.silver);
        Pix.rect(cx - 2, cy - 2, 4, 4, P.navy); Pix.dot(cx, cy, P.yellow);
        Pix.dot(cx - 3, cy - R + 2, P.white);
      } else if (def.sprite === 'bomb') {
        Pix.rect(cx - 1, cy - R - 2, 2, 4, P.yellow); Pix.rect(cx - 2, cy - 2, 4, 4, P.black);
        Pix.dot(cx - 2, cy - 2, P.orange);
      } else if (def.sprite === 'ice') {
        for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3;
          Pix.line(cx, cy, cx + Math.cos(a) * (R - 1), cy + Math.sin(a) * (R - 1), P.white); }
      }
      return;
    }
    if (def.sprite === 'steel') {
      // 金属球：上が明るく下が暗いクロムの濃淡、中ほどに映り込みの暗い帯、強いハイライト
      Pix.disc(cx, cy, R, P.black);
      if (o.flash) { Pix.disc(cx, cy, R - 1, P.white); return; }
      const rr = R - 1, rows = Pix.rows(rr);
      const shade = o.dim
        ? [[0.5, [110, 104, 98]], [1.01, [80, 75, 70]]]
        : [[0.18, [236, 236, 242]], [0.48, col], [0.58, dark], [0.86, [150, 150, 160]], [1.01, col]];
      for (let i = 0; i < rows.length; i++) {
        const hw = rows[i]; if (hw <= 0) continue;
        const t = (i + 0.5) / rows.length;
        const c = shade.find(([lim]) => t < lim)[1];
        Pix.rect(cx - hw, cy - rr + i, hw * 2, 1, c);
      }
      if (!o.dim) {
        Pix.rect(cx - Math.ceil(R / 2), cy - Math.ceil(R / 2), 2, R >= 5 ? 2 : 1, P.white);   // ハイライト
        if (R >= 5) Pix.dot(cx - Math.ceil(R / 2) + 2, cy - Math.ceil(R / 2) - 1, P.white);
      }
      return;
    }
    if (def.sprite === 'bumper') {
      // 角を斜めに落としたバンパー：衝突形状と同じ八角形。
      const S = R;
      Pix.chamfer(cx, cy, S, P.black);
      Pix.chamfer(cx, cy, S - 1, o.flash ? P.white : col);
      if (o.flash) return;
      if (R >= 5) {
        const flat = Math.max(1, S - Math.round(S * 0.58));
        for (let k = -flat + 1; k < flat; k += 3) { // 切り落とした角には描画しない
          Pix.dot(cx + k, cy - S + 1, dark); Pix.dot(cx + k, cy + S - 2, dark);
          Pix.dot(cx - S + 1, cy + k, dark); Pix.dot(cx + S - 2, cy + k, dark);
        }
      }
      const I = Math.max(1, S - 3);
      Pix.chamfer(cx, cy, I, P.black);
      Pix.chamfer(cx, cy, Math.max(1,I-1), o.dim ? P.slate : (o.anchored ? P.orange : P.yellow));
      if (o.anchored) {
        Pix.rect(cx - 2, cy, 4, 1, P.black); Pix.rect(cx, cy - 2, 1, 4, P.black);
        const edge=S-Math.max(1,Math.round(S*0.58));
        for (const [bx, by] of [[cx-edge,cy-S+1],[cx+edge-1,cy-S+1],
                               [cx-edge,cy+S-2],[cx+edge-1,cy+S-2]]) Pix.dot(bx, by, P.silver);
      }
      return;
    }
    // ノーマル：丸い機体＋上向きの砲身＋中央のレンズ
    const bl = R >= 6 ? 3 : 2;
    Pix.rect(cx - 2, cy - R - bl, 4, bl + 2, P.black);
    Pix.rect(cx - 1, cy - R - bl + 1, 2, bl + 1, o.dim ? P.slate : P.silver);
    Pix.disc(cx, cy, R, P.black);
    if (o.flash) { Pix.disc(cx, cy, R - 1, P.white); return; }
    Pix.disc(cx, cy, R - 1, dark);
    Pix.disc(cx - 1, cy - 1, R - 2, col);
    if (R >= 5) {
      Pix.rect(cx - 4, cy - 4, 2, 2, P.white);
      Pix.rect(cx - 1, cy - 1, 3, 3, P.navy);
      Pix.dot(cx, cy, o.dim ? P.slate : P.yellow);
    }
  },

  // HPを1ブロック＝1として表示（端数は半ブロック）
  hpBlocks(cx, y, hp, maxHp) {
    const n = Math.ceil(maxHp), w = n * 3 - 1, left = cx - Math.floor(w / 2);
    Pix.rect(left - 1, y - 1, w + 2, 3, PALETTE.black);
    for (let i = 0; i < n; i++) {
      const f = Util.clamp(hp - i, 0, 1);
      Pix.rect(left + i * 3, y, 2, 1, PALETTE.slate);
      if (f > 0) Pix.rect(left + i * 3, y, f >= 0.999 ? 2 : 1, 1, PALETTE.green);
    }
  },

  allies(g) {
    const phase = Math.floor(this.clock * 6);
    // 射程・効果範囲の点線は戦闘エリアだけに描く。下部の操作UIや上部ステータスへはみ出さない。
    // ユニット本体・HP表示はクリップせず、従来の描画順序を維持する。
    const ctx = pg.drawingContext;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, q(BATTLE.top), LW, q(BATTLE.bottom) - q(BATTLE.top));
    ctx.clip();
    // シールドの有効範囲を薄い水色で表示。外周・味方本体より下の層へ描く。
    // シールドが破壊された場合は塗りも外周も表示しない。
    for (const a of g.allies) {
      if (a.alive && a.def.shield && !a.shieldRecharging && a.shieldHp > 0)
        Pix.disc(q(a.x), q(a.y), q(a.def.shield.range), [125, 221, 249], 26);
    }
    for (const a of g.allies) {
      if (a.shooter) Pix.ring(q(a.x), q(a.y), q(a.range), a.def.color, 90, 3, phase);
      if (a.def.shield && !a.shieldRecharging && a.shieldHp > 0) Pix.ring(q(a.x), q(a.y), q(a.def.shield.range), PALETTE.blue, 100, 3, phase);
      if (a.def.ice) Pix.ring(q(a.x), q(a.y), q(a.def.ice.range), PALETTE.white, 65, 5, phase);
      if (a.def.healer) Pix.ring(q(a.x), q(a.y), q(a.def.healer.range), PALETTE.green, 45, 5, phase);
    }
    ctx.restore();
    for (const a of g.allies) {
      const cx = q(a.x), cy = q(a.y), R = q(a.r);
      this.unitSprite(a.def, cx, cy, R, { flash: a.hitFlash > 0, anchored: a.anchored });
      this.hpBlocks(cx, cy - R - (a.def.sprite === 'normal' ? 6 : 4), a.hp, a.maxHp);
      if (a.def.shield) this.hpBar(cx - R, cy + R + 3, R * 2,
        a.shieldHp / a.def.shield.hp, PALETTE.blue);
      if (a.freezeTimer > 0) Pix.ring(cx, cy, R + 2, PALETTE.white, 220, 2, phase);
    }
  },

  // 敵のドット絵（R はドット単位の半径）
  enemySprite(e, cx, cy, R) {
    const P = PALETTE, d = e.def, flash = e.hitFlash > 0;
    const col = flash ? P.peach : d.color, dark = flash ? P.peach : d.colorDark;
    if (d.sprite === 'train') {
      // 細長い高速機体＋加速ライン。進行方向が一目で分かるデザイン。
      for (const offset of [-4, 0, 4]) {
        Pix.line(cx + offset, cy - R - 9, cx + offset, cy - R - 3, P.orange, 170);
      }
      Pix.disc(cx, cy, R, P.black);
      Pix.disc(cx, cy, Math.max(2, R - 2), col);
      Pix.rect(cx - 2, cy - R + 2, 4, R * 2 - 3, dark);
      Pix.rect(cx - 3, cy + 1, 2, 3, P.white); Pix.rect(cx + 1, cy + 1, 2, 3, P.white);
      return;
    }
    if (d.sprite === 'rareEnemy') {
      // ノーマル上位互換：ピンクの二重装甲で区別。
      Pix.rect(cx - R, cy - R + 1, 2 * R, 2 * R - 2, P.black);
      Pix.rect(cx - R + 1, cy - R, 2 * R - 2, 2 * R, P.black);
      Pix.rect(cx - R + 2, cy - R + 2, 2 * R - 4, 2 * R - 4, dark);
      Pix.rect(cx - R + 3, cy - R + 3, 2 * R - 6, R - 1, col);
      Pix.rect(cx - 3, cy - 2, 2, 2, P.white); Pix.rect(cx + 1, cy - 2, 2, 2, P.white);
      Pix.rect(cx - 3, cy + 3, 6, 1, P.silver);
      return;
    }
    if (d.sprite === 'thrower') {
      // 鈍重な投擲兵：機体上部に大型の爆弾を保持。
      Pix.disc(cx, cy, R, P.black);
      Pix.disc(cx, cy, Math.max(2, R - 2), dark);
      Pix.rect(cx - R + 4, cy - 2, R * 2 - 8, 5, col);
      Pix.disc(cx, cy - R + 2, Math.max(3, R / 3), e.muzzleFlash > 0 ? P.yellow : P.orange);
      Pix.dot(cx - 2, cy + 2, P.white); Pix.dot(cx + 2, cy + 2, P.white);
      return;
    }
    if (d.sprite === 'scatter') {
      // 破片で満たされた黄色の装甲弾。
      Pix.disc(cx, cy, R, P.black);
      Pix.disc(cx, cy, Math.max(2, R - 1), col);
      for (const [dx, dy] of [[-3,-3],[3,-3],[-3,3],[3,3],[0,0]])
        Pix.rect(cx + dx - 1, cy + dy - 1, 2, 2, P.black);
      return;
    }
    if (d.sprite === 'shooter') {
      // 紫色の小型射撃兵：上部に短い砲身、前面に照準レンズ
      Pix.rect(cx - 2, cy - R - 4, 4, 7, P.black);
      Pix.rect(cx - 1, cy - R - 3, 2, 5, e.muzzleFlash > 0 ? P.yellow : P.silver);
      Pix.rect(cx - R + 1, cy - R, R * 2 - 2, R * 2, P.black);
      Pix.rect(cx - R, cy - R + 1, R * 2, R * 2 - 2, P.black);
      Pix.rect(cx - R + 1, cy - R + 1, R * 2 - 2, R * 2 - 2, dark);
      Pix.rect(cx - R + 2, cy - R + 2, R * 2 - 4, R - 1, col);
      Pix.rect(cx - 3, cy - 2, 6, 5, P.black);
      Pix.rect(cx - 2, cy - 1, 4, 3, e.muzzleFlash > 0 ? P.yellow : P.lavender);
      Pix.dot(cx - 1, cy, P.white);
      if (e.muzzleFlash > 0) {
        Pix.rect(cx - 2, cy - R - 7, 4, 2, P.orange);
        Pix.dot(cx, cy - R - 9, P.yellow);
      }
      return;
    }
    if (d.sprite === 'artillery') {
      // 青灰色の大型砲撃兵：発射直後は砲身が後退し、反動を表現する
      const recoil = e.muzzleFlash > 0 ? 2 : 0;
      Pix.rect(cx - 4, cy - R - 6 + recoil, 8, R + 8, P.black);
      Pix.rect(cx - 3, cy - R - 5 + recoil, 6, R + 5, e.muzzleFlash > 0 ? P.orange : P.slate);
      Pix.rect(cx - R, cy - R + 1, R * 2, R * 2 - 2, P.black);
      Pix.rect(cx - R + 1, cy - R, R * 2 - 2, R * 2, P.black);
      Pix.rect(cx - R + 2, cy - R + 2, R * 2 - 4, R * 2 - 4, dark);
      Pix.rect(cx - R + 4, cy - R + 4, R * 2 - 8, R * 2 - 8, col);
      Pix.rect(cx - R + 3, cy - 2, R * 2 - 6, 4, dark);
      Pix.rect(cx - 4, cy + 1, 8, 5, P.black);
      Pix.rect(cx - 3, cy + 2, 6, 3, P.orange);
      for (const bx of [cx - R + 3, cx + R - 4]) {
        for (const by of [cy - R + 3, cy + R - 4]) Pix.rect(bx, by, 2, 2, P.silver);
      }
      if (e.muzzleFlash > 0) {
        Pix.rect(cx - 4, cy - R - 9 + recoil, 8, 3, P.yellow);
        Pix.rect(cx - 2, cy - R - 12 + recoil, 4, 3, P.orange);
      }
      return;
    }
    if (d.sprite === 'speed') {
      // 黄色い菱形、黒い目、進行方向の後ろにスピードライン
      const v = Math.hypot(e.vx, e.vy) || 1, bx = -e.vx / v, by = -e.vy / v;
      for (let k = -1; k <= 1; k++) {
        const ox = cx + Math.round(-by * k * 2), oy = cy + Math.round(bx * k * 2);
        Pix.line(ox + bx * (R + 1), oy + by * (R + 1), ox + bx * (R + 3 + (k === 0 ? 2 : 0)), oy + by * (R + 3 + (k === 0 ? 2 : 0)), P.orange, 200);
      }
      for (let i = -R; i <= R; i++) {
        const hw = R - Math.abs(i);
        Pix.rect(cx - hw - 1, cy + i, hw * 2 + 2, 1, P.black);
      }
      for (let i = -R + 1; i <= R - 1; i++) {
        const hw = R - 1 - Math.abs(i);
        Pix.rect(cx - hw - 1, cy + i, hw * 2 + 2, 1, i > 0 ? dark : col);
      }
      Pix.rect(cx - 2, cy - 1, 1, 2, P.black); Pix.rect(cx + 1, cy - 1, 1, 2, P.black);
      return;
    }
    if (d.sprite === 'boss') {
      // 超重量級の直進型。暗赤色の多層装甲と大きな橙色のコアで他の敵と区別する。
      Pix.rect(cx - R, cy - R + 2, 2 * R, 2 * R - 4, P.black);
      Pix.rect(cx - R + 2, cy - R, 2 * R - 4, 2 * R, P.black);
      Pix.rect(cx - R + 2, cy - R + 2, 2 * R - 4, 2 * R - 4, dark);
      Pix.rect(cx - R + 4, cy - R + 4, 2 * R - 8, R - 4, col);
      Pix.rect(cx - R + 5, cy + 2, 2 * R - 10, R - 7, dark);
      Pix.rect(cx - R + 3, cy - 3, 2 * R - 6, 5, P.slate);
      Pix.rect(cx - 5, cy - 5, 10, 10, P.black);
      Pix.rect(cx - 4, cy - 4, 8, 8, flash ? P.white : P.orange);
      for (const x of [cx - R + 3, cx + R - 5]) {
        for (const y of [cy - R + 3, cy + R - 5]) Pix.rect(x, y, 3, 3, P.silver);
      }
      return;
    }
    if (d.sprite === 'tank') {
      // 灰色の大型装甲四角形、厚い縁、四隅と辺のボルト、橙色の目
      Pix.rect(cx - R, cy - R + 1, 2 * R, 2 * R - 2, P.black);
      Pix.rect(cx - R + 1, cy - R, 2 * R - 2, 2 * R, P.black);
      Pix.rect(cx - R + 1, cy - R + 1, 2 * R - 2, 2 * R - 2, dark);
      Pix.rect(cx - R + 3, cy - R + 3, 2 * R - 6, 2 * R - 6, col);
      if (!flash) {
        for (const [bx, by] of [[cx - R + 1, cy - R + 1], [cx + R - 2, cy - R + 1], [cx - R + 1, cy + R - 2], [cx + R - 2, cy + R - 2],
                                [cx - 1, cy - R + 1], [cx - 1, cy + R - 2], [cx - R + 1, cy - 1], [cx + R - 2, cy - 1]]) {
          Pix.rect(bx, by, 1, 1, P.silver);
        }
        Pix.rect(cx - 3, cy - 1, 2, 2, P.orange); Pix.rect(cx + 1, cy - 1, 2, 2, P.orange);
      }
      return;
    }
    if (d.sprite === 'heal') {
      // 緑色の小型六角形、中央に白い十字、周りを回る緑の光
      for (let i = -R; i < R; i++) {
        const yy = i + 0.5, hw = Math.round(R - Math.max(0, Math.abs(yy) - R * 0.5));
        Pix.rect(cx - hw, cy + i, hw * 2, 1, P.black);
      }
      for (let i = -R + 1; i < R - 1; i++) {
        const yy = i + 0.5, hw = Math.round(R - 1 - Math.max(0, Math.abs(yy) - (R - 1) * 0.5));
        Pix.rect(cx - hw, cy + i, hw * 2, 1, i >= 0 ? dark : col);
      }
      Pix.rect(cx - 1, cy - 2, 2, 4, P.white); Pix.rect(cx - 2, cy - 1, 4, 2, P.white);
      const t = this.clock * 3;
      for (let k = 0; k < 3; k++) {
        const a = t + (k * Math.PI * 2) / 3;
        Pix.dot(cx + Math.round(Math.cos(a) * (R + 2)), cy + Math.round(Math.sin(a) * (R + 2)), P.green, 200);
      }
      return;
    }
    // ノーマル：赤い角丸四角形と白い目
    Pix.rect(cx - R + 1, cy - R, 2 * R - 2, 2 * R, P.black);
    Pix.rect(cx - R, cy - R + 1, 2 * R, 2 * R - 2, P.black);
    Pix.rect(cx - R + 2, cy - R + 1, 2 * R - 4, 2 * R - 2, dark);
    Pix.rect(cx - R + 1, cy - R + 2, 2 * R - 2, 2 * R - 4, dark);
    Pix.rect(cx - R + 2, cy - R + 1, 2 * R - 4, R, col);
    Pix.rect(cx - R + 1, cy - R + 2, 2 * R - 2, R - 1, col);
    Pix.rect(cx - 3, cy - 2, 2, 2, P.white); Pix.rect(cx + 1, cy - 2, 2, 2, P.white);
    Pix.dot(cx - 2, cy - 1, P.black); Pix.dot(cx + 2, cy - 1, P.black);
  },

  enemies(g) {
    for (const e of g.enemies) {
      const cx = q(e.x), cy = q(e.y), R = Math.max(3, q(e.r));
      this.enemySprite(e, cx, cy, R);
      this.hpBar(cx - R, cy - R - 3, R * 2, e.hp / e.maxHp, PALETTE.orange);
      if (e.freezeTimer > 0) Pix.ring(cx, cy, R + 2, PALETTE.white, 210, 2, Math.floor(this.clock * 8));
    }
  },

  enemyShots(g) {
    for (const b of g.enemyShots) {
      const x = q(b.x), y = q(b.y);
      if (b.mode === 'shell') {
        Pix.disc(x, y, 3, PALETTE.black);
        Pix.disc(x, y, 2, PALETTE.orange);
        Pix.dot(x - 1, y - 1, PALETTE.white);
      } else {
        Pix.rect(x - 1, y - 1, 3, 3, PALETTE.plum);
        Pix.dot(x, y, PALETTE.white);
      }
    }
  },

  enemyBombs(g) {
    for (const b of g.enemyBombs) {
      const p = b.t / b.duration;
      const lift = 65 * 4 * p * (1 - p);
      Pix.ring(q(b.x), q(b.y), Math.max(2, q(b.r)), PALETTE.slate, 100);
      Pix.disc(q(b.x), q(b.y - lift), Math.max(2, q(b.r)), PALETTE.black);
      Pix.disc(q(b.x), q(b.y - lift), Math.max(1, q(b.r) - 1), PALETTE.orange);
      Pix.dot(q(b.x) - 1, q(b.y - lift) - 1, PALETTE.white);
    }
  },
  scatterShards(g) {
    for (const b of g.scatterShards) {
      Pix.rect(q(b.x) - 1, q(b.y) - 1, 2, 2, PALETTE.yellow);
      Pix.dot(q(b.x), q(b.y), PALETTE.white);
    }
  },
  allyShots(g) {
    for (const b of g.allyHealShots) {
      const x = q(b.x), y = q(b.y);
      Pix.disc(x, y, 2, PALETTE.green); Pix.dot(x, y, PALETTE.white);
    }
    for (const b of g.bombs) {
      const p = b.t / b.duration;
      const lift = 65 * 4 * p * (1-p);
      Pix.ring(q(b.x), q(b.y), Math.max(2, q(b.r)), PALETTE.slate, 100);
      this.unitSprite(UNIT_DEFS.bomb, q(b.x), q(b.y - lift), Math.max(3,q(b.r)));
    }
  },
  healShots(g) {
    for (const b of g.healShots) {
      const x = q(b.x), y = q(b.y);
      Pix.rect(x - 1, y - 1, 3, 3, PALETTE.forest, 160);
      Pix.rect(x - 1, y, 2, 1, PALETTE.green); Pix.rect(x, y - 1, 1, 2, PALETTE.green);
      Pix.dot(x, y, PALETTE.white);
    }
  },

  knockbackTrails(g) {
    const cfg = CONFIG.visuals.trail;
    for (const ring of g.trails) {
      const p = Math.min(1, ring.t / cfg.lifetime);
      // 小さい灰色の円が少し膨らみながら透けて消える（波紋状）
      const r = Math.max(1, q(cfg.baseRadius + cfg.expandRadius * p));
      const alpha = Math.round(cfg.opacity * (1 - p) * (1 - p));
      if (alpha >= 6) Pix.ring(q(ring.x), q(ring.y), r, PALETTE.silver, alpha);
    }
  },

  bullets(g) {
    for (const b of g.bullets) {
      const x = q(b.x), y = q(b.y);
      Pix.rect(x - 1, y - 1, 2, 2, PALETTE.yellow);
      Pix.dot(x - 1, y - 1, PALETTE.white);
    }
  },

  effects(g) {
    const bot = q(BATTLE.bottom);
    for (const fx of g.effects) {
      const p = fx.t / fx.life;
      if (fx.kind === 'strike') {
        if (p < 0.7) Pix.line(q(fx.x), q(fx.y), q(fx.x2), q(fx.y2), PALETTE.red);
      } else if (fx.kind === 'burst') {
        const d = q(fx.r) + p * 10, size = p < 0.5 ? 2 : 1;
        const c = p < 0.3 ? PALETTE.white : fx.color;
        for (let k = 0; k < 8; k++) {
          const ang = (k * Math.PI) / 4;
          Pix.rect(q(fx.x) + Math.cos(ang) * d, q(fx.y) + Math.sin(ang) * d, size, size, c);
        }
      } else if (fx.kind === 'impactWave') {
        const cx = q(fx.x), cy = q(fx.y), power = fx.power;
        const radius = Math.max(2, Math.round((3 + power * 7) * (0.6 + p * 1.5)));
        const color = fx.metal ? PALETTE.peach : PALETTE.white;
        Pix.ring(cx, cy, radius, color, Math.round(215 * (1 - p)), 1);
        const nx = fx.nx || 1, ny = fx.ny || 0;
        const tx = -ny, ty = nx;
        const rays = power > 0.55 ? 8 : 4;
        for (let k = 0; k < rays; k++) {
          const theta = k * Math.PI * 2 / rays;
          const dx = nx * Math.cos(theta) + tx * Math.sin(theta);
          const dy = ny * Math.cos(theta) + ty * Math.sin(theta);
          const start = 3 + power * 3 + p * 5;
          const end = start + 2 + power * 6;
          Pix.line(cx + dx * start, cy + dy * start, cx + dx * end, cy + dy * end,
            k % 2 ? PALETTE.yellow : color, Math.round(210 * (1 - p)));
        }
      } else if (fx.kind === 'hitstopShock') {
        // 演出だけは実時間で進める。停止中も中心フラッシュ・二重衝撃波・破片が広がる。
        const cx = q(fx.x), cy = q(fx.y), intensity = fx.intensity;
        const fade = (1 - p) * (1 - p), outer = Math.round(5 + (14 + 27 * intensity) * p);
        const color = fx.metal ? PALETTE.peach : PALETTE.white;
        Pix.ring(cx, cy, outer, color, Math.round(230 * fade), intensity > 0.7 ? 2 : 1);
        Pix.ring(cx, cy, Math.max(2, Math.round(outer * 0.59)),
          fx.lethal ? PALETTE.yellow : PALETTE.orange, Math.round(165 * fade));
        if (p < 0.20) Pix.disc(cx, cy, Math.max(1, Math.round((3 + intensity * 5) * (1 - p / 0.20))),
          PALETTE.white, Math.round(140 * (1 - p / 0.20)));
        const nx = fx.nx || 1, ny = fx.ny || 0;
        const thetaBase = Math.atan2(ny, nx);
        const rays = intensity > 0.65 ? 12 : 8;
        for (let k = 0; k < rays; k++) {
          const a = thetaBase + Math.PI * 2 * k / rays;
          const reach = (8 + 29 * intensity) * (0.35 + 0.65 * p);
          const inner = 4 + reach * 0.65;
          Pix.line(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner,
            cx + Math.cos(a) * reach, cy + Math.sin(a) * reach,
            k % 3 === 0 ? PALETTE.yellow : color, Math.round(215 * fade));
        }
      } else if (fx.kind === 'chainPulse') {
        Pix.ring(q(fx.x), q(fx.y), q(fx.r) + 1 + p * 9,
          PALETTE.yellow, Math.round(225 * (1-p)));
      } else if (fx.kind === 'enemyHit') {
        Pix.rect(q(fx.x) - 1, q(fx.y) - 1, 3, 3, p < 0.5 ? PALETTE.white : PALETTE.pink);
      } else if (fx.kind === 'shellExplosion') {
        // リングの表示半径がちょうど48px（半径16ドット）。短い爆風・破片
        const cx = q(fx.x), cy = q(fx.y), R = q(fx.r);
        const expanding = Math.max(2, Math.round(R * Math.min(1, p * 3)));
        Pix.ring(cx, cy, expanding, p < 0.45 ? PALETTE.yellow : PALETTE.orange,
                 Math.round(240 * (1 - p)), 1);
        if (p < 0.45) Pix.disc(cx, cy, Math.max(1, Math.round(4 * (1 - p))), PALETTE.peach, 180);
        for (let k = 0; k < 8; k++) {
          const angle = k * Math.PI / 4;
          const dist = R * Math.min(1, 0.2 + p * 1.5);
          Pix.dot(cx + Math.round(Math.cos(angle) * dist), cy + Math.round(Math.sin(angle) * dist),
                  k % 2 ? PALETTE.orange : PALETTE.yellow, Math.round(255 * (1 - p)));
        }
      } else if (fx.kind === 'iceExplosion') {
        Pix.ring(q(fx.x), q(fx.y), Math.max(1, q(fx.r) * Math.min(1, p * 4)), PALETTE.white, 255 * (1-p));
      } else if (fx.kind === 'heal') {
        for (let k = 0; k < 5; k++) {
          const a = (k / 5) * Math.PI * 2 + p * 2;
          Pix.dot(q(fx.x) + Math.cos(a) * (q(fx.r) + 1), q(fx.y) + Math.sin(a) * (q(fx.r) + 1) - p * 6, PALETTE.green, 255 * (1 - p));
        }
      } else if (fx.kind === 'ring') {
        Pix.ring(q(fx.x), q(fx.y), q(fx.r) + 1 + p * 6, fx.color, 255 * (1 - p));
      } else if (fx.kind === 'breach') {
        if (this.blink(14)) Pix.rect(q(fx.x) - 12, bot - 2, 24, 5, PALETTE.red);
      }
    }
  },

  aim(g) {
    const L = g.launcher;
    if (!L.aiming) return;
    const shot = L.computeShot();
    const sp = L.spawnPoint();
    const sx = q(sp.x), sy = q(sp.y);

    if (shot.state === 'angle') {
      Pix.line(sx, sy, sx + shot.dirX * 24, sy + shot.dirY * 24, PALETTE.red, 255, 2);
      return;
    }
    if (shot.state !== 'ok') return;

    // ボムは質量0の投擲物なので通常の剛体予測を通さず、着弾位置までの弾道を描く
    const isBomb = !!UNIT_DEFS[g.deck.current].projectile;
    let pts;
    if (isBomb) {
      const b = new BombProjectile(sp.x, sp.y, shot.vx, shot.vy, UNIT_DEFS.bomb);
      pts = [{ x: b.x, y: b.y }];
      for (let t = 0; t < b.duration; t += b.duration / 26) {
        const time = Math.min(b.duration, t + b.duration / 26);
        pts.push({ x: Util.clamp(sp.x + b.vx * time, BATTLE.left + b.r, BATTLE.right - b.r),
                   y: Util.clamp(sp.y + b.vy * time, BATTLE.top + b.r, BATTLE.bottom - b.r) });
      }
    } else pts = Physics.predict(g.deck.current, sp.x, sp.y, shot.vx, shot.vy, BATTLE, CONFIG.launcher.predictSeconds);
    const march = Math.floor(this.clock * 20);
    for (let i = 1; i < pts.length; i++) {
      if ((i + march) % 2 !== 0) continue;
      const c = i < pts.length * 0.5 ? PALETTE.white : PALETTE.silver;
      Pix.rect(q(pts[i].x) - 1, q(pts[i].y) - 1, 2, 2, c);
    }
    const end = pts[pts.length - 1];
    { const ud = UNIT_DEFS[g.deck.current], ex = q(end.x), ey = q(end.y), er = q(ud.radius);
      if (ud.shape === 'chamfer') {
        const cut=Math.round(er*0.58);
        const pts=[[ex-er+cut,ey-er],[ex+er-cut,ey-er],[ex+er,ey-er+cut],
                   [ex+er,ey+er-cut],[ex+er-cut,ey+er],[ex-er+cut,ey+er],
                   [ex-er,ey+er-cut],[ex-er,ey-er+cut]];
        for (let i=0;i<8;i++) { const a=pts[i],b=pts[(i+1)%8];
          Pix.line(a[0],a[1],b[0],b[1], PALETTE.white,180,2,march); }
      } else if (ud.shape === 'square') {     // 正方形のユニットは停止位置も四角で表示
        for (let k = -er; k < er; k += 2) {
          Pix.dot(ex + k, ey - er, PALETTE.white, 180); Pix.dot(ex + k, ey + er - 1, PALETTE.white, 180);
          Pix.dot(ex - er, ey + k, PALETTE.white, 180); Pix.dot(ex + er - 1, ey + k, PALETTE.white, 180);
        }
      } else Pix.ring(ex, ey, er, PALETTE.white, 180, 2, march); }

    // 射出方向の矢印
    const col = this.powerColor(shot.power);
    const tx = sx + shot.dirX * 18, ty = sy + shot.dirY * 18;
    Pix.line(sx, sy, tx, ty, col);
    Pix.line(sx + 1, sy, tx + 1, ty, col);
    const ang = Math.atan2(shot.dirY, shot.dirX);
    for (const s of [2.5, -2.5]) {
      Pix.line(tx, ty, tx + Math.cos(ang + s) * 5, ty + Math.sin(ang + s) * 5, col);
    }
  },

  powerColor(p) {
    return p < 0.4 ? PALETTE.green : p < 0.75 ? PALETTE.yellow : PALETTE.red;
  },

  launcher(g) {
    const L = g.launcher;
    const lx = q(L.x), ly = q(L.y);
    const def = L.currentDef;
    const playing = g.state === 'playing';
    const afford = g.cost.canAfford(def.cost);

    // 台座（Y字のパチンコ）
    Pix.rect(lx - 2, ly + 12, 4, 22, PALETTE.brown);
    Pix.rect(lx - 1, ly + 12, 1, 22, PALETTE.peach, 120);
    for (const s of [-1, 1]) {
      Pix.line(lx, ly + 12, lx + s * 14, ly - 4, PALETTE.brown);
      Pix.line(lx + s, ly + 12, lx + s * 15, ly - 4, PALETTE.brown);
      Pix.rect(lx + s * 14 - (s < 0 ? 1 : 0), ly - 5, 2, 2, PALETTE.silver);
    }

    const bp = L.ballPosition();
    const bx = q(bp.x), by = q(bp.y), R = q(def.radius);
    for (const s of [-1, 1]) Pix.line(lx + s * 14, ly - 4, bx + s * (R - 2), by, PALETTE.peach);

    if (playing && afford && !L.aiming && this.blink(2)) Pix.ring(lx, ly, R + 4, def.color, 200, 2);

    this.unitSprite(def, bx, by, R, { dim: !afford });

    // 射出強度ゲージ（8ブロック）
    if (L.aiming) {
      const s = L.computeShot();
      if (s.state === 'ok') {
        const n = Math.max(1, Math.ceil(s.power * 8));
        const gx = bx + R + 4;
        for (let i = 0; i < 8; i++) {
          const c = i < n ? this.powerColor((i + 1) / 8) : PALETTE.slate;
          Pix.rect(gx, by + 9 - i * 3, 4, 2, c);
        }
      }
    }
  },

  nextPanel(g) {
    Pix.frame(153, 259, 24, 58, PALETTE.white, PALETTE.black, PALETTE.slate);
    const next = g.deck.peekNext(CONFIG.deck.nextCount);
    const n = next.length, top = 270, slotH = 15;
    for (let i = 0; i < n; i++) {
      const idx = n - 1 - i;                       // 一番下が次に供給されるユニット
      const def = UNIT_DEFS[next[idx]];
      const cy = top + slotH * i + 7, cx = 165;
      if (idx === 0 && this.blink(2, 0.7)) Pix.frame(156, cy - 7, 18, 14, PALETTE.yellow, PALETTE.black);
      const R = idx === 0 ? 5 : 4;
      this.unitSprite(def, cx, cy + (def.sprite === 'normal' ? 1 : 0), R, {});
    }
  },

  holdPanel(g) {
    const b = UI.holdButton, x = q(b.x), y = q(b.y), w = q(b.w), hh = q(b.h);
    const usable = g.state === 'playing' && !g.holdUsed && !g.launcher.aiming;
    const border = g.holdDeny > 0 && this.blink(12) ? PALETTE.red : (usable ? PALETTE.white : PALETTE.slate);
    Pix.frame(x, y, w, hh, border, PALETTE.black, PALETTE.slate);
    if (g.hold) this.unitSprite(UNIT_DEFS[g.hold], x + w / 2, y + 22, 6, { dim: g.holdUsed });
  },

  statusBar(g) {
    const top = q(BATTLE.top);
    Pix.frame(1, 1, LW - 2, top - 2, PALETTE.white, PALETTE.black, PALETTE.slate);
    this.breachGauge(g);
    this.enemyGauge(g);
  },

  // 累積突破上限までの残り余裕を緑色で表示（敵残数ゲージと同じ大きさ）。
  // 数値や「突破」などの文字は表示せず、突破されるたびに右側から減っていく。
  breachGauge(g) {
    const limit = g.params.breachLimit;
    const left = limit > 0 ? Util.clamp((limit - g.breaches) / limit, 0, 1) : 0;
    const x = 37, y = 3, w = 110, h = 5;
    Pix.rect(x - 1, y - 1, w + 2, h + 2, PALETTE.white);
    Pix.rect(x, y, w, h, PALETTE.black);
    const filled = Math.round(w * left);
    // 残り3体は1秒周期、2体は0.65秒、1体は0.35秒周期で明滅。
    const remaining = Math.max(0, limit - g.breaches);
    const blinkRate = remaining === 3 ? 1 : remaining === 2 ? 1 / 0.65 : 1 / 0.35;
    if (remaining > 3 || remaining <= 0 || this.blink(blinkRate)) {
      Pix.rect(x, y, filled, h, PALETTE.green);
      Pix.rect(x, y, filled, 1, PALETTE.forest);
    }
    for (let k = x + 10; k < x + w; k += 11) Pix.rect(k, y + h - 1, 1, 1, PALETTE.black);
  },

  // 敵残数ゲージ（ステータス欄の下段。戦闘エリアの位置は変えない）
  gauge: { phase: -1, total: 0, shown: 1, trail: 1, state: '' },
  enemyGauge(g) {
    const G = this.gauge, total = g.totalEnemies, rem = g.remainingEnemies;
    const ratio = total > 0 ? Util.clamp(rem / total, 0, 1) : 0;
    // フェーズ開始・再挑戦では満タンから表示し直す（アニメーションを持ち越さない）
    if (G.phase !== g.phase || G.total !== total || (g.state === 'playing' && G.state !== 'playing')) {
      G.shown = ratio; G.trail = ratio;
    }
    G.phase = g.phase; G.total = total; G.state = g.state;
    // 残量は素早く、白い残像はゆっくり追従
    const dt = Math.min(1 / 30, deltaTime / 1000 || 1 / 60);
    G.shown += (ratio - G.shown) * Math.min(1, dt * 18);
    if (G.trail < G.shown) G.trail = G.shown;
    G.trail = Math.max(G.shown, G.trail - dt * 0.6);
    const x = 37, y = 12, w = 110, h = 5;                       // ドット座標（ゲーム座標 x111〜441, y36〜51）
    Pix.rect(x - 1, y - 1, w + 2, h + 2, PALETTE.white);
    Pix.rect(x, y, w, h, PALETTE.black);
    const tw = Math.round(w * G.trail), sw = Math.round(w * G.shown);
    Pix.rect(x, y, tw, h, PALETTE.peach);
    Pix.rect(x, y, sw, h, PALETTE.red);
    Pix.rect(x, y, sw, 1, PALETTE.pink);                        // 上端のハイライト
    for (let k = x + 10; k < x + w; k += 11) Pix.rect(k, y + h - 1, 1, 1, PALETTE.black); // 目盛り
  },

      Pix.frame(10, 49, LW - 20, 241, PALETTE.white, PALETTE.black, PALETTE.slate);

                  PALETTE.white, PALETTE.black, PALETTE.slate);
        Pix.frame(q(L.confirmCancel.x), q(L.confirmCancel.y), q(L.confirmCancel.w), q(L.confirmCancel.h),
                  PALETTE.white, PALETTE.navy);
        Pix.frame(q(L.confirmRestart.x), q(L.confirmRestart.y), q(L.confirmRestart.w), q(L.confirmRestart.h),
                  PALETTE.red, PALETTE.navy);
      }
      return;
    }
    if (g.state === 'deckedit') {
      pg.image(ditherG, 0, 0);

        Pix.frame(q(L.plus), q(y), q(L.btnW), q(L.btnH), PALETTE.white, PALETTE.navy);
      }
      Pix.frame(q(L.confirm.x), q(L.confirm.y), q(L.confirm.w), q(L.confirm.h),
        DeckRules.validate(g.deckDraft, g.deckTargetPhase) ? PALETTE.green : PALETTE.slate, PALETTE.navy);
      Pix.frame(q(L.cancel.x), q(L.cancel.y), q(L.cancel.w), q(L.cancel.h), PALETTE.silver, PALETTE.black);
      return;
    }
    if (g.state === 'playing' ||
        ((g.state === 'cleared' || g.state === 'gameover') && g.stateTime < CONFIG.result.overlayDelay)) return;
    if (g.state === 'title') {
      // タイトルでは衝突デモを薄く透かし、説明文とボタンの可読性を守る。

  /* ---------- 文字層（等倍・ドットフォント） ---------- */
  txt(s, x, y, size, c, h = LEFT, v = TOP, whiteOutline = false) {
    // 外部フォントの読み込み後も、全画面で同じドットフォントを指定する。
    textFont(FONT);
    textSize(size); textAlign(h, v);
    if (whiteOutline) {
      // HP増減数字のみ：黒い外影 + 白い縁取り + 本来の文字色。
      // 拡大された高ダメージ数値でも枠線が同じ比率で拡大される。
      push();
      drawingContext.lineJoin = 'round';
      stroke(0, 0, 0, 220); strokeWeight(Math.max(3, size * 0.22));
      fill(0); text(s, x + 1, y + 2);
      stroke(255, 255, 255); strokeWeight(Math.max(1.5, size * 0.11));
      fill(c[0], c[1], c[2]); text(s, x, y);
      pop();
      return;
    }
    noStroke();
    fill(0); text(s, x + 2, y + 2);
    fill(c[0], c[1], c[2]); text(s, x, y);
  },

  // 敵味方共通のHP増減をHUDより背面に描画し、戦闘エリアの外には出さない。
  floatingTexts(g) {
    if (g.state !== 'playing' && !g.isResultSettling()) return;
    const ctx = drawingContext;
    ctx.save();
    ctx.beginPath();
    ctx.rect(BATTLE.left, BATTLE.top, BATTLE.right - BATTLE.left, BATTLE.bottom - BATTLE.top);
    ctx.clip();
    for (const fx of g.effects) {
      if (fx.kind !== 'text') continue;
      const p = fx.t / fx.life;
      if (p > 0.7 && !this.blink(12)) continue;
      // 数値が大きいほど文字も大きくする。極端な値はHUDを覆わないよう上限を設定。
      const size = Util.clamp(14 + 2.4 * (fx.magnitude ?? Math.abs(Number(fx.text))), 14, 36);
      this.txt(fx.text, fx.x, fx.y - 12 - p * 24, size, fx.color, CENTER, CENTER, true);
    }
    ctx.restore();
  },

  texts(g) {
    if (g.state === 'settings') { this.settingsTexts(); return; }  // 設定画面は既存のHUD文字より前面
    if (g.state === 'title') { this.overlayTexts(g); return; } // メニューでは戦闘HUDを表示しない
    this.floatingTexts(g);  // UIテキストより先に描くことでHUDが必ず前面になる
    if ((g.state === 'playing' || g.isResultSettling()) && g.chainNotice && g.chainNotice.until > g.battleTime) {
      const remaining = g.chainNotice.until - g.battleTime;
      const col = remaining < 0.35 && !this.blink(8) ? PALETTE.peach : PALETTE.yellow;

        23, col, CENTER, TOP);

    // ステータス：上段は緑の残り耐久ゲージ、右横は残り/最大HP。下段は敵残数。

    this.txt('ENEMIES', 18, 38, 12, PALETTE.silver);
    this.txt(`${g.remainingEnemies}/${g.totalEnemies}`, 452, 37, 14,
      g.remainingEnemies === 0 ? PALETTE.green : PALETTE.white);

    // 下部パネル
    this.txt('防衛ライン', 8, BATTLE.bottom - 20, 11, PALETTE.orange);
    this.txt('コスト', 21, 787, 12, PALETTE.silver);
    this.txt(pad2(g.cost.value), 21, 801, 29, afford ? PALETTE.white : PALETTE.red);
    // 左下の下段パネルは現在のデッキカードを参照し、射出・HOLD後も即更新。
    if (g.state === 'playing') this.launchUnitInfo(g);
    this.txt('NEXT', 495, 788, 12, PALETTE.silver, CENTER, TOP);
    { const b = UI.holdButton, cx = b.x + b.w / 2;
      this.txt('HOLD', cx, 786, 12, PALETTE.silver, CENTER, TOP);
      if (!g.hold) this.txt('空', cx, 842, 14, PALETTE.slate, CENTER, CENTER);
      else this.txt(String(UNIT_DEFS[g.hold].cost), cx, 845, 12, g.holdUsed ? PALETTE.silver : PALETTE.white, CENTER, CENTER);
      if (g.holdUsed) this.txt('射出後に可', cx, 870, 10, PALETTE.slate, CENTER, CENTER); }

    // 射出台
    const L = g.launcher;
    const bp = L.ballPosition();
    this.txt(String(def.cost), q(bp.x) * PX - 2, q(bp.y) * PX - 3, 14, afford ? PALETTE.white : PALETTE.silver, CENTER, CENTER);
    if (g.state === 'playing' && !afford && (L.denyFlash > 0 ? this.blink(10) : this.blink(1.5, 0.7))) {
      this.txt('コスト不足', L.x, 790, 14, PALETTE.red, CENTER, TOP);
    }
    if (L.aiming) {
      const s = L.computeShot();
      if (s.state === 'cancel') this.txt('離すとキャンセル', L.x, 700, 14, PALETTE.silver, CENTER, CENTER);
      if (s.state === 'angle') this.txt('下へ引くと上へ飛ぶ', L.x, 700, 14, PALETTE.red, CENTER, CENTER);
    }

    this.overlayTexts(g);
  },

  // 左下のコストパネルと同サイズのユニット情報カード。
  launchUnitInfo(g) {
    const d = UNIT_DEFS[g.deck.current];
    if (!d) return;
    const role = {
      normal: '射撃', bumper: '高速反射', steel: '重量衝突', iron: '強打・重量',
      shield: '弾を防ぐ', heal: '接触回復', healer: '回復射撃', rare: '軽量射撃',
      bomb: '範囲爆発', ice: '凍結・減速',
    }[g.deck.current] || '特殊';

    this.txt('HP', 18, 897, 10, PALETTE.silver);
    this.txt(d.hp === 0 ? '—' : String(d.hp), 63, 896, 12, PALETTE.white, RIGHT);
    this.txt('重さ', 78, 897, 10, PALETTE.silver);
    this.txt(String(d.mass), 159, 896, 12, PALETTE.white, RIGHT);
    this.txt('COST', 18, 919, 11, PALETTE.silver);
    this.txt(String(d.cost), 72, 918, 13, PALETTE.yellow, RIGHT);

  overlayTexts(g) {

      this.deckEditorTexts(g);

      const nx = Difficulty.forPhase(g.phase + 1);

      const nextTheme = Difficulty.themeForPhase(g.phase + 1);
      if (nextTheme) this.txt(`次の戦術テーマ：${nextTheme.name}`, W / 2, 530, 13, PALETTE.peach, CENTER, CENTER);
    } else if (g.state === 'gameover') {
      this.txt('ゲームオーバー', W / 2, 392, 32, PALETTE.red, CENTER, CENTER);

      this.txt(`撃破 ${pad2(g.kills)}`, W / 2, 470, 14, PALETTE.silver, CENTER, CENTER);
      this.txt(`再挑戦はこのフェーズ開始時のコスト${Math.floor(g.phaseStartCost ?? 0)}から`, W / 2, 500, 13, PALETTE.silver, CENTER, CENTER);
    }

      if (i === 0 && this.blink(2.5)) {
        textSize(18);
        this.txt('▶', cx + 10 - textWidth(b.label) / 2 - 22, cy, 16, PALETTE.yellow, CENTER, CENTER);
      }
    });
  },

  settingsTexts() {
    const L = UI.settingsLayout;
    if (game.settingsRestartConfirm) {
      // 等倍キャンバスの文字は低解像度の暗幕より後で描画されるため、
      // 確認ダイアログ中は背面の音量ラベルを描かない（文字の重なり防止）。
      this.txt('最初からやり直しますか？', 270, 401, 22, PALETTE.yellow, CENTER, CENTER);
      this.txt('現在のフェーズの進行状況は失われます', 270, 447, 14, PALETTE.white, CENTER, CENTER);
      this.txt('キャンセル', L.confirmCancel.x + L.confirmCancel.w/2,
               L.confirmCancel.y + L.confirmCancel.h/2, 17, PALETTE.white, CENTER, CENTER);
      this.txt('最初から', L.confirmRestart.x + L.confirmRestart.w/2,

    }
    this.txt('設定', 270, 202, 31, PALETTE.yellow, CENTER, CENTER);
    this.txt('味方ユニットの白い輪郭線', 92, 311, 17, PALETTE.white, LEFT, CENTER);
    this.txt(Preferences.allyOutline ? 'ON' : 'OFF', L.outline.x + L.outline.w/2,
      L.outline.y + L.outline.h/2, 19, Preferences.allyOutline ? PALETTE.green : PALETTE.silver, CENTER, CENTER);
    const labels = { master: 'マスター音量', bgm: 'BGM音量', sfx: '効果音量' };
    for (const key of ['master', 'bgm', 'sfx']) {

    }
    this.txt('バーを左右にスライドして音量を調整', 270, 704, 13, PALETTE.silver, CENTER, CENTER);

    this.txt('戻る', L.back.x + L.back.w/2, L.back.y + L.back.h/2,
             19, PALETTE.white, CENTER, CENTER);
    this.txt('最初から', L.restart.x + L.restart.w/2, L.restart.y + L.restart.h/2,
             19, PALETTE.white, CENTER, CENTER);

  deckEditorTexts(g) {
    const L = UI.deckLayout;
    const total = g.deckDraftTotal(), types = g.deckDraftTypes(), cap = DeckRules.typeCap(g.deckTargetPhase);
    this.txt('デッキ編集', 270, 147, 28, PALETTE.yellow, CENTER, CENTER);
    this.txt(`フェーズ${g.deckTargetPhase}  ${total}/8枚  種類 ${types}/${cap}`, 270, 187, 17, PALETTE.white, CENTER, CENTER);
    this.txt('全10種類から選択・同じユニットを複数枚使えます', 270, 215, 12, PALETTE.silver, CENTER, CENTER);
    Object.keys(UNIT_DEFS).forEach((type, i) => {
      const d = UNIT_DEFS[type], yy = L.top + L.step * i;
      this.txt(d.name, 74, yy + 6, 15, g.deckSelected === type ? PALETTE.yellow : (g.deckDraft[type] ? PALETTE.white : PALETTE.silver));
      this.txt(`C${d.cost} H${d.hp} M${d.mass}`, 188, yy + 8, 11, PALETTE.silver);
      this.txt('−', L.minus + L.btnW/2, yy + 15, 23, PALETTE.white, CENTER, CENTER);
      this.txt(String(g.deckDraft[type]), 405, yy + 15, 19, g.deckDraft[type] ? PALETTE.green : PALETTE.silver, CENTER, CENTER);
      this.txt('＋', L.plus + L.btnW/2, yy + 15, 23, PALETTE.white, CENTER, CENTER);
    });
    const chosen = UNIT_DEFS[g.deckSelected] || UNIT_DEFS.normal;
    const descriptions = {
      normal: '射程3・0.6秒ごとに1ダメージ', bumper: 'コスト1・壁で壊れず、対ユニット反射で消滅',
      steel: '質量2の打撃、敵を弾く', iron: '超重量・強力な衝突と吹き飛ばし',
      shield: 'HP4・バリアHP8、破壊後10秒で再展開', heal: '接触相手を敵味方問わず1.5回復、消滅',
      healer: '範囲4・2.9秒ごとに味方を2回復', rare: 'HP6・射撃ダメージ0.7',
      bomb: '投擲して範囲3.5に敵味方4ダメージ', ice: '範囲5の敵の摩擦・速度半減、衝突で3秒凍結',
    };
    this.txt(`選択: ${chosen.name}`, 270, 639, 15, PALETTE.yellow, CENTER, CENTER);
    this.txt(descriptions[g.deckSelected] || '', 270, 663, 13, PALETTE.white, CENTER, CENTER);
    const slots = DeckRules.expand(g.deckDraft).map(id => UNIT_DEFS[id].name.slice(0,2));
    this.txt('編成 ' + (slots.join(' / ') || '未設定'), 270, 687, 11, PALETTE.silver, CENTER, CENTER);
    this.txt(DeckRules.validate(g.deckDraft, g.deckTargetPhase) ? 'このデッキで開始' : '8枚に揃えてください',
      270, L.confirm.y + 27, 19, DeckRules.validate(g.deckDraft, g.deckTargetPhase) ? PALETTE.green : PALETTE.silver, CENTER, CENTER);
    this.txt('戻る（変更を破棄）', 270, L.cancel.y + 20, 13, PALETTE.silver, CENTER, CENTER);
  },
  scanlines() {
    noStroke(); fill(0, 0, 0, 34);
    for (let y = 0; y < LH; y++) rect(0, y * PX + 2, CONFIG.screen.width, 1);
  },

  draw(g) {
    this.world(g);
    drawingContext.imageSmoothingEnabled = false;
    image(pg, 0, 0, CONFIG.screen.width, CONFIG.screen.height);
    this.texts(g);
    this.scanlines();
  },
};

/* =====================================================================
 * 14. Screen & Input — 9:16固定表示とマウス／タッチ統合入力
 * ===================================================================== */
const view = { s: 1, ox: 0, oy: 0 };

function computeView() {
  const W = CONFIG.screen.width, H = CONFIG.screen.height;
  view.s = Math.min(width / W, height / H);
  view.ox = (width - W * view.s) / 2;
  view.oy = (height - H * view.s) / 2;
}

const Input = {
  toGame(el, clientX, clientY) {
    const r = el.getBoundingClientRect();
    return { x: (clientX - r.left - view.ox) / view.s, y: (clientY - r.top - view.oy) / view.s };
  },
  attach(el) {
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      Sound.unlock();
      const p = this.toGame(el, e.clientX, e.clientY);
      if (UI.pointerDown(game, p.x, p.y, e.pointerId)) {
        // 設定のスライダーは指がレールから外れてもドラッグを継続する。
        if (UI.volumeDrag && UI.volumeDrag.id === e.pointerId) {
          try { el.setPointerCapture(e.pointerId); } catch (_) { /* 非対応環境 */ }
        }
        return;
      }
      if (game.launcher.pointerDown(e.pointerId, p.x, p.y)) {
        try { el.setPointerCapture(e.pointerId); } catch (_) { /* 非対応環境 */ }
      }
    }, { passive: false });

    el.addEventListener('pointermove', e => {
      if (!game.launcher.aiming && !UI.volumeDrag) return;
      e.preventDefault();
      const p = this.toGame(el, e.clientX, e.clientY);
      if (UI.pointerMove(e.pointerId, p.x, p.y)) return;
      game.launcher.pointerMove(e.pointerId, p.x, p.y);
    }, { passive: false });

    el.addEventListener('pointerup', e => {
      Sound.unlock();
      const p = this.toGame(el, e.clientX, e.clientY);
      if (UI.pointerUp(e.pointerId, p.x, p.y)) return;
      game.launcher.pointerUp(e.pointerId, p.x, p.y);
    });
    el.addEventListener('pointercancel', e => { UI.pointerCancel(e.pointerId); game.launcher.cancelPointer(e.pointerId); });
    el.addEventListener('lostpointercapture', e => { UI.pointerCancel(e.pointerId); game.launcher.cancelPointer(e.pointerId); });
    el.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('touchend', () => Sound.unlock(), { passive: true });
    document.addEventListener('keydown', e => {
      if (e.key === 'm' || e.key === 'M') {
        Sound.setMuted(!Sound.muted);
        if (!Sound.muted) Sound.unlock();
      }
      if (e.key === 'h' || e.key === 'H' || e.key === 'Shift') game.tryHold();
      if (e.key === 'Escape') {
        if (game.state === 'settings') {
          UI.volumeDrag = null;
          if (game.settingsRestartConfirm) game.settingsRestartConfirm = false;
          else game.closeSettings();
        }
        else game.cancelDeck();
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { game.launcher.cancel(); Sound.stopBgm(); }
    });

    // ページのスクロール・拡大を防止
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());
  },
};

/* =====================================================================
 * 15. p5.js エントリポイント
 * ===================================================================== */
let game;
let lastTime = 0;

function holderSize() {
  const h = document.getElementById('game');
  return { w: h.clientWidth || window.innerWidth, h: h.clientHeight || window.innerHeight };
}

function fitCanvas() {
  const s = holderSize();
  if (s.w !== width || s.h !== height) resizeCanvas(s.w, s.h);
  computeView();
}

function setup() {
  const s = holderSize();
  const c = createCanvas(s.w, s.h);
  c.parent('game');
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  noSmooth();
  textFont(FONT);
  Preferences.init();
  Sound.init();
  // 開始メニューからBGMの再生を試す。自動再生が禁止された端末では最初のタップで解放される。
  if (!Sound.muted) Sound.unlock();
  // フォントが非同期で読み込まれても次フレームのテキスト描画へ適用される。
  if (document.fonts && document.fonts.load) {
    document.fonts.load("16px 'DotGothic16'").then(() => textFont(FONT)).catch(() => {});
  }

  pg = createGraphics(LW, LH);
  pg.pixelDensity(1);
  pg.noSmooth();
  pg.noStroke();
  ditherG = makeDither();

  computeView();
  game = new Game();
  Input.attach(c.elt);
  if (window.ResizeObserver) new ResizeObserver(() => fitCanvas()).observe(document.getElementById('game'));
  lastTime = performance.now();
}

function windowResized() { fitCanvas(); }

function draw() {
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  game.update(dt);
  if (!game.launcher.aiming && Sound.drag) Sound.dragEnd('cancel');   // 停止漏れの保険
  Sound.updateSlide(game);                                            // 滑走音（1フレーム1回）
  // タイトル表示時から、画面の切り替えに関係なくBGMを連続再生する。
  Sound.updateBgm(game.state);                                       // 音声時間で先行予約するBGM
  Renderer.clock += Math.min(dt, 0.25);

  background(0);
  const sh = Renderer.shakeOffset(game);
  push();
  translate(view.ox + sh.x * view.s, view.oy + sh.y * view.s);
  scale(view.s);
  Renderer.draw(game);
  pop();

  // ゲーム領域外を黒で塗りつぶす
  const gw = CONFIG.screen.width * view.s, gh = CONFIG.screen.height * view.s;
  noStroke(); fill(0);
  rect(0, 0, view.ox, height);
  rect(view.ox + gw, 0, width - view.ox - gw, height);
  rect(0, 0, width, view.oy);
  rect(0, view.oy + gh, width, height - view.oy - gh);
}
</script>
