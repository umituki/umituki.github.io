<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>X</title>
<style>
:root{
  --bg:#ffffff;
  --text:#0f1419;
  --sub:#536471;
  --line:#eff3f4;
  --line-strong:#cfd9de;
  --blue:#1d9bf0;
  --blue-hover:#1a8cd8;
  --pink:#f91880;
  --green:#00ba7c;
  --hover:#0f14190a;
  --header-h:44px;
  --tabs-h:53px;
  --nav-h:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:15px;line-height:1.35;
  overscroll-behavior-y:none;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
button{font-family:inherit;border:none;background:none;padding:0;color:inherit;cursor:pointer;}
svg{display:block;fill:currentColor;}

/* ---------- header ---------- */
.header{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(12px);
  padding-top:env(safe-area-inset-top);
}
.header-top{
  height:var(--header-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
}
.avatar{
  border-radius:9999px;flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;letter-spacing:.02em;
}
.avatar.sm{width:32px;height:32px;font-size:13px;}
.avatar.md{width:40px;height:40px;font-size:15px;}
.av-me{background:linear-gradient(150deg,#2b2f3a,#6b7280);}
.av-ev{background:linear-gradient(150deg,#7b2ff7,#f107a3);}
.av-y{background:linear-gradient(150deg,#0ea5e9,#22d3ee);}
.av-h{background:linear-gradient(150deg,#f59e0b,#ef4444);}
.x-logo{width:24px;height:24px;}
.header-spacer{width:32px;height:32px;}

/* ---------- tabs ---------- */
.tabs{
  display:flex;align-items:stretch;
  height:var(--tabs-h);
  border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:1 0 auto;min-width:96px;
  display:flex;align-items:center;justify-content:center;gap:3px;
  font-size:15px;font-weight:500;color:var(--sub);
  position:relative;padding:0 14px;
}
.tab[aria-selected="true"]{color:var(--text);font-weight:700;}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:56px;height:4px;border-radius:9999px;background:var(--blue);
}
.tab .chev{width:16px;height:16px;opacity:.9;}
.tab-add{flex:none;min-width:auto;width:52px;color:var(--sub);}

/* ---------- timeline ---------- */
.timeline{min-height:60vh;}
.post{
  display:flex;gap:12px;
  padding:12px 16px 4px;
  border-bottom:1px solid var(--line);
}
.post:active{background:var(--hover);}
.post-body{flex:1;min-width:0;}
.post-head{display:flex;align-items:center;gap:4px;font-size:15px;line-height:20px;}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:47%;}
.badge{width:16px;height:16px;flex:none;color:var(--blue);}
.handle,.dot,.time{color:var(--sub);white-space:nowrap;}
.handle{overflow:hidden;text-overflow:ellipsis;}
.more{margin-left:auto;color:var(--sub);padding:2px 0 2px 8px;flex:none;}
.text{
  margin:2px 0 0;font-size:15px;line-height:1.45;
  white-space:pre-wrap;word-break:break-word;
}
.text a{color:var(--blue);text-decoration:none;}

/* poster (画像の代替として描画) */
.media{
  margin-top:12px;border:1px solid var(--line-strong);border-radius:16px;overflow:hidden;
}
.poster{
  background:
    radial-gradient(120% 80% at 12% 0%,#5b21ff 0%,rgba(91,33,255,0) 60%),
    radial-gradient(100% 90% at 100% 100%,#ff2fb0 0%,rgba(255,47,176,0) 55%),
    linear-gradient(160deg,#2c0a6b,#120436);
  color:#fff;padding:18px 16px 14px;position:relative;
}
.poster-eyebrow{
  display:inline-block;font-size:10px;font-weight:700;letter-spacing:.14em;
  border:1px solid rgba(255,255,255,.6);border-radius:4px;padding:3px 7px;
}
.poster-title{
  font-size:30px;font-weight:800;letter-spacing:.02em;margin:10px 0 2px;
  text-shadow:0 0 18px rgba(255,120,220,.75);
}
.poster-sub{font-size:12px;opacity:.85;margin-bottom:12px;}
.poster-panel{
  background:rgba(255,255,255,.94);color:#1a1035;border-radius:10px;padding:12px 13px;
}
.poster-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px solid rgba(26,16,53,.12);}
.poster-row:last-child{border-bottom:none;}
.poster-row b{font-weight:700;}
.poster-note{font-size:9px;opacity:.7;margin-top:10px;line-height:1.4;}

/* ---------- actions ---------- */
.actions{display:flex;align-items:center;justify-content:space-between;margin:10px -6px 0;}
.act{
  display:flex;align-items:center;gap:4px;
  color:var(--sub);font-size:13px;padding:6px;border-radius:9999px;
  transition:color .12s;
}
.act svg{width:18.75px;height:18.75px;}
.act .cnt{min-width:14px;text-align:left;}
.act.tail{gap:2px;}
.act[data-on="1"].like{color:var(--pink);}
.act[data-on="1"].rt{color:var(--green);}
.act[data-on="1"].bm{color:var(--blue);}
.pop{animation:pop .28s ease;}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.32)}100%{transform:scale(1)}}

/* ---------- empty state (おすすめ) ---------- */
.empty{padding:56px 32px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7;}
.empty b{display:block;color:var(--text);font-size:17px;font-weight:800;margin-bottom:8px;}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:16px;
  bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:9999px;background:var(--blue);
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:35;
}
.fab:active{background:var(--blue-hover);}
.fab svg{width:26px;height:26px;}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-inner{height:var(--nav-h);display:flex;align-items:center;}
.nav-btn{flex:1;display:flex;align-items:center;justify-content:center;position:relative;height:100%;}
.nav-btn svg{width:26px;height:26px;}
.nav-btn.on{color:var(--text);}
.nav-btn:not(.on){color:var(--text);}
.nav-dot{position:absolute;top:12px;left:calc(50% + 7px);width:7px;height:7px;border-radius:9999px;background:var(--blue);}

/* ---------- compose sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:60;background:var(--bg);
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .24s ease;
  padding-top:env(safe-area-inset-top);
}
.sheet.open{transform:translateY(0);}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  height:52px;padding:0 16px;
}
.sheet-head .left{display:flex;align-items:center;gap:16px;}
.txt-btn{font-size:15px;color:var(--text);}
.post-btn{
  background:var(--blue);color:#fff;font-weight:700;font-size:15px;
  padding:8px 17px;border-radius:9999px;
}
.post-btn:disabled{opacity:.5;}
.sheet-body{flex:1;display:flex;gap:12px;padding:8px 16px 0;overflow-y:auto;}
.reply-scope{
  display:inline-flex;align-items:center;gap:5px;color:var(--blue);
  font-size:14px;font-weight:700;margin:2px 0 6px;
}
.reply-scope svg{width:15px;height:15px;}
#input{
  width:100%;border:none;outline:none;resize:none;
  font-family:inherit;font-size:17px;line-height:1.5;color:var(--text);
  min-height:140px;background:transparent;
}
#input::placeholder{color:#8b98a5;}
.sheet-foot{border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));}
.tools{display:flex;align-items:center;gap:2px;}
.tool{color:var(--blue);padding:8px;border-radius:9999px;}
.tool svg{width:20px;height:20px;}
.tool:disabled{opacity:.45;}
.counter{margin-left:auto;display:flex;align-items:center;gap:10px;}
.ring{width:22px;height:22px;transform:rotate(-90deg);}
.ring circle{fill:none;stroke-width:2.5;}
.ring .bg{stroke:var(--line-strong);}
.ring .fg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .1s linear,stroke .1s linear;}
.ring.warn .fg{stroke:#ffd400;}
.ring.over .fg{stroke:#f4212e;}
.remain{font-size:13px;color:var(--sub);}
.remain.over{color:#f4212e;}

/* ---------- toast ---------- */
.toast{
  position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;
  transform:translate(-50%,-14px);
  z-index:80;display:flex;align-items:center;gap:7px;
  background:rgba(83,100,113,.94);color:#fff;
  padding:7px 20px;border-radius:9999px;
  font-size:12.5px;font-weight:500;letter-spacing:.01em;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  box-shadow:0 2px 12px rgba(0,0,0,.18);
  max-width:calc(100vw - 40px);
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast svg{width:14px;height:14px;flex:none;}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;}
}
</style>
</head>
<body>

<!-- ===== header ===== -->
<header class="header">
  <div class="header-top">
    <div class="avatar sm av-me">杳</div>
    <svg class="x-logo" viewBox="0 0 24 24" aria-label="ロゴ" fill="none" stroke="currentColor" stroke-linecap="round">
      <path d="M5.5 5.5 L18.5 18.5" stroke-width="3.6"/>

    </svg>
    <div class="header-spacer"></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="foryou">おすすめ

    </button>

      <svg viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M11 11V4h2v7h7v2h-7v7h-2v-7H4v-2z"/></svg>
    </button>
  </div>
</header>

<!-- ===== timeline ===== -->
<main>
  <section class="timeline" id="tl-main"></section>
  <section class="timeline" id="tl-other" hidden>
    <div class="empty">
      <b>ここはまだ空です</b>
      このデモで動くのは「おすすめ」タブだけです。<br>タブを切り替えてタイムラインに戻ってください。
    </div>
  </section>
</main>

<!-- ===== FAB ===== -->
<button class="fab" id="fab" aria-label="ポストを作成">
  <svg viewBox="0 0 24 24"><path d="M11 11V4h2v7h7v2h-7v7h-2v-7H4v-2z"/></svg>
</button>

<!-- ===== bottom nav ===== -->
<nav class="nav">

    </button>
  </div>
</nav>

<!-- ===== compose sheet ===== -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="ポストを作成">
  <div class="sheet-head">
    <div class="left">
      <button class="txt-btn" id="cancel">キャンセル</button>
    </div>
    <button class="post-btn" id="submit" disabled>ポストする</button>
  </div>

    <div class="avatar md av-me">杳</div>

        全員が返信できます
      </div>
      <textarea id="input" placeholder="いまどうしてる？" rows="6"></textarea>
    </div>
  </div>
  <div class="sheet-foot">
    <div class="tools">
      <button class="tool" disabled aria-label="画像"><svg viewBox="0 0 24 24"><path d="M3 5.5C3 4.12 4.12 3 5.5 3h13C19.88 3 21 4.12 21 5.5v13c0 1.38-1.12 2.5-2.5 2.5h-13C4.12 21 3 19.88 3 18.5v-13zM5.5 5c-.28 0-.5.22-.5.5v9.42l3.05-2.44c.37-.3.9-.3 1.27.01L12.5 15l2.23-2.24c.37-.37.98-.39 1.37-.03L19 15.28V5.5c0-.28-.22-.5-.5-.5h-13zM19 18.5v-.6l-3.55-3.25-2.2 2.2c-.36.37-.95.39-1.34.06L8.7 14.53 5 17.49v1.01c0 .28.22.5.5.5h13c.28 0 .5-.22.5-.5zM9.5 8.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/></svg></button>
      <button class="tool" disabled aria-label="GIF"><svg viewBox="0 0 24 24"><path d="M3 5.5C3 4.12 4.12 3 5.5 3h13C19.88 3 21 4.12 21 5.5v13c0 1.38-1.12 2.5-2.5 2.5h-13C4.12 21 3 19.88 3 18.5v-13zM5.5 5c-.28 0-.5.22-.5.5v13c0 .28.22.5.5.5h13c.28 0 .5-.22.5-.5v-13c0-.28-.22-.5-.5-.5h-13zM12.4 9.5H9.6a.6.6 0 0 0-.6.6v3.8c0 .33.27.6.6.6h2.8v-2.3h-1.3v-1h2.3v3.4c0 .5-.4.9-.9.9H9.3c-.5 0-.9-.4-.9-.9v-4.4c0-.5.4-.9.9-.9h3.1v1zm2.6 0h1v5.5h-1V9.5z"/></svg></button>

      <button class="tool" disabled aria-label="予約"><svg viewBox="0 0 24 24"><path d="M6 3V1.5h2V3h8V1.5h2V3h1.5C20.88 3 22 4.12 22 5.5v14c0 1.38-1.12 2.5-2.5 2.5h-15C3.12 22 2 20.88 2 19.5v-14C2 4.12 3.12 3 4.5 3H6zm-2 6.5v10c0 .28.22.5.5.5h15c.28 0 .5-.22.5-.5v-10H4zm16-1.5V5.5c0-.28-.22-.5-.5-.5h-15c-.28 0-.5.22-.5.5V8h16z"/></svg></button>
      <div class="counter">
        <span class="remain" id="remain" hidden>0</span>

<script>

/* ---- 文字数カウント ---- */
function weight(s){
  const urls = s.match(/https?:\/\/\S+/g) || [];
  let body = s;
  urls.forEach(u => { body = body.replace(u, ""); });
  let w = urls.length * 23;
  for (const ch of body){
    w += /[\x00-\x7F\uFF61-\uFF9F]/.test(ch) ? 1 : 2;
  }
  return w;
}

/* ---- 時刻表示 ---- */
function stamp(t){
  const d = Math.floor((Date.now() - t)/1000);
  if (d < 60) return "今";
  if (d < 3600) return Math.floor(d/60) + "分";
  if (d < 86400) return Math.floor(d/3600) + "時間";
  if (d < 86400*7) return Math.floor(d/86400) + "日";
  const dt = new Date(t);
  return (dt.getMonth()+1) + "月" + dt.getDate() + "日";
}
function num(n){
  if (typeof n === "string") return n;
  if (n === 0) return "";
  if (n >= 10000) return (n/10000).toFixed(1).replace(/\.0$/,"") + "万";
  if (n >= 1000) return n.toLocaleString("ja-JP");
  return String(n);
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function linkify(s){
  return esc(s)
    .replace(/(https?:\/\/[^\s]+|[a-z0-9-]+\.(?:jp|com|net|org)\/[^\s]*)/gi, m => `<a href="#" onclick="return false">${m}</a>`)
    .replace(/(^|\s)([#＃][^\s#＃]+)/g, (m,a,b) => `${a}<a href="#" onclick="return false">${b}</a>`)
    .replace(/(^|\s)(@[A-Za-z0-9_]+)/g, (m,a,b) => `${a}<a href="#" onclick="return false">${b}</a>`);
}

  more:'<path d="M3 12c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2zm7 0c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2zm7 0c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2z"/>',
  badge:'<path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/>'
};

const posterHTML = `
<div class="media"><div class="poster">

function render(){
  const tl = document.getElementById("tl-main");
  tl.innerHTML = posts.map(p => {
    const u = users[p.user];
    return `
<article class="post" data-id="${p.id}">
  <div class="avatar md ${u.av}">${u.initial}</div>
  <div class="post-body">

    <div class="actions">
      <button class="act reply" aria-label="返信"><svg viewBox="0 0 24 24">${ICON.reply}</svg><span class="cnt">${num(p.reply)}</span></button>

      <button class="act like" data-act="like" data-on="${p.likeOn?1:0}" aria-label="いいね"><svg viewBox="0 0 24 24">${p.likeOn?ICON.likeOn:ICON.like}</svg><span class="cnt">${num(p.like)}</span></button>

/* ---- いいね / リポスト / ブックマーク ---- */
document.getElementById("tl-main").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const id = +btn.closest(".post").dataset.id;
  const p = posts.find(x => x.id === id);
  const kind = btn.dataset.act;
  const onKey = kind + "On";
  p[onKey] = !p[onKey];
  if (kind !== "bm") p[kind] += p[onKey] ? 1 : -1;
  btn.dataset.on = p[onKey] ? 1 : 0;
  if (kind === "like") btn.querySelector("svg").innerHTML = p[onKey] ? ICON.likeOn : ICON.like;
  if (kind === "bm")  btn.querySelector("svg").innerHTML = p[onKey] ? ICON.bmOn  : ICON.bm;
  const cnt = btn.querySelector(".cnt");
  if (cnt) cnt.textContent = num(p[kind]);
  btn.querySelector("svg").classList.remove("pop");
  void btn.offsetWidth;
  if (p[onKey]) btn.querySelector("svg").classList.add("pop");
});

document.querySelectorAll(".tab[data-tab]").forEach(tab => {

    document.getElementById("tl-main").hidden = !main;
    document.getElementById("tl-other").hidden = main;
    window.scrollTo({top:0});
  });
});

/* ---- 作成シート ---- */
const sheet = document.getElementById("sheet");
const input = document.getElementById("input");
const submit = document.getElementById("submit");
const ring = document.getElementById("ring");
const ringfg = document.getElementById("ringfg");
const remain = document.getElementById("remain");
const C = 2 * Math.PI * 9.5;

function openSheet(){
  sheet.classList.add("open");
  document.body.style.overflow = "hidden";
  setTimeout(() => input.focus(), 220);
}
function closeSheet(){
  sheet.classList.remove("open");
  document.body.style.overflow = "";
  input.blur();
}
document.getElementById("fab").addEventListener("click", openSheet);
document.getElementById("cancel").addEventListener("click", () => {
  input.value = "";
  update();
  closeSheet();
});

function update(){
  const w = weight(input.value);
  const left = LIMIT - w;
  const has = input.value.trim().length > 0;
  submit.disabled = !has || left < 0;

  ring.hidden = !has;
  ringfg.setAttribute("stroke-dashoffset", String(Math.max(0, C - C * Math.min(w / LIMIT, 1))));
  ring.classList.toggle("warn", left <= WARN && left >= 0);
  ring.classList.toggle("over", left < 0);

  const showNum = has && left <= WARN;
  remain.hidden = !showNum;
  remain.classList.toggle("over", left < 0);
  if (showNum) remain.textContent = String(Math.ceil(left / 2)); // 全角換算の残り
}
input.addEventListener("input", update);

/* ---- 投稿 ---- */
submit.addEventListener("click", () => {
  const text = input.value.replace(/\s+$/,"");
  if (!text) return;
  // 実際のXと同じく、送信したポストはタイムラインの先頭には差し込まれない。
  // 内部の myPosts に記録し、確認はトーストのみ。
  myPosts.unshift({ t: Date.now(), text });
  input.value = "";
  update();
  closeSheet();
  toast("ポストを送信しました");
});

/* ---- トースト ---- */
let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  document.getElementById("toast-text").textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}

/* ---- 未実装ボタンの案内 ---- */
document.body.addEventListener("click", e => {
  if (e.target.closest(".nav-btn:not(.on)")) toast("このデモではホームだけ開けます");
});
